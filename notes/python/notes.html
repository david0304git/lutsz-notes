<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Python 零基礎學習筆記 · 第 3–6 課</title>
<style>
/* ==========================================================================
 設計系統（Design Tokens）
 ========================================================================== */
:root{
 /* 淺色・溫暖基調 */
 --bg:#fdf8f1; /* 米白（頁面底色） */
 --bg-2:#fbf3e7;
 --bg-3:#f5e9d9;
 --panel:#fffdf9;
 --panel-2:#fdf6ec;
 --line:#e8d9c3;
 --line-soft:#f0e5d4;
 --txt:#3b2f26; /* 深咖啡（主文字） */
 --txt-2:#6b5a4b;
 --txt-3:#a08e7c;
 --brand:#c2600f; /* 暖橙（主色） */
 --brand-dim:#a54f0a;
 --blue:#2f6fb5;
 --blue-l:#1f5c9e;
 --violet:#8b5cf6;
 --amber:#c98a04;
 --rose:#d94f5c;
 --green:#1f8a4c;
 --code-bg:#fffaf0;
 --code-fg:#4a3a2c;
 --radius:16px;
 --radius-s:10px;
 --shadow:0 2px 4px rgba(120,85,40,.05), 0 10px 26px rgba(120,85,40,.09);
 --mono:"SF Mono",Menlo,Consolas,"DejaVu Sans Mono","Noto Sans Mono",monospace;
 --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Hiragino Sans TC","Microsoft JhengHei","Noto Sans TC",sans-serif;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
 margin:0;background:
 radial-gradient(1100px 640px at 10% -8%, rgba(255,196,120,.28), transparent 62%),
 radial-gradient(900px 560px at 94% 2%, rgba(255,168,150,.20), transparent 64%),
 radial-gradient(700px 500px at 50% 110%, rgba(255,222,168,.22), transparent 70%),
 var(--bg);
 color:var(--txt);font-family:var(--sans);line-height:1.8;
 -webkit-font-smoothing:antialiased;
 font-size:16.5px;
}
::selection{background:rgba(255,183,77,.45)}

/* 捲軸 */
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background:#e0cdb2;border-radius:99px}
*::-webkit-scrollbar-thumb:hover{background:#cdb595}

/* ==========================================================================
 版面：左側導覽 + 右側內容
 ========================================================================== */
.layout{display:flex;min-height:100vh}

.sidebar{
 width:290px;flex:0 0 290px;background:rgba(255,253,248,.94);
 border-right:1px solid var(--line-soft);padding:22px 18px 40px;
 position:sticky;top:0;height:100vh;overflow-y:auto;z-index:40;
 backdrop-filter:blur(12px);
}
.brand{display:flex;align-items:center;gap:11px;margin-bottom:6px}
.brand-logo{
 width:38px;height:38px;border-radius:11px;flex:0 0 38px;
 background:linear-gradient(140deg,#ffb347,#e8734a);
 display:grid;place-items:center;font-weight:800;color:#fff;font-size:17px;
 box-shadow:0 8px 18px rgba(232,115,74,.32)
}
.brand-txt b{display:block;font-size:15.5px;letter-spacing:.2px}
.brand-txt span{font-size:11.5px;color:var(--txt-3);letter-spacing:.4px}
.sidebar-note{
 font-size:12.8px;color:var(--txt-2);margin:14px 0 18px;padding:12px 13px;
 background:#fff8ec;border:1px solid var(--line-soft);border-radius:var(--radius-s)
}
.sidebar-note b{color:var(--brand)}

.nav-group-title{
 font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--txt-3);
 margin:20px 0 9px;font-weight:700
}
.nav-item{
 display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;
 background:transparent;border:1px solid transparent;color:var(--txt-2);
 padding:11px 12px;border-radius:12px;cursor:pointer;font-family:inherit;
 font-size:14px;line-height:1.5;transition:.18s;margin-bottom:4px
}
.nav-item:hover{background:#fdf3e6;color:var(--txt);border-color:var(--line)}
.nav-item.active{
 background:linear-gradient(100deg,rgba(255,183,71,.26),rgba(255,140,105,.18));
 border-color:rgba(194,96,15,.42);color:var(--txt)
}
.nav-item .n-num{
 flex:0 0 26px;height:26px;border-radius:8px;display:grid;place-items:center;
 background:var(--bg-3);font-size:12px;font-weight:800;color:var(--brand);font-family:var(--mono)
}
.nav-item.active .n-num{background:linear-gradient(140deg,#ffb347,#e8734a);color:#fff}
.nav-item .n-body{flex:1;min-width:0}
.nav-item .n-title{font-weight:650;display:block}
.nav-item .n-sub{font-size:11.5px;color:var(--txt-3);display:block;margin-top:1px}
.nav-item .n-check{font-size:13px;opacity:0;transition:.2s}
.nav-item.done .n-check{opacity:1}

.toc-box{margin-top:20px;border-top:1px dashed var(--line-soft);padding-top:14px}
.toc-box .nav-group-title{margin-top:4px}
.toc-link{
 display:block;width:100%;text-align:left;background:none;border:0;color:var(--txt-3);
 font-family:inherit;font-size:12.8px;padding:6px 9px;border-radius:8px;cursor:pointer;
 border-left:2px solid transparent;transition:.15s
}
.toc-link:hover{color:var(--brand);background:var(--panel-2);border-left-color:var(--brand)}

/* 主要內容 */
.main{flex:1;min-width:0;padding:0 clamp(16px,3.4vw,54px) 120px}
.wrap{max-width:1000px;margin:0 auto}

.lesson{display:none;animation:fade .32s ease}
.lesson.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.lesson-head{padding:46px 0 8px}
.kicker{
 display:inline-flex;align-items:center;gap:8px;font-size:12px;letter-spacing:1.2px;
 text-transform:uppercase;color:var(--brand);font-weight:750;
 background:#fff3e0;border:1px solid #f0d5aa;
 padding:6px 13px;border-radius:99px;margin-bottom:16px
}
.lesson-head h1{
 font-size:clamp(28px,4.4vw,43px);line-height:1.2;margin:0 0 12px;letter-spacing:-.5px
}
.lesson-head h1 em{
 font-style:normal;background:linear-gradient(100deg,#e8734a,#d99a1f 55%,#c2600f);
 -webkit-background-clip:text;background-clip:text;color:transparent
}
.lesson-head p.lead{font-size:16.5px;color:var(--txt-2);margin:0;max-width:74ch}
.head-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.chip{
 font-size:12.8px;color:var(--txt-2);background:#fffaf2;
 border:1px solid var(--line);padding:6px 12px;border-radius:99px
}

/* 目錄卡 */
.goals{
 margin:26px 0 8px;background:linear-gradient(150deg,#fffaf0,#fff5e8);
 border:1px solid #f0dcc0;border-radius:var(--radius);padding:21px 23px
}
.goals h4{margin:0 0 12px;font-size:14.5px;color:var(--brand-dim);letter-spacing:.4px}
.goals ol{margin:0;padding-left:20px;color:var(--txt-2);font-size:14.5px}
.goals li{margin:5px 0}

/* 段落 */
section.sec{padding-top:44px;scroll-margin-top:20px}
h2.s-title{
 font-size:clamp(21px,2.7vw,27px);margin:0 0 6px;letter-spacing:-.2px;
 display:flex;align-items:baseline;gap:12px;flex-wrap:wrap
}
h2.s-title .s-idx{
 font-family:var(--mono);font-size:13.5px;color:#fff;font-weight:750;
 background:linear-gradient(140deg,#ffb347,#e8734a);border:0;
 padding:4px 11px;border-radius:8px;box-shadow:0 2px 6px rgba(232,115,74,.24)
}
.s-sub{color:var(--txt-3);font-size:14px;margin:0 0 18px}
h3{font-size:18px;margin:32px 0 10px;color:#2f2318}
h4{font-size:16px;margin:22px 0 8px;color:var(--brand-dim)}
p{margin:11px 0;color:var(--txt-2)}
ul,ol{color:var(--txt-2);padding-left:22px}
li{margin:6px 0}
strong{color:#2a1f15;font-weight:700}
a{color:var(--brand)}

code{
 font-family:var(--mono);font-size:.9em;background:#fdeed8;color:#9a4a0d;
 padding:2px 6px;border-radius:6px;border:1px solid #f0dabb;white-space:nowrap
}
.kbd{
 font-family:var(--mono);font-size:.85em;background:var(--bg-3);border:1px solid var(--line);
 border-bottom-width:2px;border-radius:6px;padding:1px 6px;color:var(--txt-2)
}

/* 程式碼區塊 */
.code{
 background:var(--code-bg);border:1px solid var(--line);border-radius:var(--radius-s);
 margin:16px 0;overflow:hidden;box-shadow:0 1px 2px rgba(120,85,40,.05)
}
.code-top{
 display:flex;justify-content:space-between;align-items:center;gap:12px;
 padding:9px 14px;background:#fdf1e0;border-bottom:1px solid var(--line);
 font-size:11.5px;color:#9a8574;font-family:var(--mono);letter-spacing:.4px
}
.code-top .dots{display:flex;gap:5px}
.code-top .dots i{width:9px;height:9px;border-radius:50%;display:block}
.code-top .dots i:nth-child(1){background:#ff5f57}
.code-top .dots i:nth-child(2){background:#febc2e}
.code-top .dots i:nth-child(3){background:#28c840}
.code pre{
 margin:0;padding:14px 16px;overflow-x:auto;font-family:var(--mono);
 font-size:13.6px;line-height:1.9;color:var(--code-fg)
}
.code pre .ln{color:#c9b49a;user-select:none;display:inline-block;width:2.1em;text-align:right;margin-right:14px}
.code pre b{color:var(--brand);font-weight:700}
.tok-kw{color:#b8347a;font-weight:650}
.tok-fn{color:#1f6fb2;font-weight:600}
.tok-str{color:#1f7a46}
.tok-num{color:#9a6b00}
.tok-com{color:#a08e7c;font-style:italic}
.tok-op{color:#7c5cd6}

/* 輸出區塊 */
.out{
 background:#fffdf6;border:1px solid #e8d9c3;border-left:3px solid #e08a2e;
 border-radius:var(--radius-s);padding:11px 15px;margin:12px 0;
 font-family:var(--mono);font-size:13.4px;line-height:1.85;color:#5a4632;white-space:pre-wrap
}
.out .out-label{
 display:block;font-size:11px;letter-spacing:1.2px;color:#c07a1e;
 text-transform:uppercase;margin-bottom:5px;font-family:var(--sans)
}

/* 提示框 */
.callout{
 border-radius:var(--radius-s);padding:15px 18px;margin:18px 0;
 border:1px solid var(--line);background:#fffdf7;font-size:15px
}
.callout .c-title{font-weight:750;display:flex;align-items:center;gap:8px;margin-bottom:5px;font-size:14.5px}
.callout p{margin:5px 0}
.callout.tip{border-color:#f0cf9a;background:#fff8e9}
.callout.tip .c-title{color:var(--brand)}
.callout.warn{border-color:#eccf92;background:#fffaea}
.callout.warn .c-title{color:var(--amber)}
.callout.danger{border-color:#f0b8bd;background:#fef2f3}
.callout.danger .c-title{color:var(--rose)}
.callout.info{border-color:#b9d3ec;background:#f2f7fd}
.callout.info .c-title{color:var(--blue-l)}
.callout.analogy{border-color:#cdbdf5;background:#f6f2fe}
.callout.analogy .c-title{color:var(--violet)}

/* 表格 */
.tbl-wrap{overflow-x:auto;margin:16px 0;border:1px solid var(--line-soft);border-radius:var(--radius-s)}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:420px}
th,td{padding:9px 13px;text-align:left;border-bottom:1px solid var(--line-soft)}
th{background:#fdf0dc;color:#5a3c12;font-weight:750;font-size:13.4px;white-space:nowrap}
td{color:var(--txt-2)}
tbody tr:nth-child(even){background:#fefaf3}
tbody tr:hover{background:#fff4e2}
tbody tr:last-child td{border-bottom:0}
td code{white-space:nowrap}
td.yes{color:var(--green);font-weight:700}
td.no{color:var(--rose);font-weight:700}

/* ==========================================================================
 互動元件
 ========================================================================== */
.anim{
 background:#fffdf8;
 border:1px solid var(--line);border-radius:var(--radius);
 margin:24px 0;overflow:hidden;box-shadow:var(--shadow)
}
.anim-head{
 display:flex;align-items:center;justify-content:space-between;gap:12px;
 padding:13px 18px;background:#fdf1e0;border-bottom:1px solid var(--line);
 flex-wrap:wrap
}
.anim-head .a-name{font-weight:700;font-size:14.5px;display:flex;align-items:center;gap:9px}
.anim-head .a-name .badge{
 font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:#fff;
 background:linear-gradient(100deg,#ffb347,#e8734a);
 padding:3px 8px;border-radius:6px;font-weight:800
}
.anim-stage{padding:20px 17px;min-height:120px}
.anim-foot{
 display:flex;align-items:center;gap:9px;flex-wrap:wrap;
 padding:13px 18px;border-top:1px solid var(--line-soft);background:#fefaf3
}
.anim-explain{
 padding:0 18px 16px;font-size:15px;color:var(--txt-2);min-height:26px;line-height:1.8
}
.anim-explain .step-txt{display:block}
.anim-explain b{color:var(--brand-dim);font-weight:700}

.btn{
 font-family:inherit;font-size:13.4px;font-weight:650;cursor:pointer;
 background:#fffaf2;color:var(--txt-2);border:1px solid var(--line);
 padding:7px 14px;border-radius:9px;transition:.16s;display:inline-flex;
 align-items:center;gap:6px
}
.btn:hover{background:#fdf0dc;color:var(--brand-dim);border-color:#e3c9a3}
.btn:active{transform:translateY(1px)}
.btn.primary{background:linear-gradient(100deg,#ffb347,#e8734a);color:#fff;border:0;font-weight:750;box-shadow:0 4px 12px rgba(232,115,74,.28)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.38;cursor:not-allowed;transform:none}
.step-pill{
 margin-left:auto;font-family:var(--mono);font-size:12.2px;color:var(--txt-3);
 background:var(--panel-2);border:1px solid var(--line-soft);
 padding:5px 11px;border-radius:99px;white-space:nowrap
}

/* 字元格（索引可視化） */
.chars{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0 4px}
.chars.center{justify-content:center}
.ch{
 min-width:40px;padding:6px 4px;border-radius:9px;background:var(--panel-2);
 border:1px solid var(--line-soft);text-align:center;transition:.22s;position:relative
}
.ch .c-val{font-family:var(--mono);font-size:17.5px;color:#2a1f15;line-height:1.35;display:block;font-weight:650}
.ch .c-idx{font-family:var(--mono);font-size:10.5px;color:var(--txt-3);display:block}
.ch .c-neg{font-family:var(--mono);font-size:10.5px;color:#6d7ba3;display:block}
.ch.hl-shape{background:#ffe9cc;border-color:var(--brand);transform:translateY(-4px)}
.ch.hl-shape .c-val{color:var(--brand-dim)}
.ch.hl-brand{background:#ffe9cc;border-color:var(--brand)}
.ch.hl-blue{background:#e3eefb;border-color:#7ba7d4}
.ch.hl-amber{background:#fff4d6;border-color:#d9a92f}
.ch.hl-rose{background:#fde8ec;border-color:#e08a98}
.ch.hl-violet{background:#f0ebfd;border-color:#a98ceb}
.ch.dim{opacity:.36}
.ch.pop{animation:pop .4s ease}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.14)}100%{transform:scale(1)}}
.ch.gone{opacity:.12;text-decoration:line-through}

/* 記憶體圖 */
.mem{display:grid;grid-template-columns:auto 1fr;gap:26px;align-items:start}
.mem-vars{display:flex;flex-direction:column;gap:12px}
.mem-var{
 background:var(--panel-2);border:1px solid var(--line-soft);border-radius:10px;
 padding:9px 13px;font-family:var(--mono);font-size:13.5px;min-width:112px
}
.mem-var .v-name{color:var(--blue-l);display:block;font-size:11.5px;letter-spacing:.5px}
.mem-var .v-val{color:#2a1f15;font-size:16.5px;font-weight:650}
.mem-var.hl{border-color:var(--amber);box-shadow:0 0 0 3px rgba(251,191,36,.14)}
.mem-objs{display:flex;flex-direction:column;gap:14px}
.mem-obj{
 border:1.5px dashed var(--line);border-radius:12px;padding:11px 14px;
 background:#fffdf7;position:relative
}
.mem-obj.alive{border-style:solid;border-color:var(--brand)}
.mem-obj .o-addr{font-family:var(--mono);font-size:10.5px;color:var(--txt-3);margin-bottom:6px;display:block}
.mem-obj .o-cells{display:flex;gap:5px;flex-wrap:wrap}
.mem-obj .o-cell{
 min-width:42px;padding:5px 9px;background:#fff7ea;border:1px solid var(--line);
 border-radius:7px;font-family:var(--mono);font-size:13.5px;text-align:center;color:#2a1f15;transition:.25s
}
.mem-obj .o-cell.new{background:rgba(94,234,212,.2);border-color:var(--brand);animation:pop .45s ease}
.mem-obj .o-cell.chg{background:rgba(251,191,36,.22);border-color:var(--amber);animation:pop .45s ease}
.mem-obj .o-cell.rm{opacity:.2;text-decoration:line-through}
.mem-link{
 font-family:var(--mono);font-size:12px;color:var(--amber);
 padding-left:8px;letter-spacing:1px
}

/* 流程圖 */
.flow{display:flex;flex-direction:column;align-items:center;gap:0;margin:8px 0}
.flow-row{display:flex;flex-direction:column;align-items:center;width:100%}
.fbox{
 padding:11px 20px;border-radius:11px;border:1.5px solid var(--line);
 background:var(--panel-2);font-size:14px;text-align:center;transition:.25s;
 max-width:560px;font-family:var(--mono)
}
.fbox.hl{border-color:var(--brand);background:#ffeed5;box-shadow:0 0 0 4px rgba(224,138,46,.16);color:#2a1f15}
.fbox.hit{border-color:#3f9d63;background:#e6f7ec;box-shadow:0 0 0 4px rgba(63,157,99,.14)}
.fbox.dead{opacity:.34}
.fbox.cond{
 border-radius:99px;border-color:#d99a1f;background:#fff6e0;
 font-family:var(--mono);color:#7a5410
}
.fbox.cond.hl{border-color:#d99a1f;background:#ffedc4;box-shadow:0 0 0 4px rgba(217,154,31,.18)}
.farrow{width:2px;height:22px;background:var(--line);position:relative;transition:.25s}
.farrow.hl{background:var(--brand);box-shadow:0 0 8px rgba(94,234,212,.7)}
.farrow span{
 position:absolute;left:13px;top:0;font-size:11.5px;color:var(--txt-3);
 font-family:var(--mono);white-space:nowrap
}
.f-branch{display:flex;gap:20px;justify-content:center;flex-wrap:wrap;width:100%}
.f-branch>div{display:flex;flex-direction:column;align-items:center;gap:0;flex:1;min-width:150px}

/* 追蹤面板 */
.trace{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px}
@media(max-width:820px){.trace{grid-template-columns:1fr}}
.trace-code{
 background:var(--code-bg);border:1px solid var(--line-soft);border-radius:10px;
 padding:11px 0;overflow-x:auto
}
.tl{
 display:flex;gap:10px;padding:3px 14px;font-family:var(--mono);font-size:13.6px;
 line-height:1.85;white-space:pre;color:#4a3a2c;border-left:3px solid transparent;transition:.18s
}
.tl .tl-n{color:#c9b49a;user-select:none;min-width:1.3em;text-align:right}
.tl.on{background:#ffeed6;border-left-color:var(--brand)}
.tl.on .tl-t{color:#2a1f15;font-weight:600}
.tl.past{opacity:.55}
.tl.hit{background:#fff5dd;border-left-color:#d99a1f}
.tl.out .tl-t{color:#1f7a46}
.trace-side{display:flex;flex-direction:column;gap:12px}
.trace-panel{
 background:var(--panel-2);border:1px solid var(--line-soft);border-radius:10px;padding:11px 14px
}
.trace-panel h5{
 margin:0 0 8px;font-size:11px;letter-spacing:1.3px;text-transform:uppercase;color:var(--txt-3);font-weight:750
}
.vlist{display:flex;flex-wrap:wrap;gap:7px}
.vpill{
 font-family:var(--mono);font-size:12.8px;background:var(--bg-3);border:1px solid var(--line);
 padding:4px 10px;border-radius:8px;color:var(--txt-2);transition:.2s
}
.vpill b{color:#2a1f15;font-weight:650}
.vpill.chg{border-color:#d9a92f;background:#fff4d6}
.vpill.set{border-color:var(--brand);background:#ffeed5}
.console{
 font-family:var(--mono);font-size:13.5px;background:#fffdf6;border:1px solid #e8d9c3;
 border-radius:8px;padding:10px 13px;color:#5a4632;min-height:44px;white-space:pre-wrap;line-height:1.85
}
.console .cursor{display:inline-block;width:7px;height:15px;background:var(--brand);animation:blink 1s steps(2) infinite;vertical-align:-2px}
@keyframes blink{50%{opacity:0}}

/* 真值表探索器 */
.tt-toggles{display:flex;gap:26px;flex-wrap:wrap;margin-bottom:18px}
.tt-var{display:flex;align-items:center;gap:11px}
.tt-sw{
 width:70px;height:36px;border-radius:99px;background:#efdcc6;border:1px solid var(--line);
 position:relative;cursor:pointer;transition:.25s;padding:0
}
.tt-sw::after{
 content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;
 background:#d98a96;transition:.25s
}
.tt-sw[data-val="1"]{background:#d9f0e0;border-color:#4caf6d}
.tt-sw[data-val="1"]::after{transform:translateX(31px);background:#4caf6d}

}

/* ==========================================================================

 ========================================================================== */
.anim-explain{
 padding:14px 18px 16px;font-size:15.4px;color:var(--txt);line-height:1.85;
 background:#fffaf0;border-top:1px solid var(--line-soft);min-height:78px
}
.anim-explain .ex-act{
 display:block;font-family:var(--mono);font-size:13.4px;font-weight:700;
 color:#9a4a0d;background:#fff1dd;border:1px solid #f2dcc0;
 padding:6px 11px;border-radius:8px;margin-bottom:9px;
 word-break:break-word;line-height:1.6
}
.anim-explain .ex-desc{display:block;color:#4a3a2c;margin-bottom:8px}
.anim-explain .ex-key{
 display:block;background:#fff3df;border-left:4px solid #e79a3c;
 padding:9px 13px;border-radius:0 8px 8px 0;color:#7a4a10;
 font-size:14.8px;line-height:1.75
}
.anim-explain .ex-key b, .anim-explain .ex-key strong{color:#6a3c08}
/* 沒有拆出動作時，維持原本的單段落呈現 */
.anim-explain > .step-txt{display:block}


/* ==========================================================================
 平滑過渡
 ========================================================================== */
@keyframes popIn{
 from{ opacity:0; transform:translateY(10px) scale(.96) }
 to { opacity:1; transform:none }
}
@keyframes expIn{
 from{ opacity:0; transform:translateY(6px) }
 to { opacity:1; transform:none }
}

/* 互動舞台：切換內容時柔和淡入 */
.anim-stage{ transition:opacity .16s ease }
.anim-stage.fading{ opacity:0 }

/* 每一個「有名字的格子」在換步時平滑移動 */
[data-k]{
 transition:transform .42s cubic-bezier(.2,.8,.2,1),
 opacity .3s ease,
 background-color .3s ease,
 border-color .3s ease,
 color .3s ease;
 will-change:transform
}

/* 解說文字：每次換步淡入 */
.anim-explain.exp-in{ animation:expIn .34s cubic-bezier(.2,.8,.2,1) both }

/* 進度數字：換步時輕輕彈一下 */
.step-pill{ transition:background-color .25s ease, color .25s ease }
.anim-foot .step-pill.bump{ animation:popIn .3s ease }

/* 按鈕：滑順的反應 */
.btn{
 transition:background-color .18s ease, color .18s ease, border-color .18s ease,
 transform .14s cubic-bezier(.2,.8,.2,1), box-shadow .2s ease, opacity .2s ease
}
.btn:active:not([disabled]){ transform:translateY(1px) scale(.985) }

/* 字元格 / 記憶體格 / 流程圖：數值變化時平滑過渡 */
.ch, .mem-obj .o-cell, .fbox, .vpill, .tt-card, .tl{
 transition:transform .3s cubic-bezier(.2,.8,.2,1),
 background-color .32s ease, border-color .32s ease,
 color .28s ease, opacity .32s ease, box-shadow .3s ease
}

/* 連線（流程圖箭頭）也跟著變化 */
.farrow{ transition:background-color .32s ease, box-shadow .32s ease, opacity .3s ease }

/* 尊重系統的「減少動態效果」設定 */
@media (prefers-reduced-motion: reduce){
 .anim-stage, [data-k], .btn, .ch, .mem-obj .o-cell, .fbox, .vpill, .tt-card, .tl{
 transition:none !important; animation:none !important
 }
 .anim-stage.fading{ opacity:1 }
}

<script>
/* ==========================================================================
 0. 小工具
 ========================================================================== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const range = n => Array.from({ length: n }, (_, i) => i);

/* 把 Python 原始碼上色（極簡版，只求好看好讀） */
const PY_KW = ["import","from","as","if","elif","else","for","while","in","not","and","or",
 "return","def","class","True","False","None","break","continue","pass","with","try","except","lambda","global","is","del","assert","raise","yield"];
function hlCode(line){
 const src = String(line);
 const KW = new Set(PY_KW);
 const BI = new Set(["print","input","len","int","str","float","range","random",
 "choice","ord","chr","max","min","sum","sorted","list","tuple","abs","round",
 "type","append","extend","insert","remove","pop","sort","reverse","index",
 "find","rfind","upper","lower","title","strip","lstrip","rstrip","split",
 "join","count","replace","center","ljust","rjust","expandtabs","isdigit"]);
 const span = (c, t) => '<span class="' + c + '">' + t + '</span>';
 let out = '', i = 0;
 const n = src.length;
 let prev = '';
 while (i < n){
 const c = src[i];
 /* 註解：一路吃到底 */
 if (c === '#'){ out += span('tok-com', esc(src.slice(i))); break; }
 /* 字串 */
 if (c === '"' || c === "'"){
 let j = i + 1;
 while (j < n && src[j] !== c){
 if (src[j] === '\\') j++;
 j++;
 }
 const end = Math.min(j + 1, n);
 out += span('tok-str', esc(src.slice(i, end)));
 i = end; prev = 'lit'; continue;
 }
 /* 識別字 / 關鍵字 / 內建函式 */
 if (/[A-Za-z_]/.test(c)){
 let j = i;
 while (j < n && /[A-Za-z0-9_]/.test(src[j])) j++;
 const word = src.slice(i, j);
 let k = j;
 while (k < n && src[k] === ' ') k++;
 const isCall = src[k] === '(' || src[k] === '.';
 if (KW.has(word)) out += span('tok-kw', word);
 else if (BI.has(word) && isCall) out += span('tok-fn', word);
 else out += esc(word);
 i = j; prev = 'w'; continue;
 }
 /* 數字（前面不能緊接字母，避免 1st、2nd 被上色） */
 if (/[0-9]/.test(c) && !/[A-Za-z0-9_]/.test(prev)){
 let j = i;
 while (j < n && /[0-9._]/.test(src[j])) j++;
 out += span('tok-num', esc(src.slice(i, j)));
 i = j; prev = 'n'; continue;
 }
 out += esc(c);
 prev = c;
 i++;
 }
 return out;
}

/* 產生程式碼區塊。code 可以是字串或字串陣列 */
function codeBlock(code, label){
 const lines = Array.isArray(code) ? code : String(code).split("\n");

 return `<div class="code">
 <div class="code-top"><span class="dots"><i></i><i></i><i></i></span><span>${esc(label || "python")}</span></div>
 <pre>${body}</pre></div>`;
}

function table(rows, opts = {}){

/* ==========================================================================
 1. 互動核心：每個元件 = 一串「步驟」，可用播放 / 上下步 / 重設控制
 ========================================================================== */
/* ==========================================================================
 解釋美化器：把每一步拆成「① 這一步在做什麼 → ② 白話說明 → ③ 重點」
 一次只講一件事，句子短、看得懂。
 ========================================================================== */
const SIMPLIFY = [
 [/課本(的)?定義[：:]?/g, ""],
 [/\(condition\)/g, ""], [/\(equal to\)/g, ""], [/\(not equal to\)/g, ""],
 [/\([a-zA-Z ]{3,20}\)/g, ""],
 [/顧名思義[，,]?/g, ""],
 [/換句話說[，,]?/g, "也就是說，"],
];

function prettyExplain(raw){
 if (!raw) return "";
 let s = String(raw).trim();
 SIMPLIFY.forEach(function(p){ s = s.replace(p[0], p[1]); });

 /* 重點：① 有 標記 ② 句尾的粗體且該句完整 */
 let key = "";
 const km = s.match(/\s*([\s\S]*)$/);
 if (km){ key = km[1].trim(); s = s.slice(0, km.index).trim(); }
 if (!key){
 /* 句尾粗體最優先 */
 const sm = s.match(/[^。]*？?<(?:strong|b)>([^<]{4,60})<\/(?:strong|b)>\s*。\s*$/);
 if (sm && sm[0].trim() !== s.trim()){
 key = sm[1].trim();
 s = s.slice(0, s.length - sm[0].length).trim();
 }
 }
 if (!key){
 /* 其次：句中唯一的一段 <strong>（要像句子，不能只是程式碼） */
 const all = [...s.matchAll(/<strong>([^<]{5,40})<\/strong>/g)];
 if (all.length === 1){
 const inner = all[0][1].trim();
 const rest = s.replace(all[0][0], "").trim();
 const plain = inner.replace(/<[^>]+>/g, "");
 const looksLikeCode = /^["'\[\(\{]/.test(plain) || /^[A-Za-z_][A-Za-z0-9_]*$/.test(plain);
 const hasPunct = /[，、。：；！？]/.test(plain);
 if (!looksLikeCode && (hasPunct || plain.length >= 8) && rest.length > 12){
 key = inner;
 s = rest.replace(/[，、；]\s*$/, "").trim();
 }
 }
 }
 s = s.replace(/[，、]\s*$/, "").trim();

 /* 動作 vs 說明 */
 let action = "", desc = s;
 const ci = s.indexOf("：");
 if (ci > 0 && ci <= 70){
 action = s.slice(0, ci).replace(/[。，、]\s*$/, "").trim();
 desc = s.slice(ci + 1).trim();
 }

 /* 說明切成短句；保護「1.」「2.」這種編號 */
 const guarded = desc.replace(/(\d)\.(?=\s|$)/g, "$1\\.<K>");
 let sentences = guarded.split(/。(?![^<]*>)/)
 .map(function(x){ return x.replace(/<K>/g, ".").trim(); })
 .filter(Boolean);
 sentences = sentences.reduce(function(acc, cur){
 const plain = cur.replace(/<[^>]+>/g, "");
 if (acc.length && plain.length < 5) acc[acc.length - 1] += "。" + cur;
 else acc.push(cur);
 return acc;
 }, []);

 let html = "";
 if (action) html += '<span class="ex-act">' + action + "</span>";
 if (sentences.length)
 html += '<span class="ex-desc">' + sentences.map(function(x){ return x + "。"; }).join("<br>") + "</span>";
 if (key){
 const kp = key.replace(/<[^>]+>/g, "").trim();
 const dp = sentences.join("").replace(/<[^>]+>/g, "");
 const overlap = kp.length && dp.includes(kp);
 if (!overlap && kp.length >= 4) html += '<span class="ex-key"> ' + key + "</span>";
 }
 return html || s;
}




/* ==========================================================================
 自動為互動元素加上 data-k（FLIP 平滑過渡用）
 同一個「東西」在下一步若還在，就會平滑滑到新位置，而不是瞬間跳過去。
 ========================================================================== */
function keyify(root){
 if (!root || !root.querySelectorAll) return;
 const seen = new Map();

 /* 方便的簽章：標籤 + 主要 class + 內容 */
 const sig = el => (el.tagName || "") + "|" +
 (el.className || "").toString().replace(/\\s+/g, ".") + "|" +
 (el.textContent || "").trim().slice(0, 40);

 /* 1) 記憶體圖的變數與儲存格：用裡面的文字當身分 */
 root.querySelectorAll(".mem-var").forEach(v => {
 const nm = (v.querySelector(".v-name") || {}).textContent || "";
 if (nm) v.dataset.k = "mv:" + nm.trim();
 });
 root.querySelectorAll(".o-cell").forEach(c => {
 const t = (c.textContent || "").trim();
 const obj = c.closest(".mem-obj");
 const oi = obj && obj.parentElement ? Array.prototype.indexOf.call(obj.parentElement.children, obj) : 0;
 /* 同一格東西在不同步驟可能換位置 → 用「文字 + 出現順序」當身分 */
 const base = "oc:" + t;
 const n = (seen.get(base) || 0) + 1;
 seen.set(base, n);
 c.dataset.k = base + "#" + n + "@" + oi;
 });

 /* 2) 字元格：用索引當身分（位置固定，數值才不會亂跑） */
 root.querySelectorAll(".chars").forEach((row, ri) => {
 row.querySelectorAll(".ch").forEach((ch, ci) => {
 ch.dataset.k = "ch:" + ri + ":" + ci;
 });
 });

 /* 3) 流程圖方塊：用文字當身分 */
 root.querySelectorAll(".fbox").forEach(b => {
 const t = (b.textContent || "").trim().slice(0, 40);
 const base = "fb:" + t;
 const n = (seen.get(base) || 0) + 1;
 seen.set(base, n);
 b.dataset.k = base + "#" + n;
 });

 /* 4) 資料列（vpill / 輸出列 / 真值卡）：用文字當身分 */
 root.querySelectorAll(".vpill, .tt-card, .tl").forEach(el => {
 if (!el.dataset.k){
 const t = (el.textContent || "").trim().slice(0, 40);
 el.dataset.k = "el:" + t;
 }
 });

 /* 5) 追蹤面板的變數標籤 */
 root.querySelectorAll(".trace-panel").forEach((p, i) => {
 p.dataset.k = "tp:" + i;
 });

 /* 6) 其餘區塊（表格、提示框、終端機）用結構位置當身分 */
 root.querySelectorAll(".tbl-wrap, .callout, .console, .out, .code").forEach((el, i) => {
 if (!el.dataset.k) el.dataset.k = "blk:" + el.className + ":" + i;
 });
}

/* 產生 chars html：高亮 map 例如 {2:"hl-brand",3:"hl-amber"}，dim 為需變淡的下標集合 */
function charsHTML(s, hl = {}, opt = {}){
 const L = s.length;
 return `<div class="chars ${opt.center ? "center" : ""}">` + [...s].map((c, i) => {
 const cls = [hl[i] || "", (opt.dim || []).includes(i) ? "dim" : ""].join(" ");
 const show = c === " " ? "␣" : c === "\n" ? "⏎" : c;
 return `<div class="ch ${cls}">
 ${opt.neg ? `<span class="c-neg">${i - L}</span>` : ""}
 <span class="c-val">${esc(show)}</span>
 <span class="c-idx">${i}</span></div>`;
 }).join("") + "</div>";
}

 <h3>大小寫轉換</h3>
 ${codeBlock([
 's = "Hello World"',
 'print(s.upper()) # 全部變大寫',

 'print(s.title()) # 每個單字首字母大寫',
 'print(s.capitalize()) # 只有第一個字母大寫',
 'print(s.swapcase()) # 大小寫互換',
 'print(s) # 原來的 s 有沒有變？沒有！',

 <p>所以 <code>s.upper()</code> 單獨寫一行是沒有用的（結果馬上被丟掉），要寫 <code>s = s.upper()</code> 才會真的改到 <code>s</code>。</p>`)}


 <h3>修剪空白：strip 家族</h3>
 <p>使用者輸入的時候，很容易多打空白（尤其是複製貼上）。<code>strip()</code> 可以把頭尾多餘的空白去掉。</p>
 ${codeBlock([
 'raw = " hello "',
 'print("[" + raw.strip() + "]") # 兩邊都去掉',
 'print("[" + raw.lstrip() + "]") # 只去左邊 (left)',
 'print("[" + raw.rstrip() + "]") # 只去右邊 (right)',
 'print("[" + raw + "]") # 原來的沒變',
 ], "strip.py")}
 ${outBlock('[hello]\n[hello ]\n[ hello]\n[ hello ]', "Output（中括號是為了讓你看見空白）")}
 ${C("tip", "輸入驗證的標準做法", `<p><code>name = input("名字： ").strip()</code> —— 直接在 <code>input()</code> 後面接 <code>.strip()</code>，可以省掉很多「為什麼我打了名字它說不對」的問題。</p>`)}


 <h3>鏈式方法（chained methods）</h3>
 <p>因為每個方法都會「回傳一個新字串」，所以可以把方法一個接一個串起來。執行順序是<strong>由左到右</strong>：</p>
 ${codeBlock([
 'raw = " Hello World "',
 'print(raw.strip().lower().replace("l", "L"))',
 ], "chain.py")}
 ${outBlock("heLLo WorLd", "Output")}

 <h3>排版方法：ljust / rjust / center</h3>
 <p>這三個方法可以讓文字在一個「固定寬度的格子」裡靠左、靠右或置中。<code>w</code> 是格子的總寬度。</p>

 'print("|" + "Title".rjust(20) + "|") # 靠右，前面補空白',
 'print("|" + "Title".center(20) + "|") # 置中，兩邊均分',
 ], "justify.py")}

S("l3-s8", "8", "f-string：把變數塞進句子裡", "從此以後，印東西不用再辛苦地接 <code>+</code> 跟 <code>str()</code>。",
 `<p><strong>格式化字串實字（formatted string literal，簡稱 f-string）</strong>是 Python 最好用的輸出工具。規則只有兩條：</p>
 <ol>
 <li>在引號前面加一個 <code>f</code></li>
 <li>在字串裡面用 <code>{大括號}</code> 把變數或算式包起來</li>
 </ol>

 ${codeBlock([
 'school = "CityU"',
 'year = 2025',
 'score = 87.5',
 '',
 'print(f"我在 {school} 讀 {year} 年的課")',
 'print(f"分數是 {score} 分")',
 'print(f"明年是 {year + 1} 年") # 大括號裡可以放算式',
 'print(f"平均是 {score / 2:.2f}") # :.2f = 取到小數第 2 位',
 'print(f"姓名: {school:>10}|") # :>10 = 靠右補到 10 格',
 ], "fstring.py")}
 ${outBlock("我在 CityU 讀 2025 年的課\n分數是 87.5 分\n明年是 2026 年\n平均是 43.75\n姓名: CityU|", "Output")}

 ${C("tip", "對比一下就知道多好用", `<p><strong>舊寫法</strong>（要記得轉型別、要算空格）：<br>
 <code>print("我在 " + school + " 讀 " + str(year) + " 年的課")</code></p>
 <p><strong>f-string</strong>（不用管型別、直接讀）：<br>
 <code>print(f"我在 {school} 讀 {year} 年的課")</code></p>
 <p>「不用擔心物件型態，也不用自己調整空格。」</p>`)}

 ${C("warn", "兩個常見錯誤", `<p>1. <strong>忘了加 f</strong>：<code>print("{school}")</code> 會直接印出 <code>{school}</code> 這幾個字。<br>
 2. <strong>引號打架</strong>：<code>f"{s["a"]}"</code> 在舊版 Python 會壞掉，外層用單引號就好：<code>f'{s["a"]}'</code>。</p>`)}

 `<p>凱薩密碼是最古老的加密法：把每個字母<strong>往後推固定的格數</strong>。例如位移 3 格時，<code>A → D</code>、<code>B → E</code>、<code>Z → C</code>（超過 26 就繞回開頭）。</p>

 <li>把索引加上位移格數，得到新索引。<strong>注意：有些情況會超過 26，要用餘數運算子 <code>%</code></strong></li>
 <li>用新索引取得加密後的字母</li>

 </ol>`,
 `<p><strong>關鍵觀念：餘數 <code>%</code> 就是「繞圈圈」。</strong> <code>26 % 26 = 0</code>、<code>27 % 26 = 1</code>、<code>28 % 26 = 2</code> —— 剛好讓超出的部分繞回字母表開頭。</p>
 ${codeBlock([
 'alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ"',
 '',

 'shift = int(input("要位移幾格？ "))',
 '',
 '# Step 2~4: 對每個字母做一次',
 'coded = ""',
 'for i in range(3):',
 ' letter = word[i] # 拿出第 i 個字母',
 ' idx = alphabet.find(letter) # Step 2: 它在字母表排第幾',
 ' new_idx = (idx + shift) % 26 # Step 3: 加位移、用 % 繞回',
 ' coded = coded + alphabet[new_idx] # Step 4: 用新索引取字母',
 '',
 '# Step 5: 接起來',

S("l4-s7", "7", "可變（mutable）與不可變（immutable）", "搞懂記憶體，就不會再被「改 A 結果 B 也變了」嚇到。",
 `<p><strong>「可以在原地被改變」的物件叫做 mutable（可變）；否則叫做 immutable（不可變）。</strong></p>
 ${table([
 ["型態", "可變？", "說明"],
 ["<code>int</code>（數字）", " 不可變", "改了就是<b>做一個新的數字</b>"],
 ["<code>float</code>（小數）", " 不可變", "同上"],
 ["<code>str</code>（字串）", " 不可變", "所有方法都回傳新字串"],
 ["<code>tuple</code>（元組）", " 不可變", "連一項都不能改"],
 ["<code>list</code>（串列）", " 可變", "append／remove／sort 都是改自己"],
 ])}

 <h3>關鍵：變數不是「箱子」，是「標籤」</h3>
 <p>初學者常以為 <code>x = 5</code> 是「把 5 放進箱子 x」。更準確的模型是：</p>
 <div class="callout analogy"><div class="c-title">標籤比喻</div>
 <p><strong>記憶體裡先有一個物件，變數只是貼在它上面的一張標籤。</strong></p>
 <p><code>x = 5</code> 的意思是：做出一個「5」的物件，然後把 <code>x</code> 這張標籤貼上去。<br>
 <code>x = 7</code> 的意思是：做出一個「7」的物件，把 <code>x</code> 這張標籤<strong>撕下來改貼到 7 上面</strong> —— 原本那個「5」還在原地。</p></div>

 ${C("info", "兩種改變方式，結果完全不同", `<p><strong>① 改變串列</strong>：改的是「那個物件本身」，所有貼著這張標籤的變數都會看到變化。</p>
 <p><strong>② 改變數字／字串／元組</strong>：Python 會<strong>另外開一個新物件</strong>，把變數標籤改貼到新的上面。舊物件留在原地。</p>`)}


 <h3>為什麼「複製串列」會出錯？</h3>
 ${codeBlock([
 "lst1 = ['a', 'b']",
 "lst2 = lst1 # 這不是複製！只是多貼一張標籤",
 "lst2[1] = 'c' # 改的是同一個物件",
 "print(lst1) # lst1 也變了！！",
 ], "alias_bug.py")}
 ${outBlock("['a', 'c']", "Output")}

 <p>正確的複製方式是用 <code>list()</code>：</p>
 ${codeBlock([
 "lst1 = ['a', 'b']",
 "lst2 = list(lst1) # 正確：真的做一份新串列",
 "lst2[1] = 'c'",
 "print(lst1) # lst1 沒被動到",
 "print(lst2)",
 ], "copy_ok.py")}
 ${outBlock("['a', 'b']\n['a', 'c']", "Output")}
 ${C("tip", "三種複製方法", `<p><code>lst2 = list(lst1)</code>　　<code>lst2 = lst1[:]</code>　　<code>lst2 = lst1.copy()</code><br>
 三個都真的做一份新串列。但注意：這是<strong>淺複製</strong> —— 如果裡面還裝著串列（嵌套），內層的還是共用。</p>`)}


 ${quizHTML("q4_alias", "以下哪些型態是<strong>不可變</strong>的？（選出<strong>不是</strong>不可變的那一個）", [

 ], 2, '只有<strong>串列是可變的</strong>。數字、字串、元組都不能在原地修改 —— 這也是為什麼 <code>s.upper()</code>、<code>s = s + "x"</code> 都會產生新物件。')}
`),

 `<h3>交換兩個變數的值</h3>

 ${C("tip", "為什麼可以這樣寫？", `<p>因為 <code>=</code> 右邊會<strong>先全部算完</strong>，打包成一個元組 <code>(6, 5)</code>，再依序貼標籤到左邊。<strong>右邊先算完、左邊才指派</strong>，所以不會互相蓋掉。</p>`)}

 <h3>嵌套（nested）結構：串列裡面裝串列</h3>

S("l5-s5", "5", "決策結構 if-else：讓程式做選擇", "從這一節開始，你的程式會有「岔路」。",
 `<p>課本定義：<strong>決策結構（也叫分支結構 branching structure）讓程式根據某個條件是真是假，來決定要採取哪個行動。</strong></p>

 <h3>基本形式</h3>
 ${codeBlock([
 'if condition:',
 ' indented block of statements # 條件為 True 時執行',
 'else:',
 ' indented block of statements # 條件為 False 時執行',
 ], "if_else_form.py")}

 ${C("danger", "兩個不能忘的小地方（課本特別強調）", `<p><strong>① 冒號不能忘。</strong><code>if condition</code> 後面一定要有 <code>:</code>，<code>else</code> 後面也一樣。</p>
 <p><strong>② 縮排用 Tab 鍵。</strong>按 Enter 之後，編輯器會自動幫你縮排；<strong>不要自己敲空白鍵</strong>去湊（很容易對不齊而報 <code>IndentationError</code>）。</p>`)}

 ${C("analogy", "縮排 = 有括號的意義", `<p>Python 沒有像 C 語言的 <code>{ }</code>。它用<strong>縮排</strong>來表示「這幾行是屬於上面那個 if 的」。</p>
 <p>所以縮排不是「排版好看」而已，它是<strong>程式語法的一部分</strong>。縮排錯了，程式邏輯就完全變了。</p>`)}

 <h3>Example 1：比較兩個數字</h3>
 ${codeBlock([
 '#Example: comparing two numbers.',
 '',
 'num1 = float(input("Enter the first number: "))',
 'num2 = float(input("Enter the second number: "))',
 '',
 'if num1 > num2: # 條件為 True 時，執行下一行',
 ' print("The first number is greater than the second number.")',
 'else: # 條件為 False 時，執行下一行',
 ' print("The first number is less than or equal to the second number.")',
 ], "example1.py")}
 ${outBlock("Enter the first number: 78\nEnter the second number: 53\nThe first number is greater than the second number.\n\nEnter the first number: 98\nEnter the second number: 100\nThe first number is less than or equal to the second number.", "Output")}

 ${C("info", "解讀流程", `<p>① 讀兩個數字 → ② 問「num1 &gt; num2 嗎？」→ ③ 是 True 走 if 那一行，是 False 走 else 那一行。<strong>兩條路只會走一條。</strong></p>`)}


 <h3>if 可以單獨使用（省略 else）</h3>
 <p>課本說：<strong><code>else</code> 部分可以省略。當條件為 False 時，程式會繼續執行 if 區塊後面的那一行。</strong></p>
 ${codeBlock([
 'score = 75',
 '',
 'if score >= 60:',
 ' print("及格")',
 '',
 'print("程式結束") # 不管條件如何，這行都會執行',
 ], "if_only.py")}
 ${outBlock("及格\n程式結束", "Output（score = 75）")}
 ${C("tip", "什麼時候省略 else？", `<p>當「條件不成立時不需要做任何事」的時候。例如「如果分數及格就印出恭喜」—— 不及格就什麼都不印，直接往下走。</p>`)}

`),

S("l5-s6", "6", "elif：三個以上的選項", "兩個選項用 if-else，三個以上就用 elif。",
 `<p>課本定義：<strong><code>elif</code> 讓你可以有兩個以上的可能選項，而且可以加任意多個。</strong></p>

 ${codeBlock([
 'if condition1:',
 ' # 條件 1 為 True 時執行',
 'elif condition2:',
 ' # 條件 2 為 True「而且條件 1 不成立」時執行',
 'elif condition3:',
 ' # 條件 3 為 True「而且前兩個都不成立」時執行',
 'else:',
 ' # 以上全部不成立時執行',
 ], "elif_form.py")}

 ${C("tip", "理解 elif 的關鍵一句話", `<p><b>到了 condition2 的時候，你已經知道 condition1 是 False 了。</b></p>
 <p>到了 condition3 的時候，你已經知道 condition1 和 2 都是 False 了。</p>
 <p>這就是為什麼寫 <code>elif score &gt;= 70:</code> 的時候<strong>不需要</strong>再寫 <code>and score &lt;= 90</code> —— 能走到這一行，就代表前面 <code>score &gt; 90</code> 已經不成立了。</p>`)}


 <h3>Example 2：三個選項的比較</h3>
 ${codeBlock([
 '#Example: comparing two numbers.',
 '',
 'num1 = float(input("Enter the first number: "))',
 'num2 = float(input("Enter the second number: "))',
 '',
 'if num1 > num2: # 條件 1',
 ' print("The first number is greater than the second number.")',
 'elif num1 == num2: # 條件 2（新增的）',
 ' print("The two numbers are equal.")',
 'else: # 其他所有沒被涵蓋的情況',
 ' print("The first number is smaller than the second number.")',
 ], "example2.py")}
 ${outBlock("Enter the first number: 53\nEnter the second number: 37\nThe first number is greater than the second number.\n\nEnter the first number: 53\nEnter the second number: 53\nThe two numbers are equal.\n\nEnter the first number: 53\nEnter the second number: 79\nThe first number is smaller than the second number.", "Output")}


 <h3>Example 3：成績評語</h3>
 ${table([
 ["分數", "評語"],
 ["高於 90", "Excellent!"],
 ["70 – 90", "Not bad!"],
 ["低於 70", "Need improvement :)"],
 ])}
 ${codeBlock([
 '#Example: 3',
 '',
 'score = float(input("Enter a score: "))',
 '',
 'if score > 90:',
 ' print("Excellent!")',
 'elif score >= 70: # 注意：不需要寫 score <= 90，為什麼？',
 ' print("Not bad!")',
 'else:',
 ' print("Need improvement :)")',
 ], "example3.py")}
 ${outBlock("Enter a score: 95\nExcellent!\n\nEnter a score: 80\nNot bad!\n\nEnter a score: 65\nNeed improvement :)", "Output")}

 ${C("info", "回答課本的問題：為什麼不用寫 <code>score &lt;= 90</code>？", `<p>因為能執行到 <code>elif score &gt;= 70:</code> 這一行，代表 <code>score &gt; 90</code> <strong>已經是 False</strong>，也就是 <code>score &lt;= 90</code> 必然成立。</p>
 <p>再寫一次不但多餘，還容易寫錯。<strong>這就是 elif 最優雅的地方。</strong></p>`)}


 ${C("tip", "順序很重要！", `<p>把條件從<strong>最嚴格</strong>排到<strong>最寬鬆</strong>。如果把 <code>elif score &gt;= 70</code> 寫在 <code>if score &gt; 90</code> 前面，那麼 95 分會在第一關就被攔下來，永遠拿不到 "Excellent!"。</p>`)}

 ${quizHTML("q5_elif", '執行 <code>x = 5</code> 後，以下程式會印出什麼？<br><code>if x &gt; 3: print("A")</code><br><code>elif x &gt; 1: print("B")</code><br><code>else: print("C")</code>', [
 "<code>A</code>", "<code>A</code> 和 <code>B</code>", "<code>B</code>", "<code>C</code>",
 ], 0, "<code>5 &gt; 3</code> 為真，走第一條路印出 A。<strong>因為用了 <code>elif</code>，整個鏈在第一個成立的條件就結束了</strong>，後面的 <code>elif</code>／<code>else</code> 全部跳過（即使 <code>x &gt; 1</code> 也是真的）。")}
`),

 <p>現在請一律用 <code>int(input())</code> 或 <code>float(input())</code>。</p>
 <p>另外課本用了 <code>max</code> 當變數名稱 —— 這會<strong>蓋掉內建的 <code>max()</code> 函式</strong>，不是好習慣（但語法上合法）。</p>`)}


 <h3>兩個 if 的流程 vs elif 的流程</h3>
 ${table([
 ["", "兩個獨立的 <code>if</code>", "<code>if</code> + <code>elif</code>"],
 ["第一個條件成立時", "仍然繼續檢查第二個條件", "<b>直接跳過</b>後面所有條件"],
 ["適合用在", "要做<b>好幾件獨立的事</b>", "要在<b>多個選項中選一個</b>"],
 ["例子", "「如果分數及格就加分；如果出席率夠就加薪」", "「成績是 A/B/C/D/F 的哪一個」"],
 ])}


 ${C("danger", "判斷口訣", `<p>問自己：<strong>「這些條件成立的時候，應該同時做好幾件事，還是只做一件事？」</strong></p>
 <p>同時做好幾件事 → 用多個 <code>if</code>。<br>
 只做一件 → 用 <code>if</code> + <code>elif</code>。</p>`)}

 <p>用一個具體的例子感受差別：</p>
 ${codeBlock([
 'score = 95',
 '',
 '# 版本 A：兩個獨立的 if → 兩行都會印！',

 ' print("及格")',

 ' print("優秀")',
 '# 輸出：及格 / 優秀',
 '',
 '# 版本 B：if-elif → 只印一行',
 'if score >= 60:',
 ' print("及格")',
 'elif score >= 90:',
 ' print("優秀")',
 '# 輸出：及格（永遠印不到「優秀」，因為 95 已經在第一關被攔下）',
 ], "compare.py")}

`),

S("l5-s8", "8", "Lab 5 實作", "三個課堂練習的完整解法。", `

 ${codeBlock([
 "#Lab 5",
 "#Example A",
 "",
 "letter = input(\"Pick one letter from A-Z: \").upper()",
 "ref = \"ABCDEFGHIJKLMNOPQRSTUVWXYZ\"",
 "order = ref.find(letter) + 1 # +1 因為索引從 0 開始",
 "",
 "if order == 1:",

 "elif order == 2:",

 ${C("warn", "小陷阱", `<p>如果使用者輸入的不是大寫字母，<code>find()</code> 會回傳 <code>-1</code>，<code>-1 + 1 = 0</code>，程式會印出「is the 0th letter」。<strong>嚴謹的做法是先檢查 <code>order == 0</code> 並提示錯誤。</strong></p>`)}`)}

 ${table([

 ])}

 ${C("tip", "一句話記住", `<p><strong>把 <code>not</code> 推進括號時，裡面的 <code>and</code> 和 <code>or</code> 要互換。</strong></p>
 <p>用日常語言驗證一下：「不是（下雨<b>或</b>颳風）」= 「沒下雨<b>而且</b>沒颳風」。對吧？如果只說「沒下雨」那颳風的情況就漏掉了。</p>`)}

 <h3>用程式驗證</h3>
 ${codeBlock([
 'print(not (1 > 5 or 15 % 5 != 0))',
 'print(not (1 > 5) and not (15 % 5 != 0))',
 'print(1 <= 5 and 15 % 5 == 0)',
 ], "demorgan.py")}
 ${outBlock("True\nTrue\nTrue", "Output")}
 ${C("info", "三個都是 True，因為它們是同一件事", `<p><code>1 &gt; 5</code> 是 False、<code>15 % 5 != 0</code> 也是 False（15 能被 5 整除）。</p>
 <p>所以 <code>not(False or False)</code> = <code>not False</code> = <code>True</code>。<br>
 另一邊：<code>not(False) and not(False)</code> = <code>True and True</code> = <code>True</code>。</p>
 <p>第三行只是把每個 <code>not</code> 都化簡掉：<code>not(1 &gt; 5)</code> = <code>1 &lt;= 5</code>、<code>not(15 % 5 != 0)</code> = <code>15 % 5 == 0</code>。</p>`)}


 <h3>分配律（Distributive Laws）</h3>
 <p>課本也提到這兩條：</p>
 ${table([

 ["<code>cond1 or (cond2 and cond3)</code>", "<code>(cond1 or cond2) and (cond1 or cond3)</code>"],
 ["<code>cond1 and (cond2 or cond3)</code>", "<code>(cond1 and cond2) or (cond1 and cond3)</code>"],
 ])}
 ${C("analogy", "跟代數一模一樣", `<p><code>a × (b + c) = a×b + a×c</code> —— 把外面的乘進去。</p>

 <h3>Example 1：數字是否介於 0 到 100 之間</h3>
 <p><strong>方法 A：用嵌套 if</strong></p>
 ${codeBlock([
 '# Method A: nested if',
 '',
 'num = float(input("Enter a number: "))',
 '',
 'if num >= 0:',
 ' if num <= 100: # 嵌套 if',
 ' print("The number is between 0 and 100.") # 再縮排一層！',
 ' else:',
 ' print("The number is above 100.")',
 'else:',
 ' print("The number is below 0.")',
 ], "nested_a.py")}
 ${outBlock("Enter a number: 59\nThe number is between 0 and 100.\n\nEnter a number: 107\nThe number is above 100.\n\nEnter a number: -3\nThe number is below 0.", "Output")}


 <p><strong>方法 B：用複合條件</strong></p>
 ${codeBlock([
 '# Method B: compound conditions.',
 '',
 'num = float(input("Enter a number: "))',
 '',
 'if num >= 0 and num <= 100: # 或者直接寫 0 <= num <= 100',
 ' print("The number is between 0 and 100.")',
 'elif num > 100:',
 ' print("The number is above 100.")',
 'else:',
 ' print("The number is below 0.")',
 ], "nested_b.py")}
 ${outBlock("Enter a number: 59\nThe number is between 0 and 100.\n\nEnter a number: 107\nThe number is above 100.\n\nEnter a number: -3\nThe number is below 0.", "Output")}


 ${C("info", "兩種方法結果完全一樣", `<p>課本註解：<strong>「嵌套 if 常常可以改成複合條件，反之亦然。」</strong></p>

 <h3>新工具：<code>.isdigit()</code></h3>
 <p><code>.isdigit()</code> 是字串方法，檢查這個字串<strong>是不是全部由數字字元組成</strong>，回傳 <code>True</code> 或 <code>False</code>。</p>
 ${codeBlock([

 'print("-5".isdigit()) # False（有負號！）',
 ], "isdigit.py")}
 ${outBlock("True\nFalse\nFalse\nFalse\nFalse", "Output")}
 ${C("warn", "注意 <code>isdigit()</code> 的限制", `<p>它只接受<strong>純數字字元</strong>，所以：</p>
 <ul>
 <li><code>"12.5"</code> → False（有小數點）</li>
 <li><code>"-5"</code> → False（有負號）</li>
 <li><code>"1 2"</code> → False（有空格）</li>
 </ul>
 <p>要處理負數和小數，需要用 <code>try / except</code>（後面章節）。這一題只處理正整數，所以 <code>isdigit()</code> 剛好夠用。</p>`)}

 <h3>完整程式：嵌套 if 做三種判斷</h3>
 ${codeBlock([
 '## Request two numbers and find their sum. Validate the input.',
 'num1 = input("Enter first number: ")',
 'num2 = input("Enter second number: ")',
 '',
 'if num1.isdigit() and num2.isdigit():',
 ' print("The sum is", str(int(num1) + int(num2)) + ".")',
 'elif not num1.isdigit():',
 ' if not num2.isdigit():',
 ' print("Neither entry was a proper number.")',
 ' else:',
 ' print("The first entry was not a proper number.")',
 'else:',
 ' print("The second entry was not a proper number.")',
 ], "validation.py")}
 ${outBlock("Enter first number: 12\nEnter second number: 20\nThe sum is 32.\n\nEnter first number: 32\nEnter second number: seven\nThe second entry was not a proper number.\n\nEnter first number: seven\nEnter second number: 32\nThe first entry was not a proper number.", "Output")}

 ${C("danger", "課本這裡用 <code>.isdigit()</code>，不是 <code>int()</code>", `<p>為什麼不直接 <code>int(input())</code>？因為如果使用者打了「seven」，<code>int("seven")</code> 會直接 <code>ValueError</code> 讓程式崩潰。</p>
 <p><strong>先檢查、再轉型</strong>是安全做法 → 這就是為什麼要有 <code>if num1.isdigit()</code>。</p>`)}

S("l6-s10", "10", "重點速記與自我檢測", "考前 5 分鐘看這一頁。",
 `<div class="recap">

 <li><b><code>and</code></b>：兩邊<b>都真</b>才真（像乘法，有 0 就 0）。</li>
 <li><b><code>or</code></b>：<b>至少一邊真</b>就真（像加法，有 1 就大於 0）。</li>

 <li><b>短路求值</b>：<code>and</code> 左邊是 False 就不算右邊；<code>or</code> 左邊是 True 就不算右邊。</li>
 <li><b>把「檢查」放在「危險動作」前面</b>：<code>(number != 0) and (m == n / number)</code>。</li>

 <li><b>迪摩根定律</b>：<code>not(A or B)</code> = <code>not A and not B</code>；<code>not(A and B)</code> = <code>not A or not B</code>。<b>not 進去，and/or 互換。</b></li>
 <li><b>分配律</b>：<code>A or (B and C)</code> = <code>(A or B) and (A or C)</code>。</li>

/* --- 流程圖小工具 -------------------------------------------------- */
function flowNodes(nodes){
 return nodes.map(n => {
 if (n.t === "arrow") return `<div class="farrow ${n.hl || ""}">${n.label ? "<span>" + n.label + "</span>" : ""}</div>`;
 return `<div class="fbox ${n.cls || ""} ${n.hl || ""}">${n.txt}</div>`;
 }).join("");
}
/* 用「執行到第幾個節點」的方式產生流程圖 html */
function flowStep(nodes, active){
 return `<div class="flow">${nodes.map((n, i) => {
 const done = active.indexOf(i) > -1;
 const cur = active[active.length - 1] === i;
 if (n.t === "arrow") return `<div class="farrow ${done ? "hl" : ""}">${n.label ? "<span>" + n.label + "</span>" : ""}</div>`;
 const cls = [n.cls || ""];
 if (done) cls.push("hit");
 if (cur) cls.push("hl");
 return `<div class="fbox ${cls.join(" ")}">${n.txt}</div>`;
 }).join("")}</div>`;
}






/* ==========================================================================
 3. 互動小工具：自我檢測題、真值表、滑桿元件
 ========================================================================== */
/* --- 自我檢測題 --- */
function initQuiz(root){
 $$(".quiz", root).forEach(q => {
 if (q.dataset.ready === "1") return;
 q.dataset.ready = "1";
 const ans = Number(q.dataset.answer);
 $$(".quiz-opt", q).forEach((opt, i) => {
 opt.addEventListener("click", () => {
 if (q.dataset.done === "1") return;
 q.dataset.done = "1";
 $$(".quiz-opt", q).forEach((o, j) => {
 if (j === ans) o.classList.add("right");
 else if (j === i) o.classList.add("wrong");
 o.disabled = true;
 });
 const fb = $(".quiz-fb", q);
 if (fb) fb.classList.add("show");
 });
 });
 });
}
/* --- 真值表開關（A / B 可切換，成績即時更新） --- */
function initTruth(root){
 $$("[data-truth]", root).forEach(box => {
 if (box.dataset.ready === "1") return;
 box.dataset.ready = "1";
 const state = { A: 1, B: 1 };
 const sync = () => {
 $$("[data-var]", box).forEach(sw => {
 sw.dataset.val = state[sw.dataset.var] ? "1" : "0";
 sw.textContent = state[sw.dataset.var] ? "True" : "False";
 });
 const A = !!state.A, B = !!state.B;
 const res = { "A and B": A && B, "A or B": A || B, "not A": !A, "not (A and B)": !(A && B) };
 $$("[data-tt]", box).forEach(card => {
 const v = res[card.dataset.tt];
 card.classList.toggle("on", v);
 card.classList.toggle("off", !v);
 $(".tt-val", card).textContent = v ? "True" : "False";
 });
 const tbody = $("tbody", box);
 if (tbody){
 $$("tr", tbody).forEach((tr, i) => {
 const bits = [!!(i & 2), !!(i & 1)];
 tr.classList.toggle("tbl-hl", bits[0] === A && bits[1] === B);
 });
 }
 };
 $$("[data-var]", box).forEach(sw => sw.addEventListener("click", () => {
 state[sw.dataset.var] = state[sw.dataset.var] ? 0 : 1;
 sync();
 }));
 sync();
 });
}
/* --- 切片探索器：m / n / s 三個滑桿 --- */
function initSlicer(root){
 $$("[data-slicer]", root).forEach(box => {
 if (box.dataset.ready === "1") return;
 box.dataset.ready = "1";
 const s = box.dataset.slicer;
 const L = s.length;
 const mEl = $('[data-k="m"]', box), nEl = $('[data-k="n"]', box), stEl = $('[data-k="s"]', box);
 const run = () => {
 const m = Number(mEl.value), n = Number(nEl.value), st = Number(stEl.value) || 1;
 const norm = v => v < 0 ? L + v : v;
 const a = norm(m), b = norm(n);
 const picked = [];
 if (st > 0) for (let i = Math.max(0,a); i < Math.min(L,b); i += st) picked.push(i);
 else for (let i = Math.min(L-1,a); i > Math.max(-1,b); i += st) picked.push(i);
 const hl = {}; picked.forEach((p, k) => hl[p] = "hl-" + ["brand","blue","amber","violet","rose"][k % 5]);
 $(".sl-chars", box).innerHTML = charsHTML(s, hl, { neg:true, center:true });
 $(".sl-m", box).textContent = m; $(".sl-n", box).textContent = n; $(".sl-s", box).textContent = st;
 $(".sl-res", box).textContent = "s[" + m + ":" + n + (st !== 1 ? ":" + st : "") + "] → " +
 JSON.stringify(picked.map(i => s[i]).join(""));
 $(".sl-idx", box).textContent = "共 " + picked.length + " 個字元";
 };
 [mEl, nEl, stEl].forEach(el => el.addEventListener("input", run));
 const reset = $('[data-a="sl-reset"]', box);
 if (reset) reset.addEventListener("click", () => { mEl.value = 0; nEl.value = L; stEl.value = 1; run(); });
 run();
 });
}
/* --- 隨機抽字模擬器 --- */
function initPicker(root){
 $$("[data-picker]", root).forEach(box => {
 if (box.dataset.ready === "1") return;
 box.dataset.ready = "1";
 const word = box.dataset.picker;
 const slots = Number(box.dataset.slots || 3);
 const wrap = box.closest(".anim") || box.parentElement || box;
 const btn = $(".pk-go", wrap);
 let n = 0;
 btn.addEventListener("click", () => {
 n++;
 const idx = range(slots).map(() => Math.floor(Math.random() * word.length));
 $(".pk-chars", box).innerHTML = charsHTML(word, Object.fromEntries(idx.map((v, k) => [v, ["hl-brand","hl-blue","hl-amber"][k % 3]])), { center:true });
 $(".pk-out", box).innerHTML =
 idx.map((v, k) => `<div class="vpill set">第 ${k+1} 個 → index ${v} → <b>${word[v]}</b></div>`).join("") +
 `<div class="vpill">結果字串 → <b>${idx.map(v => word[v]).join("")}</b></div>`;
 $(".pk-count", wrap).textContent = "已執行 " + n + " 次";
 });
 btn.click();
 });
}

 4. 導覽列 + 路由

const LESSONS = window.LESSONS || [];
let current = 0;

function buildNav(){
 $("#navList").innerHTML = LESSONS.map((L, i) => `
 <button class="nav-item" data-go="${i}">
 <span class="n-num">${L.num}</span>
 <span class="n-body">
 <span class="n-title">${L.short}</span>
 <span class="n-sub">${L.sub}</span>
 </span>
 <span class="n-check"></span>
 </button>`).join("");

 $("#content").innerHTML = LESSONS.map((L, i) => `
 <article class="lesson" id="lesson-${i}">
 <header class="lesson-head">
 <span class="kicker">Lesson ${L.num} · ${L.kicker}</span>
 <h1>${L.title}</h1>
 <p class="lead">${L.lead}</p>
 <div class="head-meta">${(L.chips || []).map(c => `<span class="chip">${c}</span>`).join("")}</div>
 </header>
 <div class="goals"><h4> 讀完這一課，你會學會</h4><ol>${(L.goals || []).map(g => `<li>${g}</li>`).join("")}</ol></div>
 ${L.body}
 <div class="pager">
 ${i > 0 ? `<button class="prev" data-go="${i-1}"><span class="p-dir">← 上一課</span><span class="p-name">${LESSONS[i-1].short}</span></button>` : `<button disabled><span class="p-dir">← 上一課</span><span class="p-name">已經是第一課</span></button>`}
 ${i < LESSONS.length - 1 ? `<button class="next" data-go="${i+1}"><span class="p-dir">下一課 </span><span class="p-name">${LESSONS[i+1].short}</span></button>` : `<button disabled class="next"><span class="p-dir">下一課 </span><span class="p-name">已經是最後一課</span></button>`}
 </div>
 </article>`).join("");
}

function buildToc(){
 const L = LESSONS[current];
 $("#tocList").innerHTML = (L.toc || []).map(t =>
 `<button class="toc-link" data-toc="${t.id}">${t.title}</button>`).join("")
 || '<span class="toc-link" style="cursor:default;border:0;color:#5d6b90">（本課無小節）</span>';
}

function go(i, anchor){
 if (i < 0 || i >= LESSONS.length) return;
 current = i;
 $$(".lesson").forEach((el, k) => el.classList.toggle("active", k === i));
 $$(".nav-item").forEach((el, k) => el.classList.toggle("active", k === i));
 buildToc();
 const art = $("#lesson-" + i);
 initQuiz(art);
 initTruth(art);
 initSlicer(art);
 initPicker(art);
 $("#mbTitle").textContent = "Lesson " + LESSONS[i].num + " · " + LESSONS[i].short;
 try { localStorage.setItem("py-notes-last", String(i)); } catch(e){}
 try {
 const target = "#lesson-" + i;
 if (location.hash !== target) history.replaceState(null, "", target);
 } catch(e){}
 closeSidebar();
 if (anchor){
 const t = $("#" + anchor);
 if (t) { scrollToAnchor(t); return; }
 }
 window.scrollTo({ top:0, behavior:"auto" });
}

/* 側欄開合（手機） */
function openSidebar(){ $("#sidebar").classList.add("open"); $("#scrim").classList.add("show"); }
/* 可靠的錨點捲動：先瞬間定位，再平滑修正（smooth 在部分環境不會真的捲動） */
function scrollToAnchor(t){
 const se = document.scrollingElement || document.documentElement;
 const y = se.scrollTop + t.getBoundingClientRect().top - 12;
 window.scrollTo({ top: y, behavior:"auto" });
 requestAnimationFrame(() => {
 const y2 = se.scrollTop + t.getBoundingClientRect().top - 12;
 if (Math.abs(y2 - se.scrollTop) > 2) window.scrollTo({ top: y2, behavior:"smooth" });
 });
}

function closeSidebar(){ $("#sidebar").classList.remove("open"); $("#scrim").classList.remove("show"); }

document.addEventListener("click", e => {
 const g = e.target.closest("[data-go]");
 if (g){ go(Number(g.dataset.go)); return; }
 const t = e.target.closest("[data-toc]");
 if (t){
 const el = $("#" + t.dataset.toc);
 if (el) el.scrollIntoView({ behavior:"smooth", block:"start" });
 }
});

/* 啟動 */
(function boot(){
 buildNav();
 let start = 0;
 try { start = Number(localStorage.getItem("py-notes-last") || 0) || 0; } catch(e){}
 if (start < 0 || start >= LESSONS.length) start = 0;
 /* 深層連結：支援 #l4-s1（小節）與 #lesson-2（課） */
 const raw = decodeURIComponent((location.hash || "").replace(/^#/, ""));
 if (raw){
 const lm = raw.match(/^lesson-(\d+)$/);
 if (lm){
 const i = Number(lm[1]);
 if (i >= 0 && i < LESSONS.length) start = i;
 } else {
 const hit = LESSONS.find(L => (L.body || "").includes('id="' + raw + '"'));
 if (hit) start = LESSONS.indexOf(hit);
 }
 }
 go(start, raw && !/^lesson-\d+$/.test(raw) ? raw : undefined);
 $("#burger").addEventListener("click", openSidebar);
 $("#scrim").addEventListener("click", closeSidebar);
 document.addEventListener("keydown", e => {
 if (e.target.matches("input,select,textarea")) return;
 if (e.key === "ArrowRight") go(current + 1);
 if (e.key === "ArrowLeft") go(current - 1);
 });
})();
