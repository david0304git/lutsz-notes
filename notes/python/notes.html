S("l6-s6", "6", "嵌套 if（Nested If）", "在 if 裡面再放一個 if。當「要不要檢查第二件事」取決於第一件事時就要用它。",
  `<p>課本定義：<strong>if-else 區塊裡面可以再包含其他的 if-else 或 if 敘述，這叫做嵌套（nested）。</strong></p>

  ${C("danger", "🔑 縮排是關鍵", `<p>嵌套的意思就是<strong>縮排再往右一層</strong>。每一層縮排代表「這是屬於上面那個 if 的」。</p>
  ${codeBlock([
    'if num >= 0:',
    '    if num <= 100:          # ← 縮排 4 格：屬於外面的 if',
    '        print("介於 0 到 100")   # ← 縮排 8 格：屬於裡面的 if',
    '    else:',
    '        print("大於 100")       # ← 縮排 4 格：屬於裡面的 if 的 else',
    'else:',
    '    print("小於 0")             # ← 縮排 0 格：屬於外面的 if 的 else',
  ], "nested_indent.py")}
  <p><strong>縮排錯一格，程式邏輯就完全不同。</strong>這是嵌套最容易出錯的地方。</p>`)}

  <h3>Example 1：數字是否介於 0 到 100 之間</h3>
  <p><strong>方法 A：用嵌套 if</strong></p>
  ${codeBlock([
    '# Method A: nested if',
    '',
    'num = float(input("Enter a number: "))',
    '',
    'if num >= 0:',
    '    if num <= 100:      # 嵌套 if',
    '        print("The number is between 0 and 100.")   # 再縮排一層！',
    '    else:',
    '        print("The number is above 100.")',
    'else:',
    '    print("The number is below 0.")',
  ], "nested_a.py")}
  ${outBlock("Enter a number: 59\nThe number is between 0 and 100.\n\nEnter a number: 107\nThe number is above 100.\n\nEnter a number: -3\nThe number is below 0.", "Output")}

  ${A("a6_nested", "方法 A：嵌套 if 的執行流程")}

  <p><strong>方法 B：用複合條件</strong></p>
  ${codeBlock([
    '# Method B: compound conditions.',
    '',
    'num = float(input("Enter a number: "))',
    '',
    'if num >= 0 and num <= 100:   # 或者直接寫 0 <= num <= 100',
    '    print("The number is between 0 and 100.")',
    'elif num > 100:',
    '    print("The number is above 100.")',
    'else:',
    '    print("The number is below 0.")',
  ], "nested_b.py")}
  ${outBlock("Enter a number: 59\nThe number is between 0 and 100.\n\nEnter a number: 107\nThe number is above 100.\n\nEnter a number: -3\nThe number is below 0.", "Output")}

  ${A("a6_compound", "方法 B：複合條件的執行流程")}

  ${C("info", "兩種方法結果完全一樣", `<p>課本註解：<strong>「嵌套 if 常常可以改成複合條件，反之亦然。」</strong></p>
  ${table([
    ["", "嵌套 if（方法 A）", "複合條件（方法 B）"],
    ["縮排層數", "最多 3 層", "只有 1 層"],
    ["適合", "第二個判斷<b>只在某個前提下</b>才有意義", "兩個條件<b>同等重要</b>、一起判斷"],
    ["例子", "先確認是數字，再檢查範圍", "檢查分數是否在 60–100 之間"],
  ])}
  <p><strong>方法 B 通常更好讀</strong>，課本也在講義裡直接示範了 <code>0 &lt;= num &lt;= 100</code> 這個 Python 特有的寫法。</p>`)}

  ${quizHTML("q6_nested", "什麼時候「必須」用嵌套 if，而不能用複合條件？", [
      "任何時候都可以互換",
      "當第二個條件只有在第一個成立時才有意義",
      "當條件超過三個",
      "當用了 not",
    ], 1, "當第二個檢查<strong>依賴</strong>第一個的結果時，就必須用嵌套。例如「先確認 <code>x</code> 不是 0，再計算 <code>10 / x</code>」—— 如果 <code>x</code> 是 0，第二件事根本不能做。")}
`),

S("l6-s7", "7", "Example 2：輸入驗證（isdigit）", "先檢查使用者輸入「是不是數字」，再進行計算。這是實務上最重要的技巧之一。",
  `<p>需求：請使用者輸入兩個數字並求總和，<strong>但要驗證輸入</strong>；如果輸入無效，要告訴使用者<strong>是哪一筆</strong>出了問題。</p>

  <h3>新工具：<code>.isdigit()</code></h3>
  <p><code>.isdigit()</code> 是字串方法，檢查這個字串<strong>是不是全部由數字字元組成</strong>，回傳 <code>True</code> 或 <code>False</code>。</p>
  ${codeBlock([
    'print("123".isdigit())     # True',
    'print("12.5".isdigit())    # False（有小數點！）',
    'print("abc".isdigit())     # False',
    'print("".isdigit())        # False（空字串）',
    'print("-5".isdigit())      # False（有負號！）',
  ], "isdigit.py")}
  ${outBlock("True\nFalse\nFalse\nFalse\nFalse", "Output")}
  ${C("warn", "注意 <code>isdigit()</code> 的限制", `<p>它只接受<strong>純數字字元</strong>，所以：</p>
  <ul>
    <li><code>"12.5"</code> → False（有小數點）</li>
    <li><code>"-5"</code> → False（有負號）</li>
    <li><code>"1 2"</code> → False（有空格）</li>
  </ul>
  <p>要處理負數和小數，需要用 <code>try / except</code>（後面章節）。這一題只處理正整數，所以 <code>isdigit()</code> 剛好夠用。</p>`)}

  <h3>完整程式：嵌套 if 做三種判斷</h3>
  ${codeBlock([
    '## Request two numbers and find their sum. Validate the input.',
    'num1 = input("Enter first number: ")',
    'num2 = input("Enter second number: ")',
    '',
    'if num1.isdigit() and num2.isdigit():',
    '    print("The sum is", str(int(num1) + int(num2)) + ".")',
    'elif not num1.isdigit():',
    '    if not num2.isdigit():',
    '        print("Neither entry was a proper number.")',
    '    else:',
    '        print("The first entry was not a proper number.")',
    'else:',
    '    print("The second entry was not a proper number.")',
  ], "validation.py")}
  ${outBlock("Enter first number: 12\nEnter second number: 20\nThe sum is 32.\n\nEnter first number: 32\nEnter second number: seven\nThe second entry was not a proper number.\n\nEnter first number: seven\nEnter second number: 32\nThe first entry was not a proper number.", "Output")}

  ${C("danger", "⚠️ 課本這裡用 <code>.isdigit()</code>，不是 <code>int()</code>", `<p>為什麼不直接 <code>int(input())</code>？因為如果使用者打了「seven」，<code>int("seven")</code> 會直接 <code>ValueError</code> 讓程式崩潰。</p>
  <p><strong>先檢查、再轉型</strong>是安全做法 → 這就是為什麼要有 <code>if num1.isdigit()</code>。</p>`)}

  ${A("a6_validate", "輸入驗證：三種不同的輸入走三條不同的路")}

  <h3>程式邏輯拆解</h3>
  ${table([
    ["num1 是數字？", "num2 是數字？", "走哪條路", "輸出"],
    ["✔", "✔", "<code>if</code> 第一行", "印出總和"],
    ["✘", "✘", "<code>elif</code> → 嵌套 <code>if</code>", "兩筆都錯"],
    ["✘", "✔", "<code>elif</code> → 嵌套 <code>else</code>", "第一筆錯"],
    ["✔", "✘", "<code>else</code>", "第二筆錯"],
  ])}

  ${C("tip", "為什麼不在第一個 elif 就判斷完？", `<p>想想看：<code>elif not num1.isdigit():</code> 這一行成立時，我們知道<strong>「num1 不是數字」</strong>，但<strong>還不知道 num2 是不是</strong>。所以要在裡面再問一次 —— 這就是嵌套 if 的用武之地。</p>
  <p>能走到 <code>else</code> 的時候，我們已經知道「<code>num1.isdigit() and num2.isdigit()</code> 是 False」而且「num1 是數字」→ 所以必然是 <strong>num2 不是數字</strong>。</p>`)}

  ${quizHTML("q6_valid", '使用者輸入 <code>num1 = "12"</code>、<code>num2 = "abc"</code>，程式會印出什麼？', [
      "The sum is 12.",
      "Neither entry was a proper number.",
      "The first entry was not a proper number.",
      "The second entry was not a proper number.",
    ], 3, "<code>num1.isdigit()</code> 是 True、<code>num2.isdigit()</code> 是 False，所以 <code>if</code> 的第一行不成立、<code>elif not num1.isdigit()</code> 也不成立（因為 num1 是數字）→ 直接走 <code>else</code> → 印出「The second entry was not a proper number.」")}
`),

S("l6-s8", "8", "Example 3：簡易計算機", "把 if-elif 用在實際的小工具上，順便學「先用變數存結果，最後才印」。",
  `<p>需求：請使用者輸入兩個數字和一個運算子（<code>+</code> <code>-</code> <code>*</code> <code>/</code>），輸出計算結果。</p>

  ${codeBlock([

    "        result = num1 / num2",

S("l6-s10", "10", "重點速記與自我檢測", "考前 5 分鐘看這一頁。",
  `<div class="recap">
    <h3>🔑 Lesson 6 一頁速記</h3>
    <ul>
      <li><b><code>and</code></b>：兩邊<b>都真</b>才真（像乘法，有 0 就 0）。</li>
      <li><b><code>or</code></b>：<b>至少一邊真</b>就真（像加法，有 1 就大於 0）。</li>
      <li><b><code>not</code></b>：反轉真假。</li>
      <li><b>真值表</b>：<code>and</code> 和 <code>or</code> 都只有「全真／全假」最後一列不同 —— 記得畫表就不會錯。</li>
      <li><b>短路求值</b>：<code>and</code> 左邊是 False 就不算右邊；<code>or</code> 左邊是 True 就不算右邊。</li>
      <li><b>把「檢查」放在「危險動作」前面</b>：<code>(number != 0) and (m == n / number)</code>。</li>
      <li><b>用 <code>in</code> 取代一長串 <code>or</code></b>：<code>state in ["MD","VA","WV","DE"]</code>。</li>
      <li><b>鏈式比較</b>：<code>10 &lt; x &lt;= 20</code> 等於 <code>x &gt; 10 and x &lt;= 20</code>（<b>只有 Python 能這樣寫</b>）。</li>
      <li><b>迪摩根定律</b>：<code>not(A or B)</code> = <code>not A and not B</code>；<code>not(A and B)</code> = <code>not A or not B</code>。<b>not 進去，and/or 互換。</b></li>
      <li><b>分配律</b>：<code>A or (B and C)</code> = <code>(A or B) and (A or C)</code>。</li>
      <li><b>優先順序</b>：括號 &gt; <code>not</code> &gt; <code>and</code> &gt; <code>or</code>。<b>但請永遠加括號。</b></li>
      <li><b>嵌套 if</b>：if 裡面再放 if，靠<b>縮排層數</b>區分。縮排錯一格邏輯就變了。</li>

      <li><b><code>.isdigit()</code></b>：檢查字串是否全部是數字字元。<code>"12.5"</code>、<code>"-5"</code> 都會回 <code>False</code>。</li>
      <li><b>輸入驗證流程</b>：先 <code>isdigit()</code> 檢查 → 通過才 <code>int()</code> → 不然會 <code>ValueError</code> 崩潰。</li>
      <li><b>計算機模式</b>：每個分支只把結果存進 <code>result</code>，<b>最後統一 print 一次</b>。</li>
      <li><b>條件順序：最嚴格的放前面</b>（等邊三角形要在等腰之前、A 級要在 B 級之前）。</li>
    </ul>
  </div>

/* --- 流程圖小工具 -------------------------------------------------- */
function flowNodes(nodes){
  return nodes.map(n => {
    if (n.t === "arrow") return `<div class="farrow ${n.hl || ""}">${n.label ? "<span>" + n.label + "</span>" : ""}</div>`;
    return `<div class="fbox ${n.cls || ""} ${n.hl || ""}">${n.txt}</div>`;
  }).join("");
}
/* 用「執行到第幾個節點」的方式產生流程圖 html */
function flowStep(nodes, active){
  return `<div class="flow">${nodes.map((n, i) => {
    const done = active.indexOf(i) > -1;
    const cur  = active[active.length - 1] === i;
    if (n.t === "arrow") return `<div class="farrow ${done ? "hl" : ""}">${n.label ? "<span>" + n.label + "</span>" : ""}</div>`;
    const cls = [n.cls || ""];
    if (done) cls.push("hit");
    if (cur) cls.push("hl");
    return `<div class="fbox ${cls.join(" ")}">${n.txt}</div>`;
  }).join("")}</div>`;
}

  name: "and / or / not：三個運算子的實際結果",
  interval: 1250,
  initial(){ return `<div class="vlist"><div class="vpill">逐一測試六個運算式</div></div>`; },
  initialText: "每一行都會得到 True 或 False。看顏色就知道哪邊決定了結果。",
  explain(s){ return prettyExplain(s.t); },
  steps: [
    { t:'<code>3 &lt; 5 and 3 &gt; 1</code> → 左邊 <code>True</code>、右邊 <code>True</code> → <b>兩個都真。所以 True</b>。', html:
      `<div class="chars center">
        <div class="ch hl-brand" style="min-width:110px"><span class="c-val" style="font-size:13px">3 &lt; 5</span><span class="c-idx">True</span></div>
        <div class="ch" style="border-color:transparent;min-width:70px"><span class="c-val" style="color:var(--brand);font-size:16px">and</span></div>

        <div class="ch hl-brand" style="min-width:76px"><span class="c-val" style="font-size:13px">True</span></div>
      </div>` },
    { t:'<code>3 &lt; 5 and 3 == 1</code> → 左邊 True。右邊 <b>False</b>。<code>and</code> 只要有一邊是 False 就整個 False。', html:
      `<div class="chars center">
        <div class="ch hl-brand" style="min-width:110px"><span class="c-val" style="font-size:13px">3 &lt; 5</span><span class="c-idx">True</span></div>
        <div class="ch" style="border-color:transparent;min-width:70px"><span class="c-val" style="color:var(--brand);font-size:16px">and</span></div>

        <div class="ch" style="border-color:transparent;min-width:46px"><span class="c-val" style="color:var(--txt-3)">→</span></div>
        <div class="ch hl-rose" style="min-width:76px"><span class="c-val" style="font-size:13px">False</span></div>

      <div class="callout danger" style="margin-top:14px"><div class="c-title">🚫 and 的鐵律</div><p>只要一邊是 False，整個就是 False。<b>就像乘法：有 0 就變 0。</b></p></div>` },
    { t:'<code>3 &lt; 5 or 3 == 1</code> → 左邊 True 就夠了。<b>or 只要有一邊真就是 True。</b>', html:
      `<div class="chars center">
        <div class="ch hl-brand" style="min-width:110px"><span class="c-val" style="font-size:13px">3 &lt; 5</span><span class="c-idx">True ✔</span></div>
        <div class="ch" style="border-color:transparent;min-width:70px"><span class="c-val" style="color:var(--brand);font-size:16px">or</span></div>
        <div class="ch dim" style="min-width:110px"><span class="c-val" style="font-size:13px">3 == 1</span><span class="c-idx">False</span></div>
        <div class="ch" style="border-color:transparent;min-width:46px"><span class="c-val" style="color:var(--txt-3)">→</span></div>
        <div class="ch hl-brand" style="min-width:76px"><span class="c-val" style="font-size:13px">True</span></div>
      </div>` },
    { t:'<code>3 &gt; 5 or 3 == 1</code> → 兩邊都是 False → <b>全假才假</b>。', html:
      `<div class="chars center">
        <div class="ch hl-rose" style="min-width:110px"><span class="c-val" style="font-size:13px">3 &gt; 5</span><span class="c-idx">False</span></div>
        <div class="ch" style="border-color:transparent;min-width:70px"><span class="c-val" style="color:var(--brand);font-size:16px">or</span></div>
        <div class="ch hl-rose" style="min-width:110px"><span class="c-val" style="font-size:13px">3 == 1</span><span class="c-idx">False</span></div>
        <div class="ch" style="border-color:transparent;min-width:46px"><span class="c-val" style="color:var(--txt-3)">→</span></div>
        <div class="ch hl-rose" style="min-width:76px"><span class="c-val" style="font-size:13px">False</span></div>
      </div>` },
    { t:'<code>not 3 == 1</code> → 原本 <code>3 == 1</code> 是 <b>False</b>，<code>not</code> 把它反轉成 <b>True</b>。', html:
      `<div class="chars center">
        <div class="ch" style="border-color:transparent;min-width:70px"><span class="c-val" style="color:var(--violet);font-size:16px">not</span></div>
        <div class="ch hl-rose" style="min-width:110px"><span class="c-val" style="font-size:13px">3 == 1</span><span class="c-idx">False</span></div>
        <div class="ch" style="border-color:transparent;min-width:46px"><span class="c-val" style="color:var(--txt-3)">→</span></div>
        <div class="ch hl-brand" style="min-width:76px"><span class="c-val" style="font-size:13px">True</span></div>
      </div>` },
    { t:'<code>not 1 == 1</code> → 原本是 True，反轉成 <b>False</b>。', html:
      `<div class="chars center">
        <div class="ch" style="border-color:transparent;min-width:70px"><span class="c-val" style="color:var(--violet);font-size:16px">not</span></div>
        <div class="ch hl-brand" style="min-width:110px"><span class="c-val" style="font-size:13px">1 == 1</span><span class="c-idx">True</span></div>
        <div class="ch" style="border-color:transparent;min-width:46px"><span class="c-val" style="color:var(--txt-3)">→</span></div>
        <div class="ch hl-rose" style="min-width:76px"><span class="c-val" style="font-size:13px">False</span></div>
      </div>` },
    { t:'🎯 記法：<b>and 像乘法（有 0 就 0）、or 像加法（有 1 就大於 0）、not 像反向開關。</b>', html:
      table([
        ["A", "B", "A and B", "A or B", "not A"],
        ["True", "True", '<span class="yes">True</span>', '<span class="yes">True</span>', '<span class="no">False</span>'],
        ["True", "False", '<span class="no">False</span>', '<span class="yes">True</span>', '<span class="no">False</span>'],
        ["False", "True", '<span class="no">False</span>', '<span class="yes">True</span>', '<span class="yes">True</span>'],
        ["False", "False", '<span class="no">False</span>', '<span class="no">False</span>', '<span class="yes">True</span>'],
      ]) }

/* --- 短路求值 ----------------------------------------------------- */
a6_shortcircuit: {
  name: "短路求值：為什麼 number != 0 一定要寫在前面",
  interval: 1350,
  initial(){ return charsHTML("(number != 0) and (m == (n / number))"); },
  initialText: "假設 m = 10、n = 20、number = 0。看看 Python 怎麼處理。",
  explain(s){ return prettyExplain(s.t); },
  steps: [
    { t:'先看資料：<code>m = 10</code>、<code>n = 20</code>、<code>number = 0</code>。', html:
      `<div class="vlist"><div class="vpill set">m → <b>10</b></div><div class="vpill set">n → <b>20</b></div><div class="vpill" style="border-color:var(--rose);background:rgba(251,113,133,.16)">number → <b>0</b> ⚠️</div></div>` },
    { t:'Python <b>先算左邊</b>：<code>number != 0</code> → <code>0 != 0</code> → <b>False</b>。', html:
      `<div class="chars center">
        <div class="ch hl-rose" style="min-width:170px"><span class="c-val" style="font-size:13px">number != 0</span><span class="c-idx">False</span></div>
        <div class="ch" style="border-color:transparent;min-width:76px"><span class="c-val" style="color:var(--brand);font-size:16px">and</span></div>
        <div class="ch dim" style="min-width:230px"><span class="c-val" style="font-size:13px">m == (n / number)</span><span class="c-idx">還沒算</span></div>
      </div>` },
    { t:'<b>關鍵時刻：</b><code>and</code> 的左邊是 False。Python 立刻下結論 —— <b>整個結果一定是 False</b>。', html:
      `<div class="callout danger" style="margin:0"><div class="c-title">⚡ 短路（short-circuit）</div>
       <p>不管右邊是什麼，<code>False and 任何東西</code> 都一定是 <code>False</code>。所以 Python <b>完全不去算右邊</b>。</p></div>` },
    { t:'於是 <code>n / number</code> 這個<b>除以零</b>的危險動作<b>根本沒有被執行</b>。災難避開了。', html:
      `<div class="chars center">
        <div class="ch hl-rose" style="min-width:170px"><span class="c-val" style="font-size:13px">number != 0</span><span class="c-idx">False</span></div>
        <div class="ch" style="border-color:transparent;min-width:76px"><span class="c-val" style="color:var(--brand);font-size:16px">and</span></div>
        <div class="ch gone" style="min-width:230px"><span class="c-val" style="font-size:13px">m == (n / number)</span><span class="c-idx">跳過！</span></div>
      </div>
      <div class="console" style="margin-top:14px">>>> 沒有 ZeroDivisionError，因為右邊根本沒執行<span class="cursor"></span></div>` },
    { t:'如果<b>順序調反</b>呢？<code>m == (n / number) and (number != 0)</code> → 先算的是除法。', html:
      `<div class="chars center">
        <div class="ch hl-rose" style="min-width:230px"><span class="c-val" style="font-size:13px">m == (n / number)</span><span class="c-idx">先算這個</span></div>
      </div>
      <div class="console" style="margin-top:14px;border-color:#6b2233;background:#2a0d15;color:#ffc9d4">ZeroDivisionError: division by zero
💥 程式直接崩潰</div>` },
    { t:'🎯 <b>規則：「檢查」永遠放在「危險動作」前面。</b>這就是短路求值的實際價值。💡 左邊先決定答案，右邊就不算了。', html:
      `<div class="code"><pre><b>✅ 安全</b>：if (number != 0) and (m == (n / number)):
<b>❌ 危險</b>：if (m == (n / number)) and (number != 0):</pre></div>
       <div class="callout tip" style="margin-top:14px"><div class="c-title">💡 課本舉的就是這個例子</div>
       <p>短路不只是「省時間」，它還能<b>保護程式不崩潰</b>。這是考試很愛考的重點。</p></div>` },
    { t:'<code>or</code> 也有短路：左邊是 True 就不算右邊。', html:
      `<div class="chars center">
        <div class="ch hl-brand" style="min-width:130px"><span class="c-val" style="font-size:13px">True</span><span class="c-idx">左邊為真</span></div>
        <div class="ch" style="border-color:transparent;min-width:70px"><span class="c-val" style="color:var(--brand);font-size:16px">or</span></div>
        <div class="ch gone" style="min-width:170px"><span class="c-val" style="font-size:13px">任何東西</span><span class="c-idx">跳過！</span></div>
        <div class="ch" style="border-color:transparent;min-width:46px"><span class="c-val" style="color:var(--txt-3)">→</span></div>
        <div class="ch hl-brand" style="min-width:76px"><span class="c-val" style="font-size:13px">True</span></div>
      </div>` }
  ]
},

/* --- 鏈式比較 ----------------------------------------------------- */
a6_chaincmp: {
  name: "鏈式比較：10 < x <= 20 在 Python 裡的意思",
  interval: 1250,
  initial(){ return charsHTML("10 < x <= 20", {}); },
  initialText: "Python 獨有的寫法：像數學一樣寫出範圍。",
  explain(s){ return prettyExplain(s.t); },
  steps: [
    { t:'<code>10 &lt; x &lt;= 20</code> 看起來像數學的不等式。Python 真的看得懂。', html:
      charsHTML("10 < x <= 20", {0:"hl-brand",1:"hl-brand",5:"hl-violet",9:"hl-violet"}, {center:true}) },
    { t:'它的意思其實是<b>兩個條件的組合</b>：<code>(10 &lt; x) and (x &lt;= 20)</code>。', html:
      `<div class="chars center">
        <div class="ch hl-brand" style="min-width:120px"><span class="c-val" style="font-size:13px">10 &lt; x</span></div>
        <div class="ch" style="border-color:transparent;min-width:70px"><span class="c-val" style="color:var(--brand);font-size:16px">and</span></div>
        <div class="ch hl-violet" style="min-width:130px"><span class="c-val" style="font-size:13px">x &lt;= 20</span></div>
      </div>
      <div class="callout info" style="margin-top:14px"><div class="c-title">ℹ️ 注意 x 只寫了一次</div>
      <p><code>10 &lt; x &lt;= 20</code> 比 <code>(x &gt; 10) and (x &lt;= 20)</code> 更短，而且 <code>x</code> 只出現一次 —— 如果 x 是個很長的運算式（例如 <code>student.grade</code>），這就省掉很多重複。</p></div>` },
    { t:'代入 <code>x = 15</code>：<code>10 &lt; 15</code> True、<code>15 &lt;= 20</code> True → <b>True</b>。', html:
      `<div class="chars center">
        <div class="ch hl-brand" style="min-width:120px"><span class="c-val" style="font-size:13px">10 &lt; 15</span><span class="c-idx">True</span></div>
        <div class="ch" style="border-color:transparent;min-width:70px"><span class="c-val" style="color:var(--brand);font-size:16px">and</span></div>
        <div class="ch hl-brand" style="min-width:130px"><span class="c-val" style="font-size:13px">15 &lt;= 20</span><span class="c-idx">True</span></div>
      </div><div class="console" style="margin-top:14px">15 在範圍內 → True<span class="cursor"></span></div>` },
    { t:'代入 <code>x = 5</code>：<code>10 &lt; 5</code> <b>False</b> → 整個 False。', html:
      `<div class="chars center">
        <div class="ch hl-rose" style="min-width:120px"><span class="c-val" style="font-size:13px">10 &lt; 5</span><span class="c-idx">False</span></div>
        <div class="ch" style="border-color:transparent;min-width:70px"><span class="c-val" style="color:var(--brand);font-size:16px">and</span></div>
        <div class="ch dim" style="min-width:130px"><span class="c-val" style="font-size:13px">5 &lt;= 20</span><span class="c-idx">不必算</span></div>
      </div><div class="console" style="margin-top:14px">5 不在範圍內 → False<span class="cursor"></span></div>` },
    { t:'「不在範圍」也可以用 <code>not</code>：<code>not(10 &lt; x &lt;= 20)</code>。', html:
      `<div class="vlist"><div class="vpill set">x = 15 → <code>not(10 &lt; 15 &lt;= 20)</code> → <b>False</b></div>
       <div class="vpill set">x = 5 → <code>not(10 &lt; 5 &lt;= 20)</code> → <b>True</b></div></div>
       <div class="callout tip" style="margin-top:14px"><div class="c-title">💡 課本的簡化對照</div>
       <p><code>(x &gt; 10) and (x &lt;= 20)</code>　→　<code>10 &lt; x &lt;= 20</code><br>
       <code>(x &lt;= 10) or (x &gt; 20)</code>　→　<code>not(10 &lt; x &lt;= 20)</code></p></div>` },
    { t:'⚠️ <b>但這是 Python 專屬的！</b>在 C、Java、JavaScript 裡。<code>10 &lt; x &lt;= 20</code> 的結果完全不同。', html:
      `<div class="callout danger" style="margin:0"><div class="c-title">🚫 其他語言的陷阱</div>
       <p>在 C/Java/JS 裡，<code>10 &lt; x</code> 會先算出 <code>1</code>（真）或 <code>0</code>（假），然後拿這個 1 或 0 去和 20 比較：<code>1 &lt;= 20</code> 永遠是 True。</p>
       <p><b>所以那個寫法在其他語言裡「永遠是 True」</b>，完全是錯的。只有 Python 會聰明地理解成鏈式比較。</p></div>` }
  ]
},

/* --- 迪摩根定律 --------------------------------------------------- */
a6_demorgan: {
  name: "迪摩根定律：把 not 推進括號",
  interval: 1300,
  initial(){ return charsHTML("not (A or B)", {}); },
  initialText: "把 not 從括號外面搬進去，括號裡的運算子要換。",
  explain(s){ return prettyExplain(s.t); },
  steps: [
    { t:'原本的式子：<code>not (A or B)</code> —— not 在括號外面。', html:
      `<div class="chars center">
        <div class="ch hl-violet" style="min-width:76px"><span class="c-val" style="font-size:16px">not</span></div>
        <div class="ch" style="border-color:transparent;min-width:30px"><span class="c-val">(</span></div>
        <div class="ch hl-brand" style="min-width:56px"><span class="c-val" style="font-size:15px">A</span></div>
        <div class="ch hl-rose" style="min-width:76px"><span class="c-val" style="font-size:15px">or</span></div>
        <div class="ch hl-blue" style="min-width:56px"><span class="c-val" style="font-size:15px">B</span></div>
        <div class="ch" style="border-color:transparent;min-width:30px"><span class="c-val">)</span></div>
      </div>` },
    { t:'把 <code>not</code> 推進括號：<b>每一個</b>條件前面都要加 <code>not</code>。', html:
      `<div class="chars center">
        <div class="ch hl-violet" style="min-width:76px"><span class="c-val" style="font-size:16px">not</span></div>
        <div class="ch hl-brand" style="min-width:56px"><span class="c-val" style="font-size:15px">A</span></div>
        <div class="ch" style="border-color:transparent;min-width:76px"><span class="c-val" style="color:var(--txt-3);font-size:15px">?</span></div>
        <div class="ch hl-violet" style="min-width:76px"><span class="c-val" style="font-size:16px">not</span></div>
        <div class="ch hl-blue" style="min-width:56px"><span class="c-val" style="font-size:15px">B</span></div>
      </div>` },
    { t:'<b>關鍵：中間的運算子要互換！</b><code>or</code> 變成 <code>and</code>。', html:
      `<div class="chars center">
        <div class="ch hl-violet" style="min-width:76px"><span class="c-val" style="font-size:16px">not A</span></div>
        <div class="ch hl-amber pop" style="min-width:86px"><span class="c-val" style="font-size:15px">and</span></div>
        <div class="ch hl-violet" style="min-width:76px"><span class="c-val" style="font-size:16px">not B</span></div>
      </div>
      <div class="out" style="margin-top:14px"><span class="out-label">結論</span>not(A or B)  ==  not A and not B</div>` },
    { t:'用日常語言驗證：「不是（下雨<b>或</b>颳風）」=「沒下雨<b>而且</b>沒颳風」。', html:
      `<div class="callout analogy" style="margin:0"><div class="c-title">🎈 生活驗證</div>
       <p><b>not(雨 or 風)</b> → 「不是（下雨或颳風）」→ 要「沒雨」也要「沒風」→ <b>not 雨 and not 風</b> ✅</p>
       <p>如果只說「沒下雨」，颳風的情況就漏掉了 —— 所以必須用 <code>and</code>。</p></div>` },
    { t:'第二條：<code>not (A and B)</code> → <code>not A or not B</code>。<b><code>and</code> 變成 <code>or</code>。</b>', html:
      `<div class="out" style="margin:0"><span class="out-label">兩條定律</span>not(A or B)   ==   not A  and  not B
not(A and B)  ==   not A  or   not B</div>
       <div class="callout tip" style="margin-top:14px"><div class="c-title">💡 一句話記住</div>
       <p><b>not 推進括號時，and 和 or 互換。</b>就像正負號相乘：負負得正。</p></div>` },
    { t:'用程式實際驗證（三個都是 True，因為它們是同一件事）：', html:
      `<div class="console">>>> not (1 > 5 or 15 % 5 != 0)
True
>>> not (1 > 5) and not (15 % 5 != 0)
True
>>> 1 <= 5 and 15 % 5 == 0
True<span class="cursor"></span></div>
       <div class="callout info" style="margin-top:14px"><div class="c-title">ℹ️ 逐步化簡</div>
       <p>第三行只是把 <code>not</code> 全部化簡掉了：<code>not(1 &gt; 5)</code> = <code>1 &lt;= 5</code>、<code>not(15 % 5 != 0)</code> = <code>15 % 5 == 0</code>。</p></div>` },
    { t:'🎯 <b>迪摩根定律是用來「理解」和「驗證」的，不是非得化簡。</b>寫程式時怎麼好讀就怎麼寫。', html:
      `<div class="callout tip" style="margin:0"><div class="c-title">💡 什麼時候真的會用到？</div>
       <p>當你想把「條件不符合」的情況提出來時：<code>if not (a &gt; 0 and b &gt; 0):</code> 可以直接寫成 <code>if a &lt;= 0 or b &lt;= 0:</code>，少一層括號。</p></div>` }
  ]
},

/* --- bool1~bool4 -------------------------------------------------- */
a6_bool1234: {
  name: "bool1 ~ bool4：一步一步算出答案",
  interval: 1400,
  initial(){ return `<div class="code"><pre>a = 10,  b = 20,  c = 30

bool1 = True and (a > b)
bool2 = (not True) or (b != c)
bool3 = (True and (not False)) or (a > b)
bool4 = (a % b == 2) and ((not True) or False)</pre></div>`; },
  initialText: "先看資料：a = 10、b = 20、c = 30。",

if num3 < smallest:

    middle = smallest
    smallest = num3

},

      `<div class="code"><pre>if (year % 4 == 0 and year % 100 != 0) or (year % 400 == 0):
    print("leap year")</pre></div>
       ${table([
         ["年份", "能被 4 整除？", "能被 100 整除？", "能被 400 整除？", "結果"],
         ["<code>2024</code>", "✔", "✘", "—", "<b>閏年</b>"],
         ["<code>1900</code>", "✔", "✔", "✘", "不是閏年"],
         ["<code>2000</code>", "✔", "✔", "✔", "<b>閏年</b>"],
         ["<code>2023</code>", "✘", "—", "—", "不是閏年"],
       ])}` },
    { t:'🎯 <b>記住那個例外：整百年份必須能被 400 整除才是閏年。</b>1600 ✔、1700 ✘、1800 ✘、1900 ✘、2000 ✔。', html:
      `<div class="callout tip" style="margin:0"><div class="c-title">💡 為什麼要有這個規則？</div>
      <p>因為地球繞太陽一圈其實不是剛好 365.25 天，而是約 365.2422 天。如果每 4 年就加一天，累積起來會愈差愈多。用「整百年 skip、四百年補回」來修正，就相當精確了。</p></div>` }
  ]
}

});


/* ==========================================================================
   3. 互動小工具：自我檢測題、真值表、滑桿元件
   ========================================================================== */
/* --- 自我檢測題 --- */
function initQuiz(root){
  $$(".quiz", root).forEach(q => {
    if (q.dataset.ready === "1") return;
    q.dataset.ready = "1";
    const ans = Number(q.dataset.answer);
    $$(".quiz-opt", q).forEach((opt, i) => {
      opt.addEventListener("click", () => {
        if (q.dataset.done === "1") return;
        q.dataset.done = "1";
        $$(".quiz-opt", q).forEach((o, j) => {
          if (j === ans) o.classList.add("right");
          else if (j === i) o.classList.add("wrong");
          o.disabled = true;
        });
        const fb = $(".quiz-fb", q);
        if (fb) fb.classList.add("show");
      });
    });
  });
}
/* --- 真值表開關（A / B 可切換，成績即時更新） --- */
function initTruth(root){
  $$("[data-truth]", root).forEach(box => {
    if (box.dataset.ready === "1") return;
    box.dataset.ready = "1";
    const state = { A: 1, B: 1 };
    const sync = () => {
      $$("[data-var]", box).forEach(sw => {
        sw.dataset.val = state[sw.dataset.var] ? "1" : "0";
        sw.textContent = state[sw.dataset.var] ? "True" : "False";
      });
      const A = !!state.A, B = !!state.B;
      const res = { "A and B": A && B, "A or B": A || B, "not A": !A, "not (A and B)": !(A && B) };
      $$("[data-tt]", box).forEach(card => {
        const v = res[card.dataset.tt];
        card.classList.toggle("on", v);
        card.classList.toggle("off", !v);
        $(".tt-val", card).textContent = v ? "True" : "False";
      });
      const tbody = $("tbody", box);
      if (tbody){
        $$("tr", tbody).forEach((tr, i) => {
          const bits = [!!(i & 2), !!(i & 1)];
          tr.classList.toggle("tbl-hl", bits[0] === A && bits[1] === B);
        });
      }
    };
    $$("[data-var]", box).forEach(sw => sw.addEventListener("click", () => {
      state[sw.dataset.var] = state[sw.dataset.var] ? 0 : 1;
      sync();
    }));
    sync();
  });
}
/* --- 切片探索器：m / n / s 三個滑桿 --- */
function initSlicer(root){
  $$("[data-slicer]", root).forEach(box => {
    if (box.dataset.ready === "1") return;
    box.dataset.ready = "1";
    const s = box.dataset.slicer;
    const L = s.length;
    const mEl = $('[data-k="m"]', box), nEl = $('[data-k="n"]', box), stEl = $('[data-k="s"]', box);
    const run = () => {
      const m = Number(mEl.value), n = Number(nEl.value), st = Number(stEl.value) || 1;
      const norm = v => v < 0 ? L + v : v;
      const a = norm(m), b = norm(n);
      const picked = [];
      if (st > 0) for (let i = Math.max(0,a); i < Math.min(L,b); i += st) picked.push(i);
      else for (let i = Math.min(L-1,a); i > Math.max(-1,b); i += st) picked.push(i);
      const hl = {}; picked.forEach((p, k) => hl[p] = "hl-" + ["brand","blue","amber","violet","rose"][k % 5]);
      $(".sl-chars", box).innerHTML = charsHTML(s, hl, { neg:true, center:true });
      $(".sl-m", box).textContent = m; $(".sl-n", box).textContent = n; $(".sl-s", box).textContent = st;
      $(".sl-res", box).textContent = "s[" + m + ":" + n + (st !== 1 ? ":" + st : "") + "]  →  " +
        JSON.stringify(picked.map(i => s[i]).join(""));
      $(".sl-idx", box).textContent = "共 " + picked.length + " 個字元";
    };
    [mEl, nEl, stEl].forEach(el => el.addEventListener("input", run));
    const reset = $('[data-a="sl-reset"]', box);
    if (reset) reset.addEventListener("click", () => { mEl.value = 0; nEl.value = L; stEl.value = 1; run(); });
    run();
  });
}
/* --- 隨機抽字模擬器 --- */
function initPicker(root){
  $$("[data-picker]", root).forEach(box => {
    if (box.dataset.ready === "1") return;
    box.dataset.ready = "1";
    const word = box.dataset.picker;
    const slots = Number(box.dataset.slots || 3);
    const btn = $(".pk-go", box);
    let n = 0;
    btn.addEventListener("click", () => {
      n++;
      const idx = range(slots).map(() => Math.floor(Math.random() * word.length));
      $(".pk-chars", box).innerHTML = charsHTML(word, Object.fromEntries(idx.map((v, k) => [v, ["hl-brand","hl-blue","hl-amber"][k % 3]])), { center:true });
      $(".pk-out", box).innerHTML =
        idx.map((v, k) => `<div class="vpill set">第 ${k+1} 個 → index ${v} → <b>${word[v]}</b></div>`).join("") +
        `<div class="vpill">結果字串 → <b>${idx.map(v => word[v]).join("")}</b></div>`;
      $(".pk-count", box).textContent = "已執行 " + n + " 次";
    });
    btn.click();
  });
}

/* ==========================================================================
   4. 導覽列 + 路由
   ========================================================================== */
const LESSONS = window.LESSONS || [];
let current = 0;

function buildNav(){
  $("#navList").innerHTML = LESSONS.map((L, i) => `
    <button class="nav-item" data-go="${i}">
      <span class="n-num">${L.num}</span>
      <span class="n-body">
        <span class="n-title">${L.short}</span>
        <span class="n-sub">${L.sub}</span>
      </span>
      <span class="n-check">✓</span>
    </button>`).join("");

  $("#content").innerHTML = LESSONS.map((L, i) => `
    <article class="lesson" id="lesson-${i}">
      <header class="lesson-head">
        <span class="kicker">Lesson ${L.num} · ${L.kicker}</span>
        <h1>${L.title}</h1>
        <p class="lead">${L.lead}</p>
        <div class="head-meta">${(L.chips || []).map(c => `<span class="chip">${c}</span>`).join("")}</div>
      </header>
      <div class="goals"><h4>📌 讀完這一課，你會學會</h4><ol>${(L.goals || []).map(g => `<li>${g}</li>`).join("")}</ol></div>
      ${L.body}
      <div class="pager">
        ${i > 0 ? `<button class="prev" data-go="${i-1}"><span class="p-dir">◀ 上一課</span><span class="p-name">${LESSONS[i-1].short}</span></button>` : `<button disabled><span class="p-dir">◀ 上一課</span><span class="p-name">已經是第一課</span></button>`}
        ${i < LESSONS.length - 1 ? `<button class="next" data-go="${i+1}"><span class="p-dir">下一課 ▶</span><span class="p-name">${LESSONS[i+1].short}</span></button>` : `<button disabled class="next"><span class="p-dir">下一課 ▶</span><span class="p-name">已經是最後一課</span></button>`}
      </div>
    </article>`).join("");
}

function buildToc(){
  const L = LESSONS[current];
  $("#tocList").innerHTML = (L.toc || []).map(t =>
    `<button class="toc-link" data-toc="${t.id}">${t.title}</button>`).join("")
    || '<span class="toc-link" style="cursor:default;border:0;color:#5d6b90">（本課無小節）</span>';
}

function go(i, anchor){
  if (i < 0 || i >= LESSONS.length) return;
  pauseAllAnims();
  current = i;
  $$(".lesson").forEach((el, k) => el.classList.toggle("active", k === i));
  $$(".nav-item").forEach((el, k) => el.classList.toggle("active", k === i));
  buildToc();
  const art = $("#lesson-" + i);
  initAnims(art);
  initQuiz(art);
  initTruth(art);
  initSlicer(art);
  initPicker(art);
  $("#mbTitle").textContent = "Lesson " + LESSONS[i].num + " · " + LESSONS[i].short;
  try { localStorage.setItem("py-notes-last", String(i)); } catch(e){}
  closeSidebar();
  if (anchor){
    const t = $("#" + anchor);
    if (t) { t.scrollIntoView({ behavior:"smooth", block:"start" }); return; }
  }
  window.scrollTo({ top:0, behavior:"auto" });
}

/* 側欄開合（手機） */
function openSidebar(){ $("#sidebar").classList.add("open"); $("#scrim").classList.add("show"); }
function closeSidebar(){ $("#sidebar").classList.remove("open"); $("#scrim").classList.remove("show"); }

document.addEventListener("click", e => {
  const g = e.target.closest("[data-go]");
  if (g){ go(Number(g.dataset.go)); return; }
  const t = e.target.closest("[data-toc]");
  if (t){
    const el = $("#" + t.dataset.toc);
    if (el) el.scrollIntoView({ behavior:"smooth", block:"start" });
  }
});

/* 啟動 */
(function boot(){
  buildNav();
  let start = 0;
  try { start = Number(localStorage.getItem("py-notes-last") || 0) || 0; } catch(e){}
  if (start < 0 || start >= LESSONS.length) start = 0;
  go(start);
  $("#burger").addEventListener("click", openSidebar);
  $("#scrim").addEventListener("click", closeSidebar);
  document.addEventListener("keydown", e => {
    if (e.target.matches("input,select,textarea")) return;
    if (e.key === "ArrowRight") go(current + 1);
    if (e.key === "ArrowLeft")  go(current - 1);
  });
})();
