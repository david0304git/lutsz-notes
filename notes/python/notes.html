<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Python 零基礎學習筆記 · 第 3–6 課</title>
<style>
/* ==========================================================================
   設計系統（Design Tokens）
   ========================================================================== */
:root{
  /* 淺色・溫暖基調 */
  --bg:#fdf8f1;              /* 米白（頁面底色） */
  --bg-2:#fbf3e7;
  --bg-3:#f5e9d9;
  --panel:#fffdf9;
  --panel-2:#fdf6ec;
  --line:#e8d9c3;
  --line-soft:#f0e5d4;
  --txt:#3b2f26;             /* 深咖啡（主文字） */
  --txt-2:#6b5a4b;
  --txt-3:#a08e7c;
  --brand:#c2600f;           /* 暖橙（主色） */
  --brand-dim:#a54f0a;
  --blue:#2f6fb5;
  --blue-l:#1f5c9e;
  --violet:#8b5cf6;
  --amber:#c98a04;
  --rose:#d94f5c;
  --green:#1f8a4c;
  --code-bg:#fffaf0;
  --code-fg:#4a3a2c;
  --radius:16px;
  --radius-s:10px;
  --shadow:0 2px 4px rgba(120,85,40,.05), 0 10px 26px rgba(120,85,40,.09);
  --mono:"SF Mono",Menlo,Consolas,"DejaVu Sans Mono","Noto Sans Mono",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Hiragino Sans TC","Microsoft JhengHei","Noto Sans TC",sans-serif;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;background:
    radial-gradient(1100px 640px at 10% -8%, rgba(255,196,120,.28), transparent 62%),
    radial-gradient(900px 560px at 94% 2%, rgba(255,168,150,.20), transparent 64%),
    radial-gradient(700px 500px at 50% 110%, rgba(255,222,168,.22), transparent 70%),
    var(--bg);
  color:var(--txt);font-family:var(--sans);line-height:1.8;
  -webkit-font-smoothing:antialiased;
  font-size:16.5px;
}
::selection{background:rgba(255,183,77,.45)}

/* 捲軸 */
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background:#e0cdb2;border-radius:99px}
*::-webkit-scrollbar-thumb:hover{background:#cdb595}

/* ==========================================================================
   版面：左側導覽 + 右側內容
   ========================================================================== */
.layout{display:flex;min-height:100vh}

.sidebar{
  width:290px;flex:0 0 290px;background:rgba(255,253,248,.94);
  border-right:1px solid var(--line-soft);padding:22px 18px 40px;
  position:sticky;top:0;height:100vh;overflow-y:auto;z-index:40;
  backdrop-filter:blur(12px);
}
.brand{display:flex;align-items:center;gap:11px;margin-bottom:6px}
.brand-logo{
  width:38px;height:38px;border-radius:11px;flex:0 0 38px;
  background:linear-gradient(140deg,#ffb347,#e8734a);
  display:grid;place-items:center;font-weight:800;color:#fff;font-size:17px;
  box-shadow:0 8px 18px rgba(232,115,74,.32)
}
.brand-txt b{display:block;font-size:15.5px;letter-spacing:.2px}
.brand-txt span{font-size:11.5px;color:var(--txt-3);letter-spacing:.4px}
.sidebar-note{
  font-size:12.8px;color:var(--txt-2);margin:14px 0 18px;padding:12px 13px;
  background:#fff8ec;border:1px solid var(--line-soft);border-radius:var(--radius-s)
}
.sidebar-note b{color:var(--brand)}

.nav-group-title{
  font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--txt-3);
  margin:20px 0 9px;font-weight:700
}
.nav-item{
  display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;
  background:transparent;border:1px solid transparent;color:var(--txt-2);
  padding:11px 12px;border-radius:12px;cursor:pointer;font-family:inherit;
  font-size:14px;line-height:1.5;transition:.18s;margin-bottom:4px
}
.nav-item:hover{background:#fdf3e6;color:var(--txt);border-color:var(--line)}
.nav-item.active{
  background:linear-gradient(100deg,rgba(255,183,71,.26),rgba(255,140,105,.18));
  border-color:rgba(194,96,15,.42);color:var(--txt)
}
.nav-item .n-num{
  flex:0 0 26px;height:26px;border-radius:8px;display:grid;place-items:center;
  background:var(--bg-3);font-size:12px;font-weight:800;color:var(--brand);font-family:var(--mono)
}
.nav-item.active .n-num{background:linear-gradient(140deg,#ffb347,#e8734a);color:#fff}
.nav-item .n-body{flex:1;min-width:0}
.nav-item .n-title{font-weight:650;display:block}
.nav-item .n-sub{font-size:11.5px;color:var(--txt-3);display:block;margin-top:1px}
.nav-item .n-check{font-size:13px;opacity:0;transition:.2s}
.nav-item.done .n-check{opacity:1}

.toc-box{margin-top:20px;border-top:1px dashed var(--line-soft);padding-top:14px}
.toc-box .nav-group-title{margin-top:4px}
.toc-link{
  display:block;width:100%;text-align:left;background:none;border:0;color:var(--txt-3);
  font-family:inherit;font-size:12.8px;padding:6px 9px;border-radius:8px;cursor:pointer;
  border-left:2px solid transparent;transition:.15s
}
.toc-link:hover{color:var(--brand);background:var(--panel-2);border-left-color:var(--brand)}

/* 主要內容 */
.main{flex:1;min-width:0;padding:0 clamp(16px,3.4vw,54px) 120px}
.wrap{max-width:1000px;margin:0 auto}

.lesson{display:none;animation:fade .32s ease}
.lesson.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.lesson-head{padding:46px 0 8px}
.kicker{
  display:inline-flex;align-items:center;gap:8px;font-size:12px;letter-spacing:1.2px;
  text-transform:uppercase;color:var(--brand);font-weight:750;
  background:#fff3e0;border:1px solid #f0d5aa;
  padding:6px 13px;border-radius:99px;margin-bottom:16px
}
.lesson-head h1{
  font-size:clamp(28px,4.4vw,43px);line-height:1.2;margin:0 0 12px;letter-spacing:-.5px
}
.lesson-head h1 em{
  font-style:normal;background:linear-gradient(100deg,#e8734a,#d99a1f 55%,#c2600f);
  -webkit-background-clip:text;background-clip:text;color:transparent
}
.lesson-head p.lead{font-size:16.5px;color:var(--txt-2);margin:0;max-width:74ch}
.head-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.chip{
  font-size:12.8px;color:var(--txt-2);background:#fffaf2;
  border:1px solid var(--line);padding:6px 12px;border-radius:99px
}

/* 目錄卡 */
.goals{
  margin:26px 0 8px;background:linear-gradient(150deg,#fffaf0,#fff5e8);
  border:1px solid #f0dcc0;border-radius:var(--radius);padding:21px 23px
}
.goals h4{margin:0 0 12px;font-size:14.5px;color:var(--brand-dim);letter-spacing:.4px}
.goals ol{margin:0;padding-left:20px;color:var(--txt-2);font-size:14.5px}
.goals li{margin:5px 0}

/* 段落 */
section.sec{padding-top:44px;scroll-margin-top:20px}
h2.s-title{
  font-size:clamp(21px,2.7vw,27px);margin:0 0 6px;letter-spacing:-.2px;
  display:flex;align-items:baseline;gap:12px;flex-wrap:wrap
}
h2.s-title .s-idx{
  font-family:var(--mono);font-size:13.5px;color:#fff;font-weight:750;
  background:linear-gradient(140deg,#ffb347,#e8734a);border:0;
  padding:4px 11px;border-radius:8px;box-shadow:0 2px 6px rgba(232,115,74,.24)
}
.s-sub{color:var(--txt-3);font-size:14px;margin:0 0 18px}
h3{font-size:18px;margin:32px 0 10px;color:#2f2318}
h4{font-size:16px;margin:22px 0 8px;color:var(--brand-dim)}
p{margin:11px 0;color:var(--txt-2)}
ul,ol{color:var(--txt-2);padding-left:22px}
li{margin:6px 0}
strong{color:#2a1f15;font-weight:700}
a{color:var(--brand)}

code{
  font-family:var(--mono);font-size:.9em;background:#fdeed8;color:#9a4a0d;
  padding:2px 6px;border-radius:6px;border:1px solid #f0dabb;white-space:nowrap
}
.kbd{
  font-family:var(--mono);font-size:.85em;background:var(--bg-3);border:1px solid var(--line);
  border-bottom-width:2px;border-radius:6px;padding:1px 6px;color:var(--txt-2)
}

/* 程式碼區塊 */
.code{
  background:var(--code-bg);border:1px solid var(--line);border-radius:var(--radius-s);
  margin:16px 0;overflow:hidden;box-shadow:0 1px 2px rgba(120,85,40,.05)
}
.code-top{
  display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:9px 14px;background:#fdf1e0;border-bottom:1px solid var(--line);
  font-size:11.5px;color:#9a8574;font-family:var(--mono);letter-spacing:.4px
}
.code-top .dots{display:flex;gap:5px}
.code-top .dots i{width:9px;height:9px;border-radius:50%;display:block}
.code-top .dots i:nth-child(1){background:#ff5f57}
.code-top .dots i:nth-child(2){background:#febc2e}
.code-top .dots i:nth-child(3){background:#28c840}
.code pre{
  margin:0;padding:14px 16px;overflow-x:auto;font-family:var(--mono);
  font-size:13.6px;line-height:1.9;color:var(--code-fg)
}
.code pre .ln{color:#c9b49a;user-select:none;display:inline-block;width:2.1em;text-align:right;margin-right:14px}
.code pre b{color:var(--brand);font-weight:700}
.tok-kw{color:#b8347a;font-weight:650}
.tok-fn{color:#1f6fb2;font-weight:600}
.tok-str{color:#1f7a46}
.tok-num{color:#9a6b00}
.tok-com{color:#a08e7c;font-style:italic}
.tok-op{color:#7c5cd6}

/* 輸出區塊 */
.out{
  background:#fffdf6;border:1px solid #e8d9c3;border-left:3px solid #e08a2e;
  border-radius:var(--radius-s);padding:11px 15px;margin:12px 0;
  font-family:var(--mono);font-size:13.4px;line-height:1.85;color:#5a4632;white-space:pre-wrap
}
.out .out-label{
  display:block;font-size:11px;letter-spacing:1.2px;color:#c07a1e;
  text-transform:uppercase;margin-bottom:5px;font-family:var(--sans)
}

/* 提示框 */
.callout{
  border-radius:var(--radius-s);padding:15px 18px;margin:18px 0;
  border:1px solid var(--line);background:#fffdf7;font-size:15px
}
.callout .c-title{font-weight:750;display:flex;align-items:center;gap:8px;margin-bottom:5px;font-size:14.5px}
.callout p{margin:5px 0}
.callout.tip{border-color:#f0cf9a;background:#fff8e9}
.callout.tip .c-title{color:var(--brand)}
.callout.warn{border-color:#eccf92;background:#fffaea}
.callout.warn .c-title{color:var(--amber)}
.callout.danger{border-color:#f0b8bd;background:#fef2f3}
.callout.danger .c-title{color:var(--rose)}
.callout.info{border-color:#b9d3ec;background:#f2f7fd}
.callout.info .c-title{color:var(--blue-l)}
.callout.analogy{border-color:#cdbdf5;background:#f6f2fe}
.callout.analogy .c-title{color:var(--violet)}

/* 表格 */
.tbl-wrap{overflow-x:auto;margin:16px 0;border:1px solid var(--line-soft);border-radius:var(--radius-s)}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:420px}
th,td{padding:9px 13px;text-align:left;border-bottom:1px solid var(--line-soft)}
th{background:#fdf0dc;color:#5a3c12;font-weight:750;font-size:13.4px;white-space:nowrap}
td{color:var(--txt-2)}
tbody tr:nth-child(even){background:#fefaf3}
tbody tr:hover{background:#fff4e2}
tbody tr:last-child td{border-bottom:0}
td code{white-space:nowrap}
td.yes{color:var(--green);font-weight:700}
td.no{color:var(--rose);font-weight:700}

/* ==========================================================================
   動畫元件
   ========================================================================== */
.anim{
  background:#fffdf8;
  border:1px solid var(--line);border-radius:var(--radius);
  margin:24px 0;overflow:hidden;box-shadow:var(--shadow)
}
.anim-head{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:13px 18px;background:#fdf1e0;border-bottom:1px solid var(--line);
  flex-wrap:wrap
}
.anim-head .a-name{font-weight:700;font-size:14.5px;display:flex;align-items:center;gap:9px}
.anim-head .a-name .badge{
  font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:#fff;
  background:linear-gradient(100deg,#ffb347,#e8734a);
  padding:3px 8px;border-radius:6px;font-weight:800
}
.anim-stage{padding:20px 17px;min-height:120px}
.anim-foot{
  display:flex;align-items:center;gap:9px;flex-wrap:wrap;
  padding:13px 18px;border-top:1px solid var(--line-soft);background:#fefaf3
}
.anim-explain{
  padding:0 18px 16px;font-size:15px;color:var(--txt-2);min-height:26px;line-height:1.8
}
.anim-explain .step-txt{display:block}
.anim-explain b{color:var(--brand-dim);font-weight:700}

.btn{
  font-family:inherit;font-size:13.4px;font-weight:650;cursor:pointer;
  background:#fffaf2;color:var(--txt-2);border:1px solid var(--line);
  padding:7px 14px;border-radius:9px;transition:.16s;display:inline-flex;
  align-items:center;gap:6px
}
.btn:hover{background:#fdf0dc;color:var(--brand-dim);border-color:#e3c9a3}
.btn:active{transform:translateY(1px)}
.btn.primary{background:linear-gradient(100deg,#ffb347,#e8734a);color:#fff;border:0;font-weight:750;box-shadow:0 4px 12px rgba(232,115,74,.28)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.38;cursor:not-allowed;transform:none}
.step-pill{
  margin-left:auto;font-family:var(--mono);font-size:12.2px;color:var(--txt-3);
  background:var(--panel-2);border:1px solid var(--line-soft);
  padding:5px 11px;border-radius:99px;white-space:nowrap
}

/* 字元格（索引可視化） */
.chars{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0 4px}
.chars.center{justify-content:center}
.ch{
  min-width:40px;padding:6px 4px;border-radius:9px;background:var(--panel-2);
  border:1px solid var(--line-soft);text-align:center;transition:.22s;position:relative
}
.ch .c-val{font-family:var(--mono);font-size:17.5px;color:#2a1f15;line-height:1.35;display:block;font-weight:650}
.ch .c-idx{font-family:var(--mono);font-size:10.5px;color:var(--txt-3);display:block}
.ch .c-neg{font-family:var(--mono);font-size:10.5px;color:#6d7ba3;display:block}
.ch.hl-shape{background:#ffe9cc;border-color:var(--brand);transform:translateY(-4px)}
.ch.hl-shape .c-val{color:var(--brand-dim)}
.ch.hl-brand{background:#ffe9cc;border-color:var(--brand)}
.ch.hl-blue{background:#e3eefb;border-color:#7ba7d4}
.ch.hl-amber{background:#fff4d6;border-color:#d9a92f}
.ch.hl-rose{background:#fde8ec;border-color:#e08a98}
.ch.hl-violet{background:#f0ebfd;border-color:#a98ceb}
.ch.dim{opacity:.36}
.ch.pop{animation:pop .4s ease}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.14)}100%{transform:scale(1)}}
.ch.gone{opacity:.12;text-decoration:line-through}

/* 記憶體圖 */
.mem{display:grid;grid-template-columns:auto 1fr;gap:26px;align-items:start}
.mem-vars{display:flex;flex-direction:column;gap:12px}
.mem-var{
  background:var(--panel-2);border:1px solid var(--line-soft);border-radius:10px;
  padding:9px 13px;font-family:var(--mono);font-size:13.5px;min-width:112px
}
.mem-var .v-name{color:var(--blue-l);display:block;font-size:11.5px;letter-spacing:.5px}
.mem-var .v-val{color:#2a1f15;font-size:16.5px;font-weight:650}
.mem-var.hl{border-color:var(--amber);box-shadow:0 0 0 3px rgba(251,191,36,.14)}
.mem-objs{display:flex;flex-direction:column;gap:14px}
.mem-obj{
  border:1.5px dashed var(--line);border-radius:12px;padding:11px 14px;
  background:#fffdf7;position:relative
}
.mem-obj.alive{border-style:solid;border-color:var(--brand)}
.mem-obj .o-addr{font-family:var(--mono);font-size:10.5px;color:var(--txt-3);margin-bottom:6px;display:block}
.mem-obj .o-cells{display:flex;gap:5px;flex-wrap:wrap}
.mem-obj .o-cell{
  min-width:42px;padding:5px 9px;background:#fff7ea;border:1px solid var(--line);
  border-radius:7px;font-family:var(--mono);font-size:13.5px;text-align:center;color:#2a1f15;transition:.25s
}
.mem-obj .o-cell.new{background:rgba(94,234,212,.2);border-color:var(--brand);animation:pop .45s ease}
.mem-obj .o-cell.chg{background:rgba(251,191,36,.22);border-color:var(--amber);animation:pop .45s ease}
.mem-obj .o-cell.rm{opacity:.2;text-decoration:line-through}
.mem-link{
  font-family:var(--mono);font-size:12px;color:var(--amber);
  padding-left:8px;letter-spacing:1px
}

/* 流程圖 */
.flow{display:flex;flex-direction:column;align-items:center;gap:0;margin:8px 0}
.flow-row{display:flex;flex-direction:column;align-items:center;width:100%}
.fbox{
  padding:11px 20px;border-radius:11px;border:1.5px solid var(--line);
  background:var(--panel-2);font-size:14px;text-align:center;transition:.25s;
  max-width:560px;font-family:var(--mono)
}
.fbox.hl{border-color:var(--brand);background:#ffeed5;box-shadow:0 0 0 4px rgba(224,138,46,.16);color:#2a1f15}
.fbox.hit{border-color:#3f9d63;background:#e6f7ec;box-shadow:0 0 0 4px rgba(63,157,99,.14)}
.fbox.dead{opacity:.34}
.fbox.cond{
  border-radius:99px;border-color:#d99a1f;background:#fff6e0;
  font-family:var(--mono);color:#7a5410
}
.fbox.cond.hl{border-color:#d99a1f;background:#ffedc4;box-shadow:0 0 0 4px rgba(217,154,31,.18)}
.farrow{width:2px;height:22px;background:var(--line);position:relative;transition:.25s}
.farrow.hl{background:var(--brand);box-shadow:0 0 8px rgba(94,234,212,.7)}
.farrow span{
  position:absolute;left:13px;top:0;font-size:11.5px;color:var(--txt-3);
  font-family:var(--mono);white-space:nowrap
}
.f-branch{display:flex;gap:20px;justify-content:center;flex-wrap:wrap;width:100%}
.f-branch>div{display:flex;flex-direction:column;align-items:center;gap:0;flex:1;min-width:150px}

/* 追蹤面板 */
.trace{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px}
@media(max-width:820px){.trace{grid-template-columns:1fr}}
.trace-code{
  background:var(--code-bg);border:1px solid var(--line-soft);border-radius:10px;
  padding:11px 0;overflow-x:auto
}
.tl{
  display:flex;gap:10px;padding:3px 14px;font-family:var(--mono);font-size:13.6px;
  line-height:1.85;white-space:pre;color:#4a3a2c;border-left:3px solid transparent;transition:.18s
}
.tl .tl-n{color:#c9b49a;user-select:none;min-width:1.3em;text-align:right}
.tl.on{background:#ffeed6;border-left-color:var(--brand)}
.tl.on .tl-t{color:#2a1f15;font-weight:600}
.tl.past{opacity:.55}
.tl.hit{background:#fff5dd;border-left-color:#d99a1f}
.tl.out .tl-t{color:#1f7a46}
.trace-side{display:flex;flex-direction:column;gap:12px}
.trace-panel{
  background:var(--panel-2);border:1px solid var(--line-soft);border-radius:10px;padding:11px 14px
}
.trace-panel h5{
  margin:0 0 8px;font-size:11px;letter-spacing:1.3px;text-transform:uppercase;color:var(--txt-3);font-weight:750
}
.vlist{display:flex;flex-wrap:wrap;gap:7px}
.vpill{
  font-family:var(--mono);font-size:12.8px;background:var(--bg-3);border:1px solid var(--line);
  padding:4px 10px;border-radius:8px;color:var(--txt-2);transition:.2s
}
.vpill b{color:#2a1f15;font-weight:650}
.vpill.chg{border-color:#d9a92f;background:#fff4d6}
.vpill.set{border-color:var(--brand);background:#ffeed5}
.console{
  font-family:var(--mono);font-size:13.5px;background:#fffdf6;border:1px solid #e8d9c3;
  border-radius:8px;padding:10px 13px;color:#5a4632;min-height:44px;white-space:pre-wrap;line-height:1.85
}
.console .cursor{display:inline-block;width:7px;height:15px;background:var(--brand);animation:blink 1s steps(2) infinite;vertical-align:-2px}
@keyframes blink{50%{opacity:0}}

/* 真值表探索器 */
.tt-toggles{display:flex;gap:26px;flex-wrap:wrap;margin-bottom:18px}
.tt-var{display:flex;align-items:center;gap:11px}
.tt-sw{
  width:70px;height:36px;border-radius:99px;background:#efdcc6;border:1px solid var(--line);
  position:relative;cursor:pointer;transition:.25s;padding:0
}
.tt-sw::after{
  content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;
  background:#d98a96;transition:.25s
}
.tt-sw[data-val="1"]{background:#d9f0e0;border-color:#4caf6d}
.tt-sw[data-val="1"]::after{transform:translateX(31px);background:#4caf6d}
.tt-sw-label{font-family:var(--mono);font-size:15px;color:#2a1f15;font-weight:650}
.tt-out{display:flex;gap:12px;flex-wrap:wrap}
.tt-card{
  background:var(--panel-2);border:1px solid var(--line-soft);border-radius:11px;
  padding:12px 16px;min-width:150px;transition:.25s
}
.tt-card .tt-expr{font-family:var(--mono);font-size:13px;color:var(--txt-3);display:block;margin-bottom:7px}
.tt-card .tt-val{font-family:var(--mono);font-size:19.5px;font-weight:750;color:#2a1f15}
.tt-card.on{border-color:var(--brand);background:#fff6e8;box-shadow:0 0 0 3px rgba(224,138,46,.14)}
.tt-card.on .tt-val{color:var(--brand)}
.tt-card.off .tt-val{color:var(--rose)}

/* 滑桿 / 控制器 */

.ctl-row label{font-family:var(--mono);font-size:13px;color:var(--txt-2);min-width:76px}
input[type=range]{
  -webkit-appearance:none;appearance:none;flex:1;min-width:130px;height:7px;border-radius:99px;
  background:linear-gradient(90deg,#ffb347,#e8734a);outline:none;cursor:pointer
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:#fff;
  border:3px solid var(--brand);cursor:pointer;box-shadow:0 2px 8px rgba(120,85,40,.28)
}
input[type=range]::-moz-range-thumb{
  width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid var(--brand);cursor:pointer
}

  font-family:var(--mono);font-size:14px;color:var(--brand);min-width:44px;text-align:right;font-weight:700
}

  font-family:var(--mono);font-size:14px;background:#fffaf0;color:#2a1f15;

}

.quiz-opt{
  text-align:left;font-family:inherit;font-size:14.8px;color:var(--txt);cursor:pointer;
  background:#fffaf2;border:1px solid var(--line);border-radius:10px;padding:12px 15px;
  transition:.16s;display:flex;gap:11px;align-items:center
}

.quiz-opt .o-key{
  font-family:var(--mono);font-size:12px;width:24px;height:24px;flex:0 0 24px;

}
.quiz-opt.right{border-color:#4caf6d;background:#e8f7ec;color:#1c5c33}

.quiz-opt.wrong{border-color:#e06b78;background:#fdecef;color:#8c2f3a}

/* 練習題（大題） */
.task{
  border:1px solid var(--line);border-left:4px solid #d99a1f;border-radius:var(--radius-s);
  background:#fffdf5;padding:17px 20px;margin:18px 0
}
.task .t-head{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.task .t-head b{font-size:15.5px;color:#2a1f15}
.task .t-lv{
  font-size:10.5px;letter-spacing:1px;text-transform:uppercase;font-weight:800;
  padding:3px 8px;border-radius:6px;background:#e8b96a;color:#4a3208
}
.task .t-lv.lab{background:#8fbdea;color:#123047}
.task .t-lv.cw{background:#f0a13c;color:#4a2a05}
details.hint{
  margin-top:12px;border:1px dashed #e3c9a3;border-radius:9px;

}
details.hint summary{
  cursor:pointer;padding:9px 14px;font-size:13.4px;color:var(--brand);font-weight:650;
  list-style:none;display:flex;align-items:center;gap:8px

details.hint .h-body{padding:2px 15px 15px}

/* 重點速記 */
.recap{
  background:linear-gradient(150deg,#fff7e8,#fff0e0);
  border:1px solid #f0d5aa;border-radius:var(--radius);padding:21px 23px;margin:28px 0
}
.recap h3{margin:0 0 13px;color:var(--brand-dim);font-size:17.5px;display:flex;align-items:center;gap:9px}

/* 上一課 / 下一課 */
.pager{display:flex;gap:14px;margin-top:56px;flex-wrap:wrap}

  flex:1;min-width:210px;text-align:left;background:#fffdf8;border:1px solid var(--line);

  }

  .burger{

  }

  }

/* ==========================================================================
   動畫解說：動作 / 說明 / 重點 三段式

.anim-explain{
  padding:14px 18px 16px;font-size:15.4px;color:var(--txt);line-height:1.85;
  background:#fffaf0;border-top:1px solid var(--line-soft);min-height:78px
}
.anim-explain .ex-act{
  display:block;font-family:var(--mono);font-size:13.4px;font-weight:700;
  color:#9a4a0d;background:#fff1dd;border:1px solid #f2dcc0;
  padding:6px 11px;border-radius:8px;margin-bottom:9px;
  word-break:break-word;line-height:1.6
}
.anim-explain .ex-desc{display:block;color:#4a3a2c;margin-bottom:8px}

  display:block;background:#fff3df;border-left:4px solid #e79a3c;
  padding:9px 13px;border-radius:0 8px 8px 0;color:#7a4a10;
  font-size:14.8px;line-height:1.75
}

/* 沒有拆出動作時，維持原本的單段落呈現 */
.anim-explain > .step-txt{display:block}


/* ==========================================================================
   平滑過渡
   ========================================================================== */
@keyframes popIn{
  from{ opacity:0; transform:translateY(10px) scale(.96) }
  to  { opacity:1; transform:none }
}
@keyframes expIn{
  from{ opacity:0; transform:translateY(6px) }
  to  { opacity:1; transform:none }
}

/* 動畫舞台：切換步驟時先柔和淡出，再淡入 */
.anim-stage{ transition:opacity .16s ease }
.anim-stage.fading{ opacity:0 }

/* 每一個「有名字的格子」在換步時平滑移動 */
[data-k]{
  transition:transform .42s cubic-bezier(.2,.8,.2,1),
             opacity .3s ease,
             background-color .3s ease,
             border-color .3s ease,
             color .3s ease;
  will-change:transform
}

/* 解說文字：每次換步淡入 */
.anim-explain.exp-in{ animation:expIn .34s cubic-bezier(.2,.8,.2,1) both }

/* 進度數字：換步時輕輕彈一下 */
.step-pill{ transition:background-color .25s ease, color .25s ease }
.anim-foot .step-pill.bump{ animation:popIn .3s ease }

/* 按鈕：滑順的反應 */
.btn{
  transition:background-color .18s ease, color .18s ease, border-color .18s ease,
             transform .14s cubic-bezier(.2,.8,.2,1), box-shadow .2s ease, opacity .2s ease
}
.btn:active:not([disabled]){ transform:translateY(1px) scale(.985) }

/* 字元格 / 記憶體格 / 流程圖：數值變化時平滑過渡 */
.ch, .mem-obj .o-cell, .fbox, .vpill, .tt-card, .tl{
  transition:transform .3s cubic-bezier(.2,.8,.2,1),
             background-color .32s ease, border-color .32s ease,
             color .28s ease, opacity .32s ease, box-shadow .3s ease
}

/* 連線（流程圖箭頭）也跟著變化 */
.farrow{ transition:background-color .32s ease, box-shadow .32s ease, opacity .3s ease }

/* 尊重系統的「減少動態效果」設定 */
@media (prefers-reduced-motion: reduce){
  .anim-stage, [data-k], .btn, .ch, .mem-obj .o-cell, .fbox, .vpill, .tt-card, .tl{
    transition:none !important; animation:none !important
  }
  .anim-stage.fading{ opacity:1 }
}

<script>
/* ==========================================================================
   0. 小工具
   ========================================================================== */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const range = n => Array.from({ length: n }, (_, i) => i);

/* 把 Python 原始碼上色（極簡版，只求好看好讀） */
const PY_KW = ["import","from","as","if","elif","else","for","while","in","not","and","or",
  "return","def","class","True","False","None","break","continue","pass","with","try","except","lambda","global","is","del","assert","raise","yield"];
function hlCode(line){
  const src = String(line);
  const KW = new Set(PY_KW);
  const BI = new Set(["print","input","len","int","str","float","range","random",
    "choice","ord","chr","max","min","sum","sorted","list","tuple","abs","round",
    "type","append","extend","insert","remove","pop","sort","reverse","index",
    "find","rfind","upper","lower","title","strip","lstrip","rstrip","split",
    "join","count","replace","center","ljust","rjust","expandtabs","isdigit"]);
  const span = (c, t) => '<span class="' + c + '">' + t + '</span>';
  let out = '', i = 0;
  const n = src.length;
  let prev = '';
  while (i < n){
    const c = src[i];
    /* 註解：一路吃到底 */
    if (c === '#'){ out += span('tok-com', esc(src.slice(i))); break; }
    /* 字串 */
    if (c === '"' || c === "'"){
      let j = i + 1;
      while (j < n && src[j] !== c){
        if (src[j] === '\\') j++;
        j++;
      }
      const end = Math.min(j + 1, n);
      out += span('tok-str', esc(src.slice(i, end)));
      i = end; prev = 'lit'; continue;
    }
    /* 識別字 / 關鍵字 / 內建函式 */
    if (/[A-Za-z_]/.test(c)){
      let j = i;
      while (j < n && /[A-Za-z0-9_]/.test(src[j])) j++;
      const word = src.slice(i, j);
      let k = j;
      while (k < n && src[k] === ' ') k++;
      const isCall = src[k] === '(' || src[k] === '.';
      if (KW.has(word))                    out += span('tok-kw', word);
      else if (BI.has(word) && isCall)     out += span('tok-fn', word);
      else                                 out += esc(word);
      i = j; prev = 'w'; continue;
    }
    /* 數字（前面不能緊接字母，避免 1st、2nd 被上色） */
    if (/[0-9]/.test(c) && !/[A-Za-z0-9_]/.test(prev)){
      let j = i;
      while (j < n && /[0-9._]/.test(src[j])) j++;
      out += span('tok-num', esc(src.slice(i, j)));
      i = j; prev = 'n'; continue;
    }
    out += esc(c);
    prev = c;
    i++;
  }
  return out;
}

/* 產生程式碼區塊。code 可以是字串或字串陣列 */
function codeBlock(code, label){
  const lines = Array.isArray(code) ? code : String(code).split("\n");
  const body = lines.map((l, i) =>
    `<span class="ln">${i + 1}</span>${hlCode(l) || " "}`).join("\n");
  return `<div class="code">
    <div class="code-top"><span class="dots"><i></i><i></i><i></i></span><span>${esc(label || "python")}</span></div>
    <pre>${body}</pre></div>`;
}
/* 輸出區塊 */
function outBlock(txt, label){
  return `<div class="out"><span class="out-label">${esc(label || "Output")}</span>${esc(txt)}</div>`;
}
/* 提示框 */
function callout(kind, title, html){
  const icons = { tip:"💡", warn:"⚠️", danger:"🚫", info:"ℹ️", analogy:"🎈" };
  return `<div class="callout ${kind}"><div class="c-title">${icons[kind] || "💬"} ${title}</div>${html}</div>`;
}
/* 表格。rows 第一列為表頭 */
function table(rows, opts = {}){
  const head = rows[0], body = rows.slice(1);
  const cls = opts.cls || {};
  const th = "<tr>" + head.map(h => `<th>${h}</th>`).join("") + "</tr>";
  const tb = body.map((r, ri) => {
    const rc = cls[ri] || "";
    return `<tr class="${rc}">` + r.map(c =>
      `<td>${c === "✔" ? '<span class="yes">✔</span>' : c === "✘" ? '<span class="no">✘</span>' : c}</td>`
    ).join("") + "</tr>";
  }).join("");
  return `<div class="tbl-wrap"><table><thead>${th}</thead><tbody>${tb}</tbody></table></div>`;
}
/* 章節 */
function section(id, idx, title, sub, body){
  return `<section class="sec" id="${id}">
    <h2 class="s-title"><span class="s-idx">${idx}</span>${title}</h2>
    ${sub ? `<p class="s-sub">${sub}</p>` : ""}
    ${body}
  </section>`;
}
/* 自我檢測題（單選） */
function quizHTML(id, prompt, opts, answer, feedback){
  return `<div class="quiz" data-answer="${answer}" id="${id}">
    <div class="q-tag">✅ 自我檢測</div>
    <p class="q-prompt">${prompt}</p>
    <div class="quiz-opts">
      ${opts.map((o, i) => `<button class="quiz-opt"><span class="o-key">${"ABCD"[i]}</span><span>${o}</span></button>`).join("")}
    </div>
    <div class="quiz-fb"><b>解析：</b>${feedback}</div>
  </div>`;
}

/* 練習大題 */
function task(level, title, body, hint){
  const lv = { lab:"Lab", cw:"Classwork", ex:"例題" }[level] || level;
  return `<div class="task">
    <div class="t-head"><span class="t-lv ${level}">${lv}</span><b>${title}</b></div>
    ${body}
    ${hint ? `<details class="hint"><summary>看提示 / 解答思路（建議先自己寫過再看）</summary><div class="h-body">${hint}</div></details>` : ""}
  </div>`;
}

/* ==========================================================================
   1. 動畫核心：每個動畫 = 一串「步驟」，可用播放 / 上下步 / 重設控制
   ========================================================================== */
/* ==========================================================================
   解釋美化器：把每一步拆成「① 這一步在做什麼 → ② 白話說明 → ③ 重點」
   一次只講一件事，句子短、看得懂。
   ========================================================================== */
const SIMPLIFY = [
  [/課本(的)?定義[：:]?/g, ""],
  [/\(condition\)/g, ""], [/\(equal to\)/g, ""], [/\(not equal to\)/g, ""],
  [/\([a-zA-Z ]{3,20}\)/g, ""],
  [/顧名思義[，,]?/g, ""],
  [/換句話說[，,]?/g, "也就是說，"],
];

function prettyExplain(raw){
  if (!raw) return "";
  let s = String(raw).trim();
  SIMPLIFY.forEach(function(p){ s = s.replace(p[0], p[1]); });

  /* 重點：① 有 💡 標記 ② 句尾的粗體且該句完整 */
  let key = "";
  const km = s.match(/💡\s*([\s\S]*)$/);
  if (km){ key = km[1].trim(); s = s.slice(0, km.index).trim(); }
  if (!key){
    /* 句尾粗體最優先 */
    const sm = s.match(/[^。]*？?<(?:strong|b)>([^<]{4,60})<\/(?:strong|b)>\s*。\s*$/);
    if (sm && sm[0].trim() !== s.trim()){
      key = sm[1].trim();
      s = s.slice(0, s.length - sm[0].length).trim();
    }
  }
  if (!key){
    /* 其次：句中唯一的一段 <strong>（要像句子，不能只是程式碼） */
    const all = [...s.matchAll(/<strong>([^<]{5,40})<\/strong>/g)];
    if (all.length === 1){
      const inner = all[0][1].trim();
      const rest = s.replace(all[0][0], "").trim();
      const plain = inner.replace(/<[^>]+>/g, "");
      const looksLikeCode = /^["'\[\(\{]/.test(plain) || /^[A-Za-z_][A-Za-z0-9_]*$/.test(plain);
      const hasPunct = /[，、。：；！？]/.test(plain);
      if (!looksLikeCode && (hasPunct || plain.length >= 8) && rest.length > 12){
        key = inner;
        s = rest.replace(/[，、；]\s*$/, "").trim();
      }
    }
  }
  s = s.replace(/[，、]\s*$/, "").trim();

  /* 動作 vs 說明 */
  let action = "", desc = s;
  const ci = s.indexOf("：");
  if (ci > 0 && ci <= 70){
    action = s.slice(0, ci).replace(/[。，、]\s*$/, "").trim();
    desc   = s.slice(ci + 1).trim();
  }

  /* 說明切成短句；保護「1.」「2.」這種編號 */
  const guarded = desc.replace(/(\d)\.(?=\s|$)/g, "$1\\.<K>");
  let sentences = guarded.split(/。(?![^<]*>)/)
    .map(function(x){ return x.replace(/<K>/g, ".").trim(); })
    .filter(Boolean);
  sentences = sentences.reduce(function(acc, cur){
    const plain = cur.replace(/<[^>]+>/g, "");
    if (acc.length && plain.length < 5) acc[acc.length - 1] += "。" + cur;
    else acc.push(cur);
    return acc;
  }, []);

  let html = "";
  if (action) html += '<span class="ex-act">' + action + "</span>";
  if (sentences.length)
    html += '<span class="ex-desc">' + sentences.map(function(x){ return x + "。"; }).join("<br>") + "</span>";
  if (key){
    const kp = key.replace(/<[^>]+>/g, "").trim();
    const dp = sentences.join("").replace(/<[^>]+>/g, "");
    const overlap = kp.length && dp.includes(kp);
    if (!overlap && kp.length >= 4) html += '<span class="ex-key">💡 ' + key + "</span>";
  }
  return html || s;
}

/* 全域動畫速度倍率：數字越大越慢 */
const ANIM_SPEED = 2.2;

class Anim {
  constructor(root, opts = {}){
    this.root = root;
    this.name = opts.name || "動畫";
    this.steps = opts.steps || [];
    this.explain = opts.explain || (s => prettyExplain(s.t));
    this.i = -1;
    this.timer = null;
    this.playing = false;
    this.interval = Math.round((opts.interval || 1250) * ANIM_SPEED);
    this.build();
  }
  build(){
    this.root.innerHTML = `
      <div class="anim-head">
        <div class="a-name"><span class="badge">動畫</span><span>${esc(this.name)}</span></div>
      </div>
      <div class="anim-stage"></div>
      <div class="anim-explain"><span class="step-txt">按「下一步 ▶」一格一格看，或按「自動播放」讓它慢慢跑。</span></div>
      <div class="anim-foot">
        <button class="btn primary" data-a="next">下一步 ▶</button>
        <button class="btn" data-a="prev">◀ 上一步</button>
        <button class="btn" data-a="reset" title="回到第一步之前">↺ 重設</button>
        <button class="btn ghost" data-a="play" title="自動慢慢播放">▶ 自動播放</button>
        <span class="step-pill">0 / ${this.steps.length}</span>
      </div>`;
    this.stage   = $(".anim-stage", this.root);
    this.expBox  = $(".anim-explain .step-txt", this.root);
    this.pill    = $(".step-pill", this.root);
    this.playBtn = $('[data-a="play"]', this.root);
    this.root.addEventListener("click", e => {
      const b = e.target.closest("[data-a]");
      if (!b) return;
      const a = b.dataset.a;
      if (a === "play") this.toggle();
      if (a === "next") this.next(true);
      if (a === "prev") this.prev();
      if (a === "reset") this.reset();
    });
    this.render();
  }
  toggle(){ this.playing ? this.pause() : this.play(); }
  play(){
    if (this.i >= this.steps.length - 1) this.reset();
    const gap = Math.max(this.interval, 2200);
    this.playing = true;
    this.playBtn.innerHTML = "❚❚ 暫停";
    this.playBtn.classList.remove("primary");
    const tick = () => {
      if (!this.playing) return;
      this.next(false);
      if (this.i >= this.steps.length - 1){ this.pause(); return; }
      this.timer = setTimeout(tick, gap);
    };
    tick();
  }
  pause(){
    this.playing = false;
    clearTimeout(this.timer);
    if (this.playBtn){
      this.playBtn.innerHTML = "▶ 播放";
      this.playBtn.classList.add("primary");
    }
  }
  next(fromUser){
    if (this.i >= this.steps.length - 1){ if (fromUser) this.reset(); return; }
    this.i++;
    this.pause_if_user(fromUser);
    this.render();
  }
  pause_if_user(f){ if (f) this.pause(); }
  prev(){ if (this.i > -1){ this.i--; this.pause(); this.render(); } }
  reset(){ this.i = -1; this.pause(); this.render(); }
  goto(n){ this.i = Math.max(-1, Math.min(n, this.steps.length - 1)); this.pause(); this.render(); }
  /* ---- 平滑過渡：記錄目前 DOM 的位置，換完內容後讓有對應的節點滑到新位置 ---- */
  snapshot(){
    const map = new Map();
    if (!this.stage) return map;
    this.stage.querySelectorAll("[data-k]").forEach(n => {
      const r = n.getBoundingClientRect();
      if (r.width || r.height) map.set(n.dataset.k, { x: r.left, y: r.top, w: r.width, h: r.height });
    });
    return map;
  }

  /* 換內容前先淡出，換完再淡入 + 交錯浮現 + FLIP 位移 */
  commit(html, skipAnim){
    const stage = this.stage;
    if (skipAnim || !stage){
      stage.innerHTML = html;
      return;
    }
    stage.classList.add("fading");
    clearTimeout(this._swapTimer);
    this._swapTimer = setTimeout(() => {
      keyify(stage);
      const before = new Map(this.snapshot());
      stage.innerHTML = html;
      this.animateIn(before);
      requestAnimationFrame(() => stage.classList.remove("fading"));
    }, 130);
  }

  animateIn(before){
    const stage = this.stage;
    if (!stage) return;
    const nodes = Array.from(stage.querySelectorAll("[data-k]"));
    const seen = new Map();
    nodes.forEach(n => {
      const k = n.dataset.k;
      if (seen.has(k)) return;
      seen.set(k, n);
      const now = n.getBoundingClientRect();
      const old = before.get(k);
      if (old){
        /* 同一格東西還在 → 從舊位置平滑滑到新位置 */
        const dx = old.x - now.left, dy = old.y - now.top;
        if (Math.abs(dx) > 1 || Math.abs(dy) > 1){
          n.style.transition = "none";
          n.style.transform = `translate(${dx}px, ${dy}px)`;
          void n.offsetWidth;
          n.style.transition = "transform .42s cubic-bezier(.2,.8,.2,1)";
          n.style.transform = "";
          setTimeout(() => { n.style.transition = ""; n.style.transform = ""; }, 460);
        }
      } else {
        /* 新出現的 → 交錯浮現 */
        n.style.animation = "popIn .42s cubic-bezier(.2,.8,.2,1) both";
      }
    });
    /* 交錯：依 DOM 順序給一點延遲，看起來像「一格一格長出來」 */
    const fresh = nodes.filter(n => n.style.animation);
    fresh.forEach((n, i) => { n.style.animationDelay = Math.min(i * 45, 420) + "ms"; });
    setTimeout(() => {
      nodes.forEach(n => { n.style.animation = ""; n.style.animationDelay = ""; });
    }, 1000);
  }

  render(){
    const st = this.i >= 0 ? this.steps[this.i] : null;
    const html = st ? st.html : (this.initial ? this.initial() : "");
    /* 首次顯示不必淡出 */
    if (this._first === undefined) this._first = true;
    this.commit(html, this._first);
    this._first = false;
    if (st && st.after) st.after(this.stage);
    this.expBox.innerHTML = st ? this.explain(st) : (this.initialText || "按「▶ 播放」或「下一步」開始。");
    this.expBox.classList.remove("exp-in");
    void this.expBox.offsetWidth;
    this.expBox.classList.add("exp-in");
    this.pill.textContent = (this.i + 1) + " / " + this.steps.length;
    $$("[data-a]", this.root).forEach(b => {
      const a = b.dataset.a;
      b.disabled = (a === "prev" || a === "reset") ? this.i < 0
                 : (a === "next") ? this.i >= this.steps.length - 1 : false;
    });
  }

}


/* ==========================================================================
   自動為動畫裡的元素加上 data-k（FLIP 平滑過渡用）
   同一個「東西」在下一步若還在，就會平滑滑到新位置，而不是瞬間跳過去。
   ========================================================================== */
function keyify(root){
  if (!root || !root.querySelectorAll) return;
  const seen = new Map();

  /* 方便的簽章：標籤 + 主要 class + 內容 */
  const sig = el => (el.tagName || "") + "|" +
                    (el.className || "").toString().replace(/\\s+/g, ".") + "|" +
                    (el.textContent || "").trim().slice(0, 40);

  /* 1) 記憶體圖的變數與儲存格：用裡面的文字當身分 */
  root.querySelectorAll(".mem-var").forEach(v => {
    const nm = (v.querySelector(".v-name") || {}).textContent || "";
    if (nm) v.dataset.k = "mv:" + nm.trim();
  });
  root.querySelectorAll(".o-cell").forEach(c => {
    const t = (c.textContent || "").trim();
    const obj = c.closest(".mem-obj");
    const oi = obj && obj.parentElement ? Array.prototype.indexOf.call(obj.parentElement.children, obj) : 0;
    /* 同一格東西在不同步驟可能換位置 → 用「文字 + 出現順序」當身分 */
    const base = "oc:" + t;
    const n = (seen.get(base) || 0) + 1;
    seen.set(base, n);
    c.dataset.k = base + "#" + n + "@" + oi;
  });

  /* 2) 字元格：用索引當身分（位置固定，數值才不會亂跑） */
  root.querySelectorAll(".chars").forEach((row, ri) => {
    row.querySelectorAll(".ch").forEach((ch, ci) => {
      ch.dataset.k = "ch:" + ri + ":" + ci;
    });
  });

  /* 3) 流程圖方塊：用文字當身分 */
  root.querySelectorAll(".fbox").forEach(b => {
    const t = (b.textContent || "").trim().slice(0, 40);
    const base = "fb:" + t;
    const n = (seen.get(base) || 0) + 1;
    seen.set(base, n);
    b.dataset.k = base + "#" + n;
  });

  /* 4) 資料列（vpill / 輸出列 / 真值卡）：用文字當身分 */
  root.querySelectorAll(".vpill, .tt-card, .tl").forEach(el => {
    if (!el.dataset.k){
      const t = (el.textContent || "").trim().slice(0, 40);
      el.dataset.k = "el:" + t;
    }
  });

  /* 5) 追蹤面板的變數標籤 */
  root.querySelectorAll(".trace-panel").forEach((p, i) => {
    p.dataset.k = "tp:" + i;
  });

  /* 6) 其餘區塊（表格、提示框、終端機）用結構位置當身分 */
  root.querySelectorAll(".tbl-wrap, .callout, .console, .out, .code").forEach((el, i) => {
    if (!el.dataset.k) el.dataset.k = "blk:" + el.className + ":" + i;
  });
}

/* 建立動畫容器。id 必須唯一 */
function animBox(id, name){ return `<div class="anim" id="${id}" data-anim="${id}" data-name="${esc(name)}"></div>`; }

/* 讓所有 [data-anim] 容器依 window.ANIMS[id] 的定義初始化 */
function initAnims(scope){
  $$("[data-anim]", scope).forEach(el => {
    if (el.dataset.ready === "1") return;
    const def = window.ANIMS && window.ANIMS[el.dataset.anim];
    if (!def) return;
    const a = new Anim(el, Object.assign({ name: el.dataset.name }, def));
    el.__anim = a;
    el.dataset.ready = "1";
    (window.__ANIM_INSTANCES = window.__ANIM_INSTANCES || []).push(a);
  });
}
function pauseAllAnims(){ (window.__ANIM_INSTANCES || []).forEach(a => a.pause()); }

/* 產生 chars html：高亮 map 例如 {2:"hl-brand",3:"hl-amber"}，dim 為需變淡的下標集合 */
function charsHTML(s, hl = {}, opt = {}){
  const L = s.length;
  return `<div class="chars ${opt.center ? "center" : ""}">` + [...s].map((c, i) => {
    const cls = [hl[i] || "", (opt.dim || []).includes(i) ? "dim" : ""].join(" ");
    const show = c === " " ? "␣" : c === "\n" ? "⏎" : c;
    return `<div class="ch ${cls}">
      ${opt.neg ? `<span class="c-neg">${i - L}</span>` : ""}
      <span class="c-val">${esc(show)}</span>
      <span class="c-idx">${i}</span></div>`;
  }).join("") + "</div>";
}

    'print(word[-1])    # 最後 1 個字元',
  ], "index.py")}
  ${outBlock("P\nh\nn", "Output")}

  ${C("danger", "⚠️ 很重要：索引從 0 開始，不是 1", `<p>人類說「第 1 個」，Python 說 <code>[0]</code>。所以：</p>
  <p><code>"Python"[0]</code> → <code>P</code>（第 1 個）<br>
  <code>"Python"[1]</code> → <code>y</code>（第 2 個）<br>
  <code>"Python"[5]</code> → <code>n</code>（第 6 個，也就是最後一個）</p>
  <p><strong>口訣：Python 的編號 = 人類的「第幾個」減 1。</strong>原因很單純：從 0 開始數，長度 6 的字串就剛好用到 0～5，不會多出一個。</p>`)}

  ${A("a3_index", "字串索引：從 0 開始數")}
  ${A("a3_neg", "負索引：從後面倒數回來")}

  <h3>為什麼負索引是從 −1 開始，不是 −0？</h3>
  <p>因為 <code>-0</code> 和 <code>0</code> 是同一個數字，如果最後一個字元也叫 <code>0</code>，那就和第一個字元撞名了。所以倒數的編號是 <code>-1, -2, -3, ...</code>。</p>
  <p>換算公式很簡單：</p>
  ${codeBlock(['負索引 = 正索引 - 字串長度', '例如 "Hello World" 裡 e 的正索引是 1，長度是 11', '1 - 11 = -10  →  word[-10] 就是 e'], "formula.txt")}
  ${table([
    ["寫法", "等於", "拿到"],
    ["<code>s[0]</code>", "<code>s[len(s)-6]</code>", "第 1 個字元"],
    ["<code>s[len(s)-1]</code>", "<code>s[-1]</code>", "最後 1 個字元"],
    ["<code>s[len(s)-2]</code>", "<code>s[-2]</code>", "倒數第 2 個字元"],
  ])}

  ${C("tip", "實用技巧", `<p>「取最後一個字元」用 <code>s[-1]</code> 就好，不用先算長度。<code>s[-1]</code> 是所有 Python 工程師每天都在用的寫法。</p>`)}

  <h3>超出範圍會怎樣？（out of bounds）</h3>
  <p>Python <strong>不允許</strong>索引超出範圍，會直接報錯並中止程式：</p>
  ${codeBlock([
    'word = "Python"',
    'print(word[6])',
    '# IndexError: string index out of range',
    'print(word[-7])',
    '# IndexError: string index out of range',
  ], "oob.py")}
  ${C("info", "但切片可以超範圍", `<p>只有單一字元的索引不行超範圍。<strong>切片</strong>（下一節）超出範圍是<strong>合法的</strong>，Python 會自動幫你截到邊界為止。</p>`)}

  ${quizHTML("q3_idx", '<code>s = "CityU"</code>，請問 <code>s[-2]</code> 是什麼？', [
      "<code>t</code>", "<code>y</code>", "<code>U</code>", "報錯",
    ], 1, "字串 <code>\"CityU\"</code> 的索引是：<code>C=0, i=1, t=2, y=3, U=4</code>（長度 5）。<code>-1</code> 是 <code>U</code>，<code>-2</code> 是 <code>y</code>。")}
`),

/* ---------------------------------------------------------------- 3 */
S("l3-s3", "3", "切片 slicing：一次拿一段", "用 <code>[m:n]</code> 拿一小段字串，這是處理文字最常用的動作。",
  `<p>如果只要一個字元，用 <code>s[i]</code>。如果要<strong>一整段</strong>，就用<strong>切片</strong>：<code>s[m:n]</code>。</p>

  ${codeBlock([
    's = "spam & eggs"',
    'print(s[2:7])',
  ], "slice.py")}
  ${outBlock("am & ", "Output")}

  ${C("danger", "核心規則：含前面，不含後面", `<p><code>s[m:n]</code> 的意思是：<strong>從編號 m 開始，拿到編號 n-1 為止</strong>。</p>
  <p><code>n</code> 本身<strong>不包含</strong>。所以 <code>"spam &amp; eggs"[2:7]</code> 拿到索引 2、3、4、5、6 共 5 個字元。</p>
  <p>為什麼要這樣設計？因為這樣「長度」就很好算：<code>n - m</code>。<code>[2:7]</code> 的長度就是 <code>7-2 = 5</code>，不用加一。相鄰的兩段也可以放心相接：<code>s[0:2] + s[2:7]</code> 不會重複也不會漏。</p>`)}

  ${A("a3_slice", "切片：含前面、不含後面")}

  <h3>動手玩玩看：拖拉 m / n / s 三個數字</h3>
  <p>下面的滑桿對應 <code>s[m:n:s]</code>。<strong>刻意去製造「奇怪的」組合</strong>（例如 m 比 n 大、m 是負數、s 是負數），看看 Python 怎麼反應——這比背規則有效得多。</p>

  <div class="anim">
    <div class="anim-head"><div class="a-name"><span class="badge">互動</span><span>切片實驗室 s[m:n:s]</span></div></div>
    <div class="anim-stage" data-slicer="Hello World">
      <div class="sl-chars"></div>
      <div class="ctl-row"><label>m 開始</label><input type="range" data-k="m" min="-11" max="11" value="0"><span class="ctl-val sl-m"></span></div>
      <div class="ctl-row"><label>n 結束</label><input type="range" data-k="n" min="-11" max="11" value="11"><span class="ctl-val sl-n"></span></div>
      <div class="ctl-row"><label>s 間隔</label><input type="range" data-k="s" min="-3" max="3" value="1"><span class="ctl-val sl-s"></span></div>
      <div class="out" style="margin-bottom:0"><span class="out-label">切片結果</span><span class="sl-res"></span></div>
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px">
        <button class="btn" data-a="sl-reset">↺ 回到預設 0:11:1</button>
        <span class="step-pill sl-idx"></span>
      </div>
    </div>
    <div class="anim-explain"><span class="step-txt">把 m 拖到 6 試試看；再把 s 拖到 2 或 −1，觀察結果的變化。</span></div>
  </div>

  <h3>省略不寫 = 用預設值</h3>
  ${table([
    ["寫法", "意思", "<code>s = \"Hello World\"</code> 的結果"],
    ["<code>s[:5]</code>", "省略 m，等於 m=0", "<code>Hello</code>"],
    ["<code>s[6:]</code>", "省略 n，等於 n=字串長度", "<code>World</code>"],
    ["<code>s[:]</code>", "兩邊都省略 → 整份複製", "<code>Hello World</code>"],
    ["<code>s[-5:]</code>", "從倒數第 5 個拿到最後", "<code>World</code>"],
    ["<code>s[:-6]</code>", "從頭拿到倒數第 6 個之前", "<code>Hello</code>"],
  ])}

  <h3>進階：間隔 s（step）</h3>
  <p><code>s[m:n:s]</code> 多了一個 <code>s</code>，意思是<strong>每隔幾個字元拿一個</strong>：</p>
  ${codeBlock([
    's = "Hello World"',
    'print(s[0:11:2])    # 每 2 個拿 1 個 → 正數：往右走',
    'print(s[::-1])      # 負數：往左走 → 整個字串反過來！',
  ], "step.py")}
  ${outBlock("HloWrd\ndlroW olleH", "Output")}
  ${C("tip", "超實用招式：<code>s[::-1]</code>", `<p>把字串反轉，一行搞定。<code>s[::-1]</code> 是 Python 的面試必考題，也是最好用的「迴文判斷」工具。</p>`)}

  ${C("info", "切片不會出錯", `<p>索引超範圍會 <code>IndexError</code>，但切片<strong>永遠不會</strong>：</p>
  ${codeBlock(['s = "abc"', 'print(s[1:100])   # 印出 "bc"，不會報錯', 'print(s[5:9])     # 印出 ""（空字串），不會報錯'], "safe_slice.py")}`)}

  ${quizHTML("q3_slice", '<code>s = "Hong Kong"</code>，請問 <code>s[5:7]</code> 是什麼？', [
      "<code>Ko</code>", "<code>Kon</code>", "<code>ong</code>", "<code> K</code>",
    ], 0, "索引 5 是 <code>K</code>、索引 6 是 <code>o</code>，索引 7 是 <code>n</code>。<code>[5:7]</code> 含頭不含尾，所以是索引 5、6 → <code>Ko</code>。")}
`),

/* ---------------------------------------------------------------- 4 */
S("l3-s4", "4", "找字：find 與 rfind", "在整串文字裡找出「某段字」出現在第幾個位置。",
  `<p>如果 <code>subStr</code> 是一段字串，那麼 <code>str1.find(subStr)</code> 會回傳 <code>subStr</code> 在 <code>str1</code> 中<strong>從左邊開始找、第一次出現</strong>的位置索引。</p>
  <p><code>str1.rfind(subStr)</code> 則是<strong>從右邊開始找、第一次出現</strong>的位置（r = right / reverse）。</p>

  ${codeBlock([
    's = "the cat in the hat"',
    'print(s.find("the"))     # 從左邊找 "the"',
    'print(s.rfind("the"))    # 從右邊找 "the"',
    'print(s.find("dog"))     # 找不到的時候...',
  ], "find.py")}
  ${outBlock("0\n11\n-1", "Output")}

  ${C("warn", "找不到不是報錯，是回傳 −1", `<p>這是新手最容易誤判的地方：<code>find()</code> 找不到東西時回傳 <code>-1</code>，<strong>不會</strong>讓程式停掉。</p>
  <p>所以判斷「有沒有找到」要用 <code>if s.find(x) != -1:</code>，或者更漂亮的寫法 <code>if x in s:</code>。</p>`)}

  ${A("a3_find", "find 與 rfind：搜尋方向不同")}

  <h3>一看就懂的 ASCII 小知識</h3>
  <p>要比較字元大小、或想把字母換成數字，就要知道 <strong>ASCII 碼</strong>。常見的幾個一定要記：</p>
  ${table([
    ["字元", "<code>'A'</code>", "<code>'Z'</code>", "<code>'a'</code>", "<code>'z'</code>", "<code>'0'</code>", "<code>'9'</code>", "<code>' '</code>(空格)"],
    ["ASCII 值", "65", "90", "97", "122", "48", "57", "32"],
  ])}
  ${C("danger", "注意：大寫字母的號碼比小寫<strong>小</strong>", `<p><code>'A'</code> 是 65，<code>'a'</code> 是 97。所以在 Python 裡 <code>"Z" &lt; "a"</code> 是 <code>True</code>！排序的時候大小寫混在一起會出現「大寫全部排在前面」的現象，不是 bug。</p>`)}

  ${codeBlock([
    'print(ord("A"))     # 字元 → ASCII 號碼',
    'print(chr(97))      # ASCII 號碼 → 字元',
    'print(chr(ord("A") + 1))',
  ], "ord_chr.py")}
  ${outBlock("65\na\nB", "Output")}
  ${C("tip", "記法", `<p><code>ord()</code> 是「order（順序）」的縮寫，<code>chr()</code> 是「character（字元）」。<strong>ord 字元變號碼，chr 號碼變字元。</strong></p>`)}

  ${A("a3_ascii", "ord / chr：字母與號碼互換")}
`),

/* ---------------------------------------------------------------- 5 */
S("l3-s5", "5", "字串方法：改變大小寫、修剪空白", "方法（method）就是「綁在資料身上的功能」，寫法是 <code>資料.方法()</code>。",
  `<p>到目前為止我們用的 <code>find()</code>、<code>upper()</code> 都是<strong>方法</strong>。方法跟函式差在哪？</p>
  ${table([
    ["", "函式 function", "方法 method"],
    ["長相", "<code>print(x)</code>、<code>len(s)</code>", '<code>s.upper()</code>、<code>s.find("a")</code>'],
    ["誰在做", "資料是「被送進去」的參數", "資料自己「帶著」這個能力"],
    ["會不會改到自己", "只是拿資料來計算", "可能改動資料本身的狀態"],
  ])}
  ${C("info", "課本原話", `<p>「method 可以改動物件的狀態，而 Python function 通常只是對它做運算。」現階段你只要會<strong>用</strong>就夠了。</p>`)}

  <h3>大小寫轉換</h3>
  ${codeBlock([
    's = "Hello World"',
    'print(s.upper())        # 全部變大寫',
    'print(s.lower())        # 全部變小寫',
    'print(s.title())        # 每個單字首字母大寫',
    'print(s.capitalize())   # 只有第一個字母大寫',
    'print(s.swapcase())     # 大小寫互換',
    'print(s)                # 原來的 s 有沒有變？沒有！',
  ], "case.py")}
  ${outBlock("HELLO WORLD\nhello world\nHello World\nHello world\nhELLO wORLD\nHello World", "Output")}
  ${C("danger", "重點：字串<strong>不能</strong>被改動（immutable）", `<p><code>s.upper()</code> 不會把 <code>s</code> 變成大寫，它是<strong>另外做一個新字串回傳給你</strong>。</p>
  <p>所以 <code>s.upper()</code> 單獨寫一行是沒有用的（結果馬上被丟掉），要寫 <code>s = s.upper()</code> 才會真的改到 <code>s</code>。</p>`)}

  ${A("a3_case", "upper / lower：產生新字串，不是改原本的")}

  <h3>修剪空白：strip 家族</h3>
  <p>使用者輸入的時候，很容易多打空白（尤其是複製貼上）。<code>strip()</code> 可以把頭尾多餘的空白去掉。</p>
  ${codeBlock([
    'raw = "   hello   "',
    'print("[" + raw.strip()  + "]")    # 兩邊都去掉',
    'print("[" + raw.lstrip() + "]")    # 只去左邊 (left)',
    'print("[" + raw.rstrip() + "]")    # 只去右邊 (right)',
    'print("[" + raw + "]")             # 原來的沒變',
  ], "strip.py")}
  ${outBlock('[hello]\n[hello   ]\n[   hello]\n[   hello   ]', "Output（中括號是為了讓你看見空白）")}
  ${C("tip", "輸入驗證的標準做法", `<p><code>name = input("名字： ").strip()</code> —— 直接在 <code>input()</code> 後面接 <code>.strip()</code>，可以省掉很多「為什麼我打了名字它說不對」的問題。</p>`)}

  ${A("a3_strip", "strip / lstrip / rstrip 去掉多餘空白")}

  <h3>鏈式方法（chained methods）</h3>
  <p>因為每個方法都會「回傳一個新字串」，所以可以把方法一個接一個串起來。執行順序是<strong>由左到右</strong>：</p>
  ${codeBlock([
    'raw = "   Hello World   "',
    'print(raw.strip().lower().replace("l", "L"))',
  ], "chain.py")}
  ${outBlock("heLLo WorLd", "Output")}
  ${A("a3_chain", "鏈式方法：由左到右一層一層處理")}

  <h3>排版方法：ljust / rjust / center</h3>
  <p>這三個方法可以讓文字在一個「固定寬度的格子」裡靠左、靠右或置中。<code>w</code> 是格子的總寬度。</p>
  ${codeBlock([
    'print("|" + "Title".ljust(20) + "|")   # 靠左，後面補空白',
    'print("|" + "Title".rjust(20) + "|")   # 靠右，前面補空白',
    'print("|" + "Title".center(20) + "|")  # 置中，兩邊均分',
  ], "justify.py")}
  ${A("a3_just", "ljust / rjust / center：在定寬格子裡對齊")}

  ${quizHTML("q3_case", '執行 <code>s = "abc"; s.upper(); print(s)</code>，螢幕會出現什麼？', [
      "<code>ABC</code>", "<code>abc</code>", "什麼都不印", "報錯",
    ], 1, "第二行的 <code>s.upper()</code> 確實做出了 <code>\"ABC\"</code>，但<strong>沒有人把它接住</strong>，所以馬上被丟掉。<code>s</code> 本身從頭到尾都是 <code>\"abc\"</code>。要改就要寫 <code>s = s.upper()</code>。")}
`),

S("l3-s6", "6", "接起來與重複：+ 和 *", "把字串接長、複製很多份。",
  `<h3>串接（concatenation）：用 +</h3>
  <p>兩個字串可以用 <code>+</code> 接成一個新字串。由字串、<code>+</code>、函式、方法組成的算式叫做 <strong>string expression（字串運算式）</strong>。</p>
  ${codeBlock([
    'first = "Py"',
    'second = "thon"',
    'print(first + second)',
    'print(first + " " + second)',
    'print("Total: " + str(95) + " points")   # 數字要先轉成字串',
  ], "concat.py")}
  ${outBlock("Python\nPy thon\nTotal: 95 points", "Output")}

  ${C("danger", "字串 + 數字 → 直接報錯", `<p><code>"Total: " + 95</code> 會出現 <code>TypeError: can only concatenate str (not "int") to str</code>。</p>
  <p>因為 <code>+</code> 對字串的意思是「接起來」，對數字的意思是「加起來」，Python 不知道你要哪一種，所以拒絕執行。</p>
  <p>解法：<code>"Total: " + str(95)</code>，或者直接用 f-string（第 8 節）—— 後者才是正道。</p>`)}

  <h3>重複（repetition）：用 *</h3>
  <p><code>*</code> 搭配字串時，代表「把這個字串重複接自己幾次」：</p>
  ${codeBlock([
    'print("=" * 30)',
    'print("-" * 10 + " 分隔線 " + "-" * 10)',
    'print("ha" * 3)',
    'print("Hi" * 0)          # 重複 0 次 = 空字串',
    'print()',
  ], "repeat.py")}
  ${outBlock("==============================\n---------- 分隔線 ----------\nhahaha\n\n", "Output")}
  ${C("tip", "實用招", `<p>寫報告或做小工具時，<code>print("=" * 40)</code> 一秒畫出一條分隔線。計算字串長度用 <code>len(s)</code>，不要自己數。</p>`)}

  ${A("a3_concat", "串接 + 與重複 *")}
`),

/* ---------------------------------------------------------------- 7 */
S("l3-s7", "7", "把輸出印漂亮：sep、end、跳脫字元", "<code>print()</code> 其實比你想的聰明。",
  `<h3>print() 的預設行為</h3>
  <p><code>print(value0, value1, ..., valueN)</code> 預設會：</p>
  <ul>
    <li>用<strong>一個空格</strong>當作分隔符號（separator）</li>
    <li>印完之後<strong>自動換行</strong>（newline）</li>
  </ul>
  ${codeBlock([
    'print("apple", "banana", "cherry")',
  ], "print_default.py")}
  ${outBlock("apple banana cherry", "Output")}

  <h3>用 sep 改分隔符號</h3>
  ${codeBlock([
    'print("apple", "banana", "cherry", sep=", ")',
    'print("2025", "10", "06", sep="-")',
    'print("a", "b", "c", sep="")',
  ], "sep.py")}
  ${outBlock("apple, banana, cherry\n2025-10-06\nabc", "Output")}

  <h3>用 end 改結尾動作</h3>
  <p>預設的結尾是「換行」。把 <code>end</code> 改成別的東西，就不會換行：</p>
  ${codeBlock([
    'print("載入中", end="")',
    'print(".", end="")',
    'print(".", end="")',
    'print(". 完成！")',
  ], "end.py")}
  ${outBlock("載入中... 完成！", "Output")}
  ${C("tip", "為什麼有用？", `<p>想在同一行連續印東西（例如進度條、或是把好幾次計算結果排成一行）就要用 <code>end</code>。否則每次 <code>print()</code> 都會跳到下一行。</p>`)}

  ${A("a3_print", "print 的 sep 與 end")}

  <h3>跳脫序列（escape sequences）</h3>
  <p>有些字元沒辦法直接打在引號裡面（例如「換行」）。這些用<strong>反斜線 <code>\\</code> 開頭</strong>的短記號就叫做跳脫序列，每個跳脫序列<strong>算一個字元</strong>。</p>
  ${table([
    ["寫法", "名字", "意思"],
    ["<code>\\n</code>", "newline", "換行（跳到下一行的開頭）"],
    ["<code>\\t</code>", "tab", "水平定位點，預設等於 8 個空白"],
    ["<code>\\'</code>", "單引號", "印出一個單引號 <code>'</code>"],
    ["<code>\\\"</code>", "雙引號", "印出一個雙引號 <code>\"</code>"],
    ["<code>\\\\</code>", "反斜線", "印出一個反斜線 <code>\\</code>"],

  `<p><strong>格式化字串實字（formatted string literal，簡稱 f-string）</strong>是 Python 最好用的輸出工具。規則只有兩條：</p>
  <ol>
    <li>在引號前面加一個 <code>f</code></li>

    'print(f"平均是 {score / 2:.2f}")      # :.2f = 取到小數第 2 位',
    'print(f"姓名: {school:>10}|")         # :>10 = 靠右補到 10 格',
  ], "fstring.py")}
  ${outBlock("我在 CityU 讀 2025 年的課\n分數是 87.5 分\n明年是 2026 年\n平均是 43.75\n姓名:      CityU|", "Output")}

  <p><strong>f-string</strong>（不用管型別、直接讀）：<br>

      <li><b>切片 <code>s[m:n]</code></b>：含 m、<b>不含 n</b>。長度 = <code>n - m</code>。省略 m 就是從頭，省略 n 就是到尾。</li>
      <li><b><code>s[m:n:step]</code></b>：step 正數往右、負數往左。<code>s[::-1]</code> 反轉字串。</li>
      <li><b>索引超範圍會報錯</b>（<code>IndexError</code>），<b>切片超範圍不會</b>。</li>
      <li><b><code>find(x)</code></b> 從左找、<b><code>rfind(x)</code></b> 從右找，回傳<b>索引</b>；找不到回 <b>−1</b>（不是報錯）。</li>
      <li><b>字串不可改（immutable）</b>。<code>s.upper()</code> 產生新字串，要 <code>s = s.upper()</code> 才會改到 s。</li>
      <li><b>方法鏈</b>由左到右執行：<code>raw.strip().lower()</code>。</li>
      <li><b><code>+</code> 串接、<code>*</code> 重複</b>。<code>"ab" * 3</code> → <code>"ababab"</code>。字串加數字要先 <code>str()</code>。</li>
      <li><b><code>print</code> 的 <code>sep</code></b> 改分隔符號、<b><code>end</code></b> 改結尾（預設換行）。</li>

  ${C("info", "小括號可以省略", `<p>因為逗號才是元組的真正標記。所以 <code>a = 1, 2, 3</code> 是元組，不是三個變數。<br>
  要建立<strong>只有一個項目</strong>的元組，必須加逗號：<code>t = (5,)</code>。<code>(5)</code> 只是普通的數字 5。</p>`)}

  <h3>list() 與 tuple()：互相轉換</h3>
  ${codeBlock([

    'print(tuple([2, 23, 6, 9, 8]))   # 串列 → 元組',

  ${C("info", "iterable（可迭代）", `<p>能被拆成一項一項的東西叫做 <strong>iterable</strong>：字串、串列、元組都是。數字不是，所以 <code>list(1984)</code> 會報 <code>TypeError</code>。</p>`)}

  <h3>元組和串列<strong>相同</strong>的地方</h3>
  <ul>
    <li>可以用索引讀取（正索引、負索引都可以）</li>
    <li>可以切片</li>
    <li>可以 <code>+</code> 串接、<code>*</code> 重複</li>
    <li>單一索引超範圍會報錯，<strong>切片超範圍不會</strong></li>
  </ul>
  ${codeBlock([
    'tp = (2, 23, 6, 9, 8)',
    'print(tp[0])       # 正索引',
    'print(tp[-1])      # 負索引',
    'print(tp[2:4])     # 切片 → 得到一個「新的元組」',
    'print(tp[:3])',
    'print(tp[1:])',
  ], "tuple_ops.py")}
  ${outBlock("2\n8\n(6, 9)\n(2, 23, 6)\n(23, 6, 9, 8)", "Output")}

  ${A("a4_tuple", "元組：可以讀、可以切片，就是不能改")}

  <h3>元組和串列<strong>不同</strong>的地方</h3>
  ${table([
    ["", "串列 list", "元組 tuple"],
    ["寫法", "<code>[1, 2, 3]</code>", "<code>(1, 2, 3)</code>"],
    ["改某一項", "✅ <code>lst[0] = 9</code>", "❌ <code>TypeError</code>"],
    ["<code>append</code>／<code>extend</code>／<code>insert</code>", "✅ 有", "❌ 沒有這些方法"],
    ["<code>del</code>／<code>remove</code>／<code>pop</code>／<code>sort</code>", "✅ 有", "❌ 全都沒有"],
    ["能不能當字典的 key", "❌ 不行", "✅ 可以（因為不可變）"],
  ])}

  ${codeBlock([
    'tp = (2, 23, 6, 9, 8)',
    'lst = [2, 23, 6, 9, 8]',
    '',
    'lst[3] = "sdlqwejrt"      # ✅ 串列可以改',
    'print(lst)',
    '',
    'tp[3] = "sdlqwejrt"       # ❌ 元組不行',
    '# TypeError: \'tuple\' object does not support item assignment',
    '',
    'school = "CityU"',
    'school[3] = "Q"           # ❌ 字串也不行！',
    '# TypeError: \'str\' object does not support item assignment',
  ], "tuple_immutable.py")}
  ${outBlock("[2, 23, 6, 'sdlqwejrt', 8]\nTypeError: 'tuple' object does not support item assignment\nTypeError: 'str' object does not support item assignment", "Output")}

  ${C("tip", "那元組有什麼用？", `<p>① <strong>保證資料不被改</strong>（例如座標、身份證號、顏色 RGB）。<br>
  ② <strong>速度比串列快</strong>、佔的記憶體比較少。<br>
  ③ 可以當<strong>字典的鍵</strong>（串列不行）。<br>
  ④ 一次回傳多個值時，Python 內部用的就是元組。</p>`)}

  ${A("a4_immutable", "改串列 vs 改元組 vs 改字串：三種反應")}
`),

  `<p><strong>「可以在原地被改變」的物件叫做 mutable（可變）；否則叫做 immutable（不可變）。</strong></p>
  ${table([
    ["型態", "可變？", "說明"],
    ["<code>int</code>（數字）", "❌ 不可變", "改了就是<b>做一個新的數字</b>"],
    ["<code>float</code>（小數）", "❌ 不可變", "同上"],
    ["<code>str</code>（字串）", "❌ 不可變", "所有方法都回傳新字串"],
    ["<code>tuple</code>（元組）", "❌ 不可變", "連一項都不能改"],
    ["<code>list</code>（串列）", "✅ 可變", "append／remove／sort 都是改自己"],
  ])}

  <h3>關鍵：變數不是「箱子」，是「標籤」</h3>
  <p>初學者常以為 <code>x = 5</code> 是「把 5 放進箱子 x」。更準確的模型是：</p>
  <div class="callout analogy"><div class="c-title">🎈 標籤比喻</div>
  <p><strong>記憶體裡先有一個物件，變數只是貼在它上面的一張標籤。</strong></p>
  <p><code>x = 5</code> 的意思是：做出一個「5」的物件，然後把 <code>x</code> 這張標籤貼上去。<br>
  <code>x = 7</code> 的意思是：做出一個「7」的物件，把 <code>x</code> 這張標籤<strong>撕下來改貼到 7 上面</strong> —— 原本那個「5」還在原地。</p></div>

  ${C("info", "兩種改變方式，結果完全不同", `<p><strong>① 改變串列</strong>：改的是「那個物件本身」，所有貼著這張標籤的變數都會看到變化。</p>
  <p><strong>② 改變數字／字串／元組</strong>：Python 會<strong>另外開一個新物件</strong>，把變數標籤改貼到新的上面。舊物件留在原地。</p>`)}

  ${A("a4_memory", "8 行程式看懂 mutable 與 immutable 的差別")}

  <h3>為什麼「複製串列」會出錯？</h3>
  ${codeBlock([
    "lst1 = ['a', 'b']",
    "lst2 = lst1          # 這不是複製！只是多貼一張標籤",
    "lst2[1] = 'c'        # 改的是同一個物件",
    "print(lst1)          # lst1 也變了！！",
  ], "alias_bug.py")}
  ${outBlock("['a', 'c']", "Output")}
  ${A("a4_alias", "別名陷阱：lst2 = lst1 不是複製")}

  <p>正確的複製方式是用 <code>list()</code>：</p>
  ${codeBlock([
    "lst1 = ['a', 'b']",
    "lst2 = list(lst1)    # ✅ 真的做一份新串列",
    "lst2[1] = 'c'",
    "print(lst1)          # lst1 沒被動到",
    "print(lst2)",
  ], "copy_ok.py")}
  ${outBlock("['a', 'b']\n['a', 'c']", "Output")}
  ${C("tip", "三種複製方法", `<p><code>lst2 = list(lst1)</code>　　<code>lst2 = lst1[:]</code>　　<code>lst2 = lst1.copy()</code><br>
  三個都真的做一份新串列。但注意：這是<strong>淺複製</strong> —— 如果裡面還裝著串列（嵌套），內層的還是共用。</p>`)}

  ${A("a4_copy", "正確複製：list(lst1) 做出兩個獨立的盒子")}

  ${quizHTML("q4_alias", "以下哪些型態是<strong>不可變</strong>的？（選出<strong>不是</strong>不可變的那一個）", [
      "數字 <code>int</code>", "字串 <code>str</code>", "串列 <code>list</code>", "元組 <code>tuple</code>",
    ], 2, '只有<strong>串列是可變的</strong>。數字、字串、元組都不能在原地修改 —— 這也是為什麼 <code>s.upper()</code>、<code>s = s + "x"</code> 都會產生新物件。')}
`),

S("l4-s8", "8", "交換值與嵌套結構", "Python 的優雅招式，以及「串列裡面裝串列」。",
  `<h3>交換兩個變數的值</h3>
  <p>傳統語言要這樣寫（需要一個暫時變數）：</p>
  ${codeBlock([
    'temp = x',
    'x = y',
    'y = temp',
  ], "swap_traditional.py")}
  <p>Python 一行就好：</p>
  ${codeBlock([
    'x = 5',
    'y = 6',
    'print(x, y)',
    '',
    'x, y = y, x        # 交換！',
    'print(x, y)',
  ], "swap.py")}
  ${outBlock("5 6\n6 5", "Output")}
  ${C("tip", "為什麼可以這樣寫？", `<p>因為 <code>=</code> 右邊會<strong>先全部算完</strong>，打包成一個元組 <code>(6, 5)</code>，再依序貼標籤到左邊。<strong>右邊先算完、左邊才指派</strong>，所以不會互相蓋掉。</p>`)}

  <p>這個招式對串列裡的項目也有效：</p>
  ${codeBlock([
    "lst = ['a', 'b', 'c', 'd']",
    "lst[0], lst[-1] = lst[-1], lst[0]",
    "print(lst)",
  ], "swap_items.py")}
  ${outBlock("['d', 'b', 'c', 'a']", "Output")}

  ${A("a4_swap", "值交換：x, y = y, x 的執行順序")}

  <h3>嵌套（nested）結構：串列裡面裝串列</h3>
  <p>串列的項目可以是數字、字串，<strong>也可以是另一個串列或元組</strong>。</p>
  ${codeBlock([
    '# 串列裡面裝元組',
    'lst = [("CityU", 1984), ("HKU", 1911), ("CUHK", 1963), ("HKUST", 1991)]',
    'print(lst[0][1])      # 第 1 個元組的第 2 項',
    '',
    '# 串列裡面裝串列 = 二維陣列',
    'grid = [[1, 2, 3], [4, 5, 6], [8, 7, 9]]',
    'print(grid[1])        # 第 2 列',
    'print(grid[1][2])     # 第 2 列的第 3 項',
  ], "nested.py")}
  ${outBlock("1984\n[4, 5, 6]\n6", "Output")}

  ${C("tip", "讀法：由左到右一層一層剝開", `<p><code>grid[1][2]</code> 讀作：「先拿 <code>grid[1]</code>（得到 <code>[4,5,6]</code>），再拿它的 <code>[2]</code>（得到 <code>6</code>）。」</p>
  <p>可以想成<strong>地址</strong>：<code>lst[1][1][1][0]</code> = 「第 2 棟 → 第 2 層 → 第 2 間 → 第 1 個位置」。</p>`)}

  ${A("a4_nested", "嵌套串列：一層一層找到目標")}
`),

S("l4-s9", "9", "Lab 4 與 Classwork 4 實作", "課堂練習的完整解法。", `

     ${codeBlock([

       'poem = "Cuddly and fluffy \\nAlways cheeky \\nThey make us laugh \\nSuperb at climbing"',
       'print(poem)',

     ${C("warn", "為什麼是 <code>split(' \\n')</code> 而不是 <code>split()</code>？", `<p>因為詩的每一行後面是「<strong>空格 + 換行</strong>」（<code>" \\n"</code>）。用 <code>split()</code>（不給參數）會把所有空白都當成分隔，結果每個<strong>單字</strong>都會被拆開，<code>lst[0][0]</code> 就不再是行首字母了。</p>
     <p>驗證看看：<code>poem.split()</code> 得到 <code>['Cuddly','and','fluffy','Always',...]</code>；<code>poem.split(' \\n')</code> 得到 <code>['Cuddly and fluffy','Always cheeky',...]</code>。後者才是我們要的「一行一項」。</p>`)}

  ${task("lab", "Example C：嵌套串列的修改",

  ${task("cw", "Classwork 4：數句子與字數",

     <p>題目的假設條件：</p>
     <ul>
       <li>句子的結尾只會是<strong>單一個</strong> <code>.</code>、<code>!</code> 或 <code>?</code></li>
       <li>單字之間只用<strong>單一個空格</strong>分隔</li>
       <li>用 <code>-</code> 連起來的字算<strong>一個</strong>單字（例如 <code>interest-earning</code>）</li>

     <p><strong>單字數：</strong>用 <code>split()</code> 切成串列，串列的長度就是單字數。</p>

       '# ---- 數句子 ----',
       '# 把三種句尾符號的出現次數加起來',
       'sentences = paragraph.count(".") + paragraph.count("!") + paragraph.count("?")',
       '',
       '# ---- 數單字 ----',
       '# split() 自動處理「連續空白」與「頭尾空白」',

     ${C("info", "為什麼這樣就對了？", `<p><strong>①</strong> <code>.count(x)</code> 是字串方法，回傳 x 出現了幾次。三個加起來就是句子數。</p>
     <p><strong>②</strong> <code>.split()</code> 不給參數時，會用「任何空白」切，而且自動忽略頭尾與連續的空白。所以 <code>len(paragraph.split())</code> 就是單字數。</p>
     <p><strong>③</strong> <code>"interest-earning"</code> 中間沒有空白，所以 <code>split()</code> 自然把它當成<strong>一個</strong>單字 —— 題目的要求自動滿足了。</p>`)}

     <p><strong>進階挑戰：</strong>改成用 <code></code> 一次數出三種符號，或處理「一個句子結尾是好幾個符號（例如 <code>!!</code>）」的情況。</p>`)}
`),

/* ---------------------------------------------------------------- 5 */
S("l5-s5", "5", "決策結構 if-else：讓程式做選擇", "從這一節開始，你的程式會有「岔路」。",
  `<p>課本定義：<strong>決策結構（也叫分支結構 branching structure）讓程式根據某個條件是真是假，來決定要採取哪個行動。</strong></p>

  <h3>基本形式</h3>
  ${codeBlock([
    'if condition:',
    '    indented block of statements     # 條件為 True 時執行',
    'else:',
    '    indented block of statements     # 條件為 False 時執行',
  ], "if_else_form.py")}

  ${C("danger", "兩個不能忘的小地方（課本特別強調）", `<p><strong>① 冒號不能忘。</strong><code>if condition</code> 後面一定要有 <code>:</code>，<code>else</code> 後面也一樣。</p>
  <p><strong>② 縮排用 Tab 鍵。</strong>按 Enter 之後，編輯器會自動幫你縮排；<strong>不要自己敲空白鍵</strong>去湊（很容易對不齊而報 <code>IndentationError</code>）。</p>`)}

  ${C("analogy", "🎈 縮排 = 有括號的意義", `<p>Python 沒有像 C 語言的 <code>{ }</code>。它用<strong>縮排</strong>來表示「這幾行是屬於上面那個 if 的」。</p>
  <p>所以縮排不是「排版好看」而已，它是<strong>程式語法的一部分</strong>。縮排錯了，程式邏輯就完全變了。</p>`)}

  <h3>Example 1：比較兩個數字</h3>
  ${codeBlock([
    '#Example: comparing two numbers.',
    '',
    'num1 = float(input("Enter the first number: "))',
    'num2 = float(input("Enter the second number: "))',
    '',
    'if num1 > num2:   # 條件為 True 時，執行下一行',
    '    print("The first number is greater than the second number.")',
    'else:             # 條件為 False 時，執行下一行',
    '    print("The first number is less than or equal to the second number.")',
  ], "example1.py")}
  ${outBlock("Enter the first number: 78\nEnter the second number: 53\nThe first number is greater than the second number.\n\nEnter the first number: 98\nEnter the second number: 100\nThe first number is less than or equal to the second number.", "Output")}

  ${C("info", "解讀流程", `<p>① 讀兩個數字 → ② 問「num1 &gt; num2 嗎？」→ ③ 是 True 走 if 那一行，是 False 走 else 那一行。<strong>兩條路只會走一條。</strong></p>`)}

  ${A("a5_if_else", "Example 1：78 與 53 走哪一條路")}

  <h3>if 可以單獨使用（省略 else）</h3>
  <p>課本說：<strong><code>else</code> 部分可以省略。當條件為 False 時，程式會繼續執行 if 區塊後面的那一行。</strong></p>
  ${codeBlock([
    'score = 75',
    '',
    'if score >= 60:',
    '    print("及格")',
    '',
    'print("程式結束")   # 不管條件如何，這行都會執行',
  ], "if_only.py")}
  ${outBlock("及格\n程式結束", "Output（score = 75）")}
  ${C("tip", "什麼時候省略 else？", `<p>當「條件不成立時不需要做任何事」的時候。例如「如果分數及格就印出恭喜」—— 不及格就什麼都不印，直接往下走。</p>`)}

  ${A("a5_if_only", "只有 if：條件不成立就直接跳到後面")}
`),

S("l5-s6", "6", "elif：三個以上的選項", "兩個選項用 if-else，三個以上就用 elif。",
  `<p>課本定義：<strong><code>elif</code> 讓你可以有兩個以上的可能選項，而且可以加任意多個。</strong></p>

  ${codeBlock([
    'if condition1:',
    '    # 條件 1 為 True 時執行',
    'elif condition2:',
    '    # 條件 2 為 True「而且條件 1 不成立」時執行',
    'elif condition3:',
    '    # 條件 3 為 True「而且前兩個都不成立」時執行',
    'else:',
    '    # 以上全部不成立時執行',
  ], "elif_form.py")}

  ${C("tip", "🎯 理解 elif 的關鍵一句話", `<p><b>到了 condition2 的時候，你已經知道 condition1 是 False 了。</b></p>
  <p>到了 condition3 的時候，你已經知道 condition1 和 2 都是 False 了。</p>
  <p>這就是為什麼寫 <code>elif score &gt;= 70:</code> 的時候<strong>不需要</strong>再寫 <code>and score &lt;= 90</code> —— 能走到這一行，就代表前面 <code>score &gt; 90</code> 已經不成立了。</p>`)}

  ${A("a5_elif_stair", "elif 階梯：一層一層往下問")}

  <h3>Example 2：三個選項的比較</h3>
  ${codeBlock([
    '#Example: comparing two numbers.',
    '',
    'num1 = float(input("Enter the first number: "))',
    'num2 = float(input("Enter the second number: "))',
    '',
    'if num1 > num2:          # 條件 1',
    '    print("The first number is greater than the second number.")',
    'elif num1 == num2:       # 條件 2（新增的）',
    '    print("The two numbers are equal.")',
    'else:                    # 其他所有沒被涵蓋的情況',
    '    print("The first number is smaller than the second number.")',
  ], "example2.py")}
  ${outBlock("Enter the first number: 53\nEnter the second number: 37\nThe first number is greater than the second number.\n\nEnter the first number: 53\nEnter the second number: 53\nThe two numbers are equal.\n\nEnter the first number: 53\nEnter the second number: 79\nThe first number is smaller than the second number.", "Output")}

  ${A("a5_if_elif_else", "三條路：>、==、< 各走哪一條")}

  <h3>Example 3：成績評語</h3>
  ${table([
    ["分數", "評語"],
    ["高於 90", "Excellent!"],
    ["70 – 90", "Not bad!"],
    ["低於 70", "Need improvement :)"],
  ])}
  ${codeBlock([
    '#Example: 3',
    '',
    'score = float(input("Enter a score: "))',
    '',
    'if score > 90:',
    '    print("Excellent!")',
    'elif score >= 70:   # 注意：不需要寫 score <= 90，為什麼？',
    '    print("Not bad!")',
    'else:',
    '    print("Need improvement :)")',

  ${outBlock("Enter a score: 95\nExcellent!\n\nEnter a score: 80\nNot bad!\n\nEnter a score: 65\nNeed improvement :)", "Output")}

  ${C("info", "回答課本的問題：為什麼不用寫 <code>score &lt;= 90</code>？", `<p>因為能執行到 <code>elif score &gt;= 70:</code> 這一行，代表 <code>score &gt; 90</code> <strong>已經是 False</strong>，也就是 <code>score &lt;= 90</code> 必然成立。</p>
  <p>再寫一次不但多餘，還容易寫錯。<strong>這就是 elif 最優雅的地方。</strong></p>`)}

  ${A("a5_score", "成績評分：95 / 80 / 65 各走哪條路")}

  ${C("tip", "順序很重要！", `<p>把條件從<strong>最嚴格</strong>排到<strong>最寬鬆</strong>。如果把 <code>elif score &gt;= 70</code> 寫在 <code>if score &gt; 90</code> 前面，那麼 95 分會在第一關就被攔下來，永遠拿不到 "Excellent!"。</p>`)}

  ${quizHTML("q5_elif", '執行 <code>x = 5</code> 後，以下程式會印出什麼？<br><code>if x &gt; 3: print("A")</code><br><code>elif x &gt; 1: print("B")</code><br><code>else: print("C")</code>', [
      "<code>A</code>", "<code>A</code> 和 <code>B</code>", "<code>B</code>", "<code>C</code>",
    ], 0, "<code>5 &gt; 3</code> 為真，走第一條路印出 A。<strong>因為用了 <code>elif</code>，整個鏈在第一個成立的條件就結束了</strong>，後面的 <code>elif</code>／<code>else</code> 全部跳過（即使 <code>x &gt; 1</code> 也是真的）。")}
`),

S("l5-s7", "7", "兩個 if vs if-elif：什麼時候差很多？", "同樣看起來「有兩條路」，結果可能完全不同。這是考試最愛的陷阱。",
  `<p>看這段程式（課本的例子：找三個數中最大的）：</p>
  ${codeBlock([

    '    max = thirdNumber',
    '',
    'print("The largest number is", str(max) + ".")',
  ], "two_ifs.py")}
  ${outBlock("[Run]\n\nEnter first number: 3\nEnter second number: 7\nEnter third number: 4\nThe largest number is 7.", "Output")}

  ${C("warn", "<code>eval()</code> 是什麼？", `<p><code>eval(input())</code> 會把使用者輸入的<strong>字串當成程式碼執行</strong>，自動判斷型態。它能用，但<strong>很危險</strong>（使用者可以輸入惡意程式碼）。</p>
  <p>現在請一律用 <code>int(input())</code> 或 <code>float(input())</code>。</p>
  <p>另外課本用了 <code>max</code> 當變數名稱 —— 這會<strong>蓋掉內建的 <code>max()</code> 函式</strong>，不是好習慣（但語法上合法）。</p>`)}

  ${A("a5_two_ifs", "兩個獨立的 if：兩個條件都會被檢查")}

  <h3>兩個 if 的流程 vs elif 的流程</h3>
  ${table([
    ["", "兩個獨立的 <code>if</code>", "<code>if</code> + <code>elif</code>"],
    ["第一個條件成立時", "仍然繼續檢查第二個條件", "<b>直接跳過</b>後面所有條件"],
    ["適合用在", "要做<b>好幾件獨立的事</b>", "要在<b>多個選項中選一個</b>"],
    ["例子", "「如果分數及格就加分；如果出席率夠就加薪」", "「成績是 A/B/C/D/F 的哪一個」"],
  ])}

  ${A("a5_if_vs_elif", "同樣的條件，兩個 if 和 if-elif 的差別")}

  ${C("danger", "🎯 判斷口訣", `<p>問自己：<strong>「這些條件成立的時候，應該同時做好幾件事，還是只做一件事？」</strong></p>
  <p>同時做好幾件事 → 用多個 <code>if</code>。<br>
  只做一件 → 用 <code>if</code> + <code>elif</code>。</p>`)}

  <p>用一個具體的例子感受差別：</p>
  ${codeBlock([
    'score = 95',

    '# 版本 A：兩個獨立的 if → 兩行都會印！',

    '# 輸出：及格（永遠印不到「優秀」，因為 95 已經在第一關被攔下）',

  ${quizHTML("q5_twoif", "要用「等級 A/B/C/D/F」判斷成績，應該用哪一種結構？", [

    ], 1, "成績等級是「多選一」—— 一個分數只會對應一個等級。所以要用 <code>if-elif-else</code>。如果用多個獨立 <code>if</code>，一個 95 分可能同時被判成 A 和 B。")}

S("l5-s8", "8", "Lab 5 實作", "三個課堂練習的完整解法。", `

     ${codeBlock([
       "#Lab 5",
       "#Example A",
       "",

     ${C("info", "三個技巧", `<p>① <code>.upper()</code> 讓使用者輸入小寫也沒關係（看 output 的第 4 個例子：輸入 <code>m</code>，輸出 <code>M</code>）。<br>
     ② <code>find()</code> 回傳索引，<code>+1</code> 才是「第幾個」。<br>

     ${C("info", "拆包（unpacking）是什麼？", `<p><code>name_1, grade_1 = lst_1[0].title().strip(), int(lst_1[1].strip())</code> 這一行同時做了四件事：</p>
     <p>① <code>lst_1[0]</code> 拿出姓名 → <code>"Eddy Chan"</code><br>

    '    print("ok")',
    '',
    '# 安全寫法：先檢查，再計算',
    'if (number != 0) and (m == (n / number)):',
    '    print("ok")',
  ], "order_matters.py")}
  ${C("warn", "順序很重要！", `<p>同樣的兩個條件，<strong>調換順序</strong>之後，第一種写法在 <code>number = 0</code> 時會直接崩潰。因為 <code>and</code> 先算左邊，而左邊就是那個危險的除法。</p>
  <p><b>記法：先「檢查條件」，再「使用資料」。</b></p>`)}

  ${quizHTML("q6_sc", '已知 <code>x = 0</code>。執行 <code>if x != 0 and 10 / x > 1:</code> 會發生什麼？', [
      "印出結果", "<code>ZeroDivisionError</code>", "條件為 False，程式繼續往下跑", "<code>SyntaxError</code>",
    ], 2, "<code>x != 0</code> 是 <code>False</code>，<code>and</code> 立刻短路，<strong>右邊的 <code>10 / x</code> 根本不會被計算</strong>，所以不會有除以零的錯誤。整個條件是 <code>False</code>，程式安全地繼續往下執行。")}
`),

S("l6-s3", "3", "簡化條件：讓程式碼更好讀", "同樣的邏輯，可以有更漂亮的寫法。",
  `<h3>技巧一：用 <code>in</code> 取代一長串 <code>or</code></h3>

  <h3>技巧二：鏈式比較（chained comparison）</h3>
  <p>Python 獨有的貼心設計：<strong>可以像數學一樣寫 <code>10 &lt; x &lt;= 20</code></strong>。</p>
  ${table([
    ["原本寫法", "簡化寫法", "意思"],
    ["<code>(x &gt; 10) and (x &lt;= 20)</code>", "<code>10 &lt; x &lt;= 20</code>", "x 介於 10 和 20 之間（不含 10）"],
    ["<code>(x &lt;= 10) or (x &gt; 20)</code>", "<code>not(10 &lt; x &lt;= 20)</code>", "x <b>不在</b>這個範圍"],
  ])}
  ${codeBlock([
    'x = 15',
    'print(10 < x <= 20)         # True',
    'print(not(10 < x <= 20))    # False',
  ], "chained.py")}
  ${C("danger", "⚠️ 其他語言不能這樣寫！", `<p>在 C、Java、JavaScript 裡，<code>10 &lt; x &lt;= 20</code> 的結果跟你預期的完全不同（它會先算 <code>10 &lt; x</code> 得到 1 或 0，再拿 1 或 0 去和小於等於 20 比較，結果<b>永遠是 True</b>）。</p>
  <p><strong>這是 Python 專屬的語法糖</strong>，很好用，但要知道只有 Python 能這樣。</p>`)}

  ${A("a6_chaincmp", "鏈式比較：10 < x <= 20 在 Python 裡的意思")}
`),

S("l6-s4", "4", "迪摩根定律（De Morgan's Laws）", "把 <code>not</code> 推進括號裡，該怎麼變號？",
  `<p>課本定義：</p>
  ${table([
    ["原本", "等價於", "口訣"],
    ["<code>not(cond1 or cond2)</code>", "<code>not(cond1) and not(cond2)</code>", "not 進去 → <b>or 變 and</b>"],
    ["<code>not(cond1 and cond2)</code>", "<code>not(cond1) or not(cond2)</code>", "not 進去 → <b>and 變 or</b>"],
  ])}

  ${C("tip", "🎯 一句話記住", `<p><strong>把 <code>not</code> 推進括號時，裡面的 <code>and</code> 和 <code>or</code> 要互換。</strong></p>
  <p>用日常語言驗證一下：「不是（下雨<b>或</b>颳風）」= 「沒下雨<b>而且</b>沒颳風」。對吧？如果只說「沒下雨」那颳風的情況就漏掉了。</p>`)}

  <h3>用程式驗證</h3>
  ${codeBlock([
    'print(not (1 > 5 or 15 % 5 != 0))',
    'print(not (1 > 5) and not (15 % 5 != 0))',
    'print(1 <= 5 and 15 % 5 == 0)',
  ], "demorgan.py")}
  ${outBlock("True\nTrue\nTrue", "Output")}
  ${C("info", "三個都是 True，因為它們是同一件事", `<p><code>1 &gt; 5</code> 是 False、<code>15 % 5 != 0</code> 也是 False（15 能被 5 整除）。</p>
  <p>所以 <code>not(False or False)</code> = <code>not False</code> = <code>True</code>。<br>
  另一邊：<code>not(False) and not(False)</code> = <code>True and True</code> = <code>True</code>。</p>
  <p>第三行只是把每個 <code>not</code> 都化簡掉：<code>not(1 &gt; 5)</code> = <code>1 &lt;= 5</code>、<code>not(15 % 5 != 0)</code> = <code>15 % 5 == 0</code>。</p>`)}

  ${A("a6_demorgan", "迪摩根定律：把 not 推進括號")}

  <h3>分配律（Distributive Laws）</h3>
  <p>課本也提到這兩條：</p>
  ${table([
    ["原本", "等價於"],
    ["<code>cond1 or (cond2 and cond3)</code>", "<code>(cond1 or cond2) and (cond1 or cond3)</code>"],
    ["<code>cond1 and (cond2 or cond3)</code>", "<code>(cond1 and cond2) or (cond1 and cond3)</code>"],
  ])}
  ${C("analogy", "🎈 跟代數一模一樣", `<p><code>a × (b + c) = a×b + a×c</code> —— 把外面的乘進去。</p>
  <p>邏輯運算子也一樣：<strong>把外面的 <code>and</code>／<code>or</code> 分配進去</strong>，只是要記得 <code>and</code> 和 <code>or</code> 的角色就和平常的「乘」和「加」一樣（<code>and</code> 類似乘、<code>or</code> 類似加）。</p>`)}

  ${C("warn", "但實務上不一定要化簡", `<p>定律是用來<strong>理解</strong>和<strong>驗證</strong>的。寫程式時，通常<b>怎麼好讀就怎麼寫</b>：</p>
  ${codeBlock([
    '# 這樣寫其實更好讀',
    'if is_weekend or (is_holiday and is_sunny):',
    '    print("出去玩")',
  ], "readable.py")}
  <p>硬要展開成分配律的形式反而更難懂。</p>`)}

  ${quizHTML("q6_dm", '以下哪一個和 <code>not (a > 0 and b > 0)</code> 等價？', [
      "<code>not (a &gt; 0) and not (b &gt; 0)</code>",
      "<code>not (a &gt; 0) or not (b &gt; 0)</code>",
      "<code>a &gt; 0 or b &gt; 0</code>",
      "<code>a &lt; 0 and b &lt; 0</code>",
    ], 1, "迪摩根定律：把 <code>not</code> 推進括號時，<strong><code>and</code> 要變成 <code>or</code></strong>。所以 <code>not(A and B)</code> = <code>not A or not B</code>。")}
`),

S("l6-s5", "5", "邏輯運算子的優先順序", "三個運算子碰在一起，誰先算？",
  `<p>課本定義：<strong>Python 中邏輯運算子的優先順序是 <code>NOT</code> &gt; <code>AND</code> &gt; <code>OR</code>，但可以用括號改變。</strong></p>

  ${table([
    ["優先順序", "運算子", "說明"],
    ["1（最高）", "<code>( )</code>", "括號永遠最先"],
    ["2", "<code>not</code>", "先反轉"],
    ["3", "<code>and</code>", "再算「而且」"],
    ["4（最低）", "<code>or</code>", "最後算「或者」"],
  ])}

  ${C("analogy", "🎈 跟數學的順序一樣", `<p>數學裡是「先乘除、後加減」。邏輯裡是「<code>not</code> 先、然後 <code>and</code>、最後 <code>or</code>」。</p>
  <p>把 <code>and</code> 想成乘法（比較嚴格）、<code>or</code> 想成加法（比較寬鬆），順序就很好記。</p>`)}

  <h3>課本的完整範例</h3>
  ${codeBlock([
    'a = 10',
    'b = 20',
    'c = 30',
    '',
    'bool1 = True and (a > b)',
    'bool2 = (not True) or (b != c)',
    'bool3 = (True and (not False)) or (a > b)',
    'bool4 = (a % b == 2) and ((not True) or False)',
    '',
    'print(bool1, bool2, bool3, bool4)',
  ], "precedence.py")}
  ${outBlock("False True True False", "Output")}

  ${A("a6_bool1234", "bool1 ~ bool4：一步一步算出答案")}

  <h3>沒有括號會怎樣？</h3>
  ${codeBlock([
    'print(3 > 1 and 3 < 1 or 4 > 3)      # 先算 and，再算 or',
    'print(not 3 > 1 and 3 < 1 or 4 > 3)  # not 先，然後 and，最後 or',
  ], "noparen.py")}
  ${outBlock("True\nTrue", "Output")}
  ${C("danger", "🚫 強烈建議：永遠加括號", `<p>雖然 Python 有預設順序，但<strong>沒有人記得清楚</strong>（包括寫了很久的人）。加括號有兩個好處：</p>
  <p>① <strong>不會寫錯</strong>。② <strong>別人（和三個月後的你）看得懂</strong>。</p>
  ${codeBlock([
    '# 沒人想看懂這個',
    'if a or b and c or d:',
    '',
    '# 一眼就懂',
    'if a or (b and c) or d:',
  ], "parens.py")}`)}

  ${quizHTML("q6_prec", '已知 <code>a = 1, b = 0, c = 1</code>。<code>a or b and c</code> 的結果是？（記住 AND 先於 OR）', [
      "<code>1</code>", "<code>0</code>", "<code>True</code>", "兩種都可能",
    ], 2, "因為 <code>and</code> 優先於 <code>or</code>，所以等於 <code>a or (b and c)</code> = <code>a or (0 and 1)</code> = <code>a or 0</code>。<code>a</code> 是非零數字（真），所以結果是 <code>True</code>。<br><strong>如果沒有括號的順序規則，結果可能會是 <code>(a or b) and c</code> = <code>(1 or 0) and 1</code> = 也是 True</strong> —— 所以這個例子剛好一樣，但換成 <code>a = 0, b = 1, c = 0</code> 就不同了。")}
`),
