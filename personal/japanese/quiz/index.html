    ["kanji", '<span class="ja">電車</span> 怎麼讀？', "でんしゃ", ["でんくるま","でんしや","てんしゃ"],
     '<span class="ja">電車（でんしゃ）</span> 是電車；<span class="ja">自動車（じどうしゃ）</span> 是汽車。'],
    ["kanji", '<span class="ja">毎日</span> 怎麼讀？', "まいにち", ["まいひ","まいにちー","めいにち"],
     '<span class="ja">毎日（まいにち）</span>。'],
    ["kanji", '<span class="ja">食べる</span> 的 <span class="ja">食</span> 讀音是？', "た（べる）", ["しょく","し","く"],
     '<span class="ja">食</span> 訓讀 <span class="ja">たべる</span>；音讀 <span class="ja">しょく</span>（<span class="ja">食事</span>）。'],
    ["kanji", '<span class="ja">大きい</span> 怎麼讀？', "おおきい", ["おうきい","だいきい","たいきい"],
     '<span class="ja">大きい（おおきい）</span>。注意是長音 <span class="ja">おお</span>，不是 <span class="ja">おう</span>。'],

    /* ---------- 會話 ---------- */
    ["phrase", '早上見到人說什麼？', "おはようございます", ["こんにちは","こんばんは","おやすみなさい"],
     '早上用 <span class="ja">おはようございます</span>；白天 <span class="ja">こんにちは</span>；晚上 <span class="ja">こんばんは</span>。'],
    ["phrase", '第一次見面時說什麼？', "はじめまして", ["さようなら","いただきます","おかげさまで"],
     '<span class="ja">はじめまして</span> 後面通常接 <span class="ja">どうぞ よろしく。</span>'],
    ["phrase", '吃飯前說什麼？', "いただきます", ["ごちそうさま","おかげさまで","しつれいします"],
     '開動前 <span class="ja">いただきます</span>；吃完 <span class="ja">ごちそうさまでした</span>。'],
    ["phrase", '進別人房間前說什麼？', "しつれいします", ["おじゃましました","いただきます","おかげさまで"],
     '進入時 <span class="ja">失礼します</span>；離開時 <span class="ja">お邪魔しました</span>。'],
    ["phrase", '「多少錢？」日文怎麼說？', "いくらですか", ["いつですか","どれですか","なんですか"],
     '<span class="ja">いくら</span> 問價格；<span class="ja">いつ</span> 問時間；<span class="ja">どれ</span> 問「哪一個」。'],
    ["phrase", '「請給我這個」日文怎麼說？', "これをください", ["これをします","これがいます","これがあります"],
     '<span class="ja">～をください</span> 是「請給我～」。'],
    ["phrase", '「我不懂」日文怎麼說？', "わかりません", ["しりません","いりません","できません"],
     '<span class="ja">わかりません</span> 是「不懂／不知道（理解上）」；<span class="ja">しりません</span> 是「不知道（沒這資訊）」。'],
    ["phrase", '「不好意思（叫人時）」日文怎麼說？', "すみません", ["ごめんなさい","どういたしまして","はじめまして"],
     '<span class="ja">すみません</span> 可以叫人也道歉；<span class="ja">ごめんなさい</span> 偏向真的做錯事。'],
    ["phrase", '「不用了／不需要」日文怎麼說？', "いいえ、けっこうです", ["いいえ、だいじょうぶです","はい、そうです","いいえ、ちがいます"],
     '<span class="ja">結構です</span> 是委婉的拒絕。'],
    ["phrase", '「請稍等一下」日文怎麼說？', "ちょっと待ってください", ["ちょっと待ちます","ちょっと待ちたい","ちょっと待たない"],
     '<span class="ja">～てください</span> 是請求。']
  ];

  var TOPIC_NAMES = {
    particle: "助詞", verb: "動詞變化", adj: "形容詞",
    vocab: "單字", kanji: "漢字讀音", phrase: "會話"
  };

  var root = document.getElementById("q-list");
  var elCorrect = document.getElementById("q-correct");
  var elDone = document.getElementById("q-done");
  var elTotal = document.getElementById("q-total");
  var elResult = document.getElementById("q-result");
  var elScore = document.getElementById("q-score");
  var elNote = document.getElementById("q-note");

  var topic = "all";
  var count = 10;
  var seed = Math.floor(Math.random() * 1e9);
  var state = { correct: 0, done: 0 };

  function rng(){ seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; }
  function shuffle(a){
    for (var i = a.length - 1; i > 0; i--){
      var j = Math.floor(rng() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function build(){
    seed = Math.floor(Math.random() * 1e9);
    var pool = BANK.filter(function(q){ return topic === "all" || q[0] === topic; });
    var n = (count === 0) ? pool.length : Math.min(count, pool.length);
    var picked = shuffle(pool.slice()).slice(0, n);

    state = { correct: 0, done: 0 };
    elResult.classList.remove("is-shown");
    root.innerHTML = "";
    elTotal.textContent = picked.length;
    elCorrect.textContent = "0";
    elDone.textContent = "0";

    if (!picked.length){
      root.innerHTML = '<p class="sec-sub">這個主題目前沒有題目。</p>';
      return;
    }

    picked.forEach(function(item, idx){
      var answer = item[2];
      var opts = shuffle([answer].concat(item[3]));

      var box = document.createElement("div");
      box.className = "q-item";

      var head = document.createElement("div");
      head.className = "q-head";
      var tag = TOPIC_NAMES[item[0]] || "";
      head.innerHTML = '<span class="q-no">Q' + (idx + 1) + '</span>';
      var ask = document.createElement("p");
      ask.className = "q-ask";
      ask.innerHTML = item[1] + ' <span class="pos">' + tag + '</span>';
      head.appendChild(ask);
      box.appendChild(head);

      var ul = document.createElement("ul");
      ul.className = "q-options";

      opts.forEach(function(o, oi){
        var li = document.createElement("li");
        var btn = document.createElement("button");
        btn.type = "button";
        btn.className = "q-opt";
        btn.innerHTML = '<span class="o-key">' + "ABCD".charAt(oi) + '</span><span class="opt-txt">' + o + '</span>';
        btn.addEventListener("click", function(){
          if (box.classList.contains("is-answered")) return;
          box.classList.add("is-answered");
          state.done++;
          var right = (o === answer);
          if (right) state.correct++;

          Array.prototype.forEach.call(ul.querySelectorAll(".q-opt"), function(b){
            b.disabled = true;
            var txt = b.querySelector(".opt-txt").textContent;
            if (txt === answer) b.classList.add("is-correct");
            else if (txt === o) b.classList.add("is-wrong");
          });

          var ex = document.createElement("p");
          ex.className = "q-explain";
          ex.innerHTML = (right ? "<strong>答對了。</strong> " : "<strong>正解是「" + answer + "」。</strong> ")
                        + item[4];
          box.appendChild(ex);

          elCorrect.textContent = state.correct;
          elDone.textContent = state.done;
          if (state.done === picked.length) finish(picked.length);
        });
        li.appendChild(btn);
        ul.appendChild(li);
      });

      box.appendChild(ul);
      root.appendChild(box);
    });
  }

  function finish(total){
    var pct = Math.round(state.correct / total * 100);
    elScore.textContent = state.correct + " / " + total + "（" + pct + "%）";
    var note;
    if (pct === 100) note = "全對。可以換下一個主題，或把題數調成「全部」再挑戰一次。";
    else if (pct >= 80) note = "很穩，把答錯的那幾題對應的筆記段落再看一次就好。";
    else if (pct >= 60) note = "基本可以了，但錯的題目通常集中在同一兩個觀念，回頭對照筆記補起來。";
    else note = "先回去看「文法句型」或「單字」那一頁，再回來重做。";
    elNote.textContent = note + "（主題：" + (topic === "all" ? "全部" : TOPIC_NAMES[topic]) + "）";
    elResult.classList.add("is-shown");
    elResult.scrollIntoView({ block: "nearest", behavior: "smooth" });
  }

  document.getElementById("q-reset").addEventListener("click", build);

  Array.prototype.forEach.call(document.querySelectorAll("#q-topics .chip"), function(btn){
    btn.addEventListener("click", function(){
      Array.prototype.forEach.call(document.querySelectorAll("#q-topics .chip"), function(b){ b.classList.remove("is-active"); });
      btn.classList.add("is-active");
      topic = btn.getAttribute("data-topic");
      build();
    });
  });

  Array.prototype.forEach.call(document.querySelectorAll("#q-counts .chip"), function(btn){
    btn.addEventListener("click", function(){
      Array.prototype.forEach.call(document.querySelectorAll("#q-counts .chip"), function(b){ b.classList.remove("is-active"); });
      btn.classList.add("is-active");
      count = parseInt(btn.getAttribute("data-count"), 10);
      build();
    });
  });

  build();
})();
</script>

</body>
